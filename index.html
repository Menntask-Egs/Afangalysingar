const C=[{"i":"6659b9a4e3d27fe06300064a","a":"LÍFS1ES05","t":"Lífsleikni","s":"lífsleikni","o":"einstaklingur, framtíð, félagsþroski, samfélag, samskipti, sjálfstraust, virðing, ábyrgð","d":"Efni áfangans eru fjölbreyttir þættir sem snerta daglegt líf og tengsl nemenda við samfélag sitt. Eftirfarandi viðfangsefni tilheyra námsefni áfangans:\nSjálfsmynd; auka þekkingu og skilning á sjálfum sér, meta og efla sjálfstraust og samskiptafærni\nHeilbrigður lífsstíll; fræðsla um mataræði, svefn og kynheilbrigði\nFjármálalæsi; eigin fjármál, neysluviðmið, fjárhagsaðstoð \nAtvinnumarkaður; kynnast venjum, reglum og skyldum\nBorgaravitund og alþjóðasamfélag, menning og margbreytileiki\nTjáning; farið verður í framkomu, tjáningu eigin skoðana og formlegra erinda \nNáms- og starfsfræðsla; lögð áhersla á uppbyggingu framhaldsskólakerfisins s.s. námsleiðir, námsmarkmið og námstækni.\nViðfangsefni: sjálfsmynd, lífsstíll, náms- og starfsfræðsla, fjármálalæsi, borgaravitund, tjáning.\n","c":5,"l":1,"v":null,"st":"for inspection","m":1717156260.802598,"p":"","k":["helstu hugtökum sem tengjast sjálfsmynd og þekkingu og skilningi á eigin persónu gildi heilbrigðs lífsstíls","þáttum sem hafa áhrif á samskipti og ágreiningsstjórn","fjármálahugtökum ásamt umfjöllun um auglýsingar og neyslusamfélagið","venjum, reglum og hefðum atvinnumarkaðarins","umfjöllun um alþjóðasamfélagið og fjölmenningu sem varða jafnrétti og staðalmyndir","gildi þess að æfa sig í að tjá sig munnlega um viðfangsefni hverju sinni","framhaldsskólakerfinu og námsleiðum","góðri námstækni og mikilvægi markmiðssetninga"],"sk":["rýna í eigin sjálfsmynd og meta eigin stöðu","nýta sér upplýsingar um mikilvægi heilbrigðs lífsstíls og heilsueflingu","skoða samskipti, ágreining og tilfinningar á jákvæðan og hagnýtan hátt","skipuleggja, taka réttar ákvarðanir og bera ábyrgð á eigin fjármálum og neyslumynstri","horfa gagnrýnið á auglýsingar og taka sjálfstæða afstöðu til auglýsinga","greina venjur, reglur og hefðir atvinnumarkaðarins","greina og meta aðstæður er tengjast fjölmenningu og staðalmyndum","undirbúa mál sitt og færa rök fyrir skoðunum sínum og afstöðu","nýta sér góða námstækni og setja sér raunhæf markmið","skoða námsframboð og námsleiðir"],"co":[["greina og meta sjálfan sig og eigin stöðu á raunhæfan hátt",""],["velja heilsueflandi lífsstíl s.s. hollt mataræði, nægan svefn og kynheilsu",""],["greina og meta eigin samskipti og leysa ágreiningsmál",""],["lesa í fjármálatilboð; lesa auglýsingar og draga úr markaðsvæðingu",""],["vera ábyrgur þátttakandi í atvinnulífinu",""],["meta og gera grein fyrir aðstæðum og þáttum sem tengjast borgaravitund, fjölmenningu og alþjóðavitund",""],["flytja mál sitt á sannfærandi og öruggan hátt",""],["setja sér markmið í námi og velja sér nám við hæfi",""]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9004","a":"LIME1MS05","t":"Menningarsamhengi og saga","s":"listir og menning","o":"menningarsamhengi, saga","d":"Markmið áfangans er að nemandinn geri sér grein fyrir eðli þeirra þátta sem mótað hafa listsköpun mannsins í gegnum tíðina og geri sér grein fyrir hvernig listir eru nátengdar félagslegum veruleika á hverjum stað á hverjum tíma.  Áhersla verður lögð á sjálfstæð vinnubrögð í upplýsingaöflun,  úrvinnslu og verkefnaskilum  í einhverskonar tjáningarformi. Kennslugögn eru margvísleg; ýmis uppfletti- og fræðirit og þá sérstaklega listasögubækur s.s. Saga listarinnar, Nútímalistasaga Fjölva,  alfræðiorðabækur, veraldarvefur o.fl. Mikilvægt er að nemendur séu frjóir í efnisleit, komi einnig með efni að heiman ef til er, taki viðtöl við fólk með sérþekkingu á efninu hverju sinni og nýti sér vel bókasafn skólans og Héraðsbókasafnið.  Einnig er möguleiki á að panta bækur, myndbönd og annað efni með millisafnaláni í gegnum bókasafnið ME.  Kennari mun einnig leggja til ýmsar bækur tengdar efninu sem verða í kennslustofu meðan á náminu stendur. Kennsluform:  Áfanganum er skipt niður í  lotur eða verkefni, þar sem 5 tímabil verða tekin fyrir og nemendur kynnast og vinna  með menningarsamhengið á ákveðnum stað á ákveðnum tíma.  Skoðaðir verða  flestir þættir listalífsins;  myndlist, handverk, hönnun,  tíska,  arkitektúr, tónlist, dans og leiklist.  Einnig þarf að gera samanburð við menningu á Íslandi á sama tíma.  Hver nemandi tekur fyrir ákveðna þætti menningarinnar, leitar heimilda, vinnur úr þeim og kynnir fyrir öðrum nemendum í áfanganum í lok hverrar lotu. Uppbygging verkefna:  Fyrstu  tímarnir fara í stutta kynningu á borg og tíma frá kennara. Þá fer fram svokölluð þankahríð nemenda eða brainstorming þar sem nemendur ákveða hvað þeir vilja helst taka fyrir varðandi tímabilið og efnið flokkað.  Vinnsla gagna tekur svo við í ca 6-8 stundir og þá eru allar heimildir nýttar. Mjög mikilvægt er að vera frjór í efnisleit og hugmyndavinnu því gefið er fyrir frumleika og áhuga hvers og eins.  Verkefnum er  síðan skilað í ýmsum tjáningarformum, s.s. skriflega, með fyrirlestri, með myndum, myndböndum, með tölvu og skjávarpa, tónlistarflutningi eða  í öðru formi.","c":5,"l":1,"v":null,"st":"í vinnslu","m":1353575885,"p":"engar","k":["samhengi á milli ólíks birtingarmáta skapandi tjáningar á ólikum stöðum og ólíkum tímum","eðli þeirra þátta sem mótað hafa listsköpun mannsins í gegnum tíðina","hvernig listir eru nátengdar félagslegum veruleika á hverjum stað á hverjum tíma"],"sk":["beita sjálfstæðum vinnubrögðum í upplýsingaöflun","úrvinnslu og verkefnaskilum  í einhverskonar tjáningarformi","beita mismunandi tjáningarformum við úrvinnslu verkefna"],"co":[["átta sig á hvernig hin ólíku listform tengjast hefðum, notagildi, listrænu yfrbragði, samfélagsímynd og þjóðareinkennum"],["skoða  og skilgreina sinn eigin menningarheim"],["taka virkan þátt í umræðu um verkefni sín og annarra nemenda"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c90b5","a":"FÍKN2FF05","t":"Fíknihegðun og forvarnir","s":"fíknifræði","o":"forvarnir, fíknihegðun","d":"Viðfangsefni áfangans er fíknihegðun, forvarnir og meðferðarúrræði við ferns konar fíknivanda; áfengi, vímuefni, tölvu og matar. Farið verður í kenningar um fíkn og fíknihegðun, orsakir fíknihegðunar, skilgreiningar og greiningartæki fyrir fíkn og helstu líkamlegu og sálræn\r\nviðbrögð fíkla. Afleiðingar fíknihegðunar fyrir einstaklinginn og samfélagið verðar skoðaðar sem félagslegt vandamál út frá ýmsum hliðum. Auk þessa verður farið í uppbyggingu forvarna á ýmsum sviðum samfélagsins; stigskiptingu forvarna og opinbera stefnumótun á sviði forvarna. Meðferðarrúrræði og hugmyndafræði meðferðar við fíkn verður kynnt með sérstakri áherslu á þau úrræði sem til eru á Íslandi.","c":5,"l":2,"v":null,"st":"í vinnslu","m":1360942758,"p":"FÉLV1ÞF05 eða HEIM2SI05","k":["sögulegri þróun viðhorfa og þekkingar á áfengis og vímuefnafíkn","sjónarhornum og kenningum um fíknihegðun","útbreiðslu fíknivandans sem félagslegsheilsuvandamáls m.t.t. flokkunar vanda, alvarleika, kyns, aldurs og félagslegrar stöðu","hlutverkum heilsueflingar og forvarna; beitingu forvarna","helstu meðferðarkenningum við fíknivanda","íslenska heilbrigðiskerfinu, stofnunum og fyrirtækjum sem sinna málefnum forvarna og fíknimeðferðar"],"sk":["lesa rannsóknir á sviði lýðheilsu, fíknar og forvarna","greina milli mismunandi fíknivanda og geta leitað viðeigandi úrræða í hverju tilviki"],"co":[["þróa hugmyndir sínar um forvarnir og fræðslu með rannsóknum, kenningum og eigin reynslu"],["gera áætlanir og að framkvæma verkefni sem ætlað er að efla heilsu og forvarnir"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c90b6","a":"FÉLA2AB05","t":"Afbrotafræði","s":"félagsfræði","o":"afbrotafræði","d":"Viðfangsefni áfangans er stór undirgrein félagsfræðinnar sem snýr að rannsóknum á afbrotum og afbrotahegðun. Saga fræðigreinarinnar verður skoðuð, frumkvöðlar kynntir sem og sjónarhorn og þær kenningar s.s. líffræðikenningar, sálfræðikenningar og samvirknikenningar sem settar hafa verið fram um afbrot og afbrotahegðun. Afbrot og flokkun þeirra verður kynnt með sérstakri umfjöllun um fjóra flokka afbrota, ofbeldi, kynferðisbrot, fíkniefnabrot og skipulagða glæpastarfssemi. Refsingar og refsiaðferðir sem viðbrögð við afbrotum eru skoðaðar í sögulegu ljósi með sérstakri áherslu á Ísland. Þróun afbrota á Íslandi skoðuð og einkenni afbrotamanna.","c":5,"l":2,"v":null,"st":"í vinnslu","m":1360943690,"p":"FÉLV1ÞF05 eða HEIM2SI05","k":["sögu afbrotafræðinnar og þekktum rannsóknum á sviðinu","þekktustu kenningum og sjónarhornum; samstöðu-, samskipta- og átakasjónarhornum","mikilvægum í  hugtökum afbrotafræði, s.s. frávik, stimplun og félagslegt taumhald","flokkun afbrota; fórnarlambslausir glæpir, skipulagðir glæpir, alvarleiki brota","refsingum; þróun refsinga, ólík viðbrögð við brotum milli samfélaga og innan samfélaga"],"sk":["skilgreina og flokka afbrot út frá kenningum og sjónarhornum afbrotafræði","afla upplýsinga um afbrot og rannsóknir á sviði afbrotafræði og vísa rétt í þær","tengja hugtök og kenningar afbrotafræðinnar við umfjöllun um afbrot, t.d. í fréttaflutningi og annarri orðræðu"],"co":[["ræða og setja fram upplýsingar um frávik, afbrot og viðbrögð samfélagsins við afbrotum"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c90d8","a":"HEIM2FN05","t":"Fornaldar- og nýaldarheimspeki","s":"heimspeki","o":"fornaldarheimspeki, nýaldarheimspeki","d":"Í áfanganum er viðfangsefnið heimspeki með hliðsjón af fornaldar- og nýaldarheimspeki; Forn-Grikkir og heimspeki 17. og 18. aldar.  Áfanginn er kynning á heimspeki sem er bæði afstæð og fræðileg umræða um tilvist og mannlegan veruleika. Farið verður í kenningar sem móta heimspekilegan hugsunarhátt og samlestur á frægum textabrotum eftir mikilvæga heimspekinga um heimspekinnar. Rökleikni nemenda er efld  en það má gera með þátttöku í umræðum um heimspekileg viðfangsefni, samningu rökfærsluritgerða og þjálfun í að greina málflutning fólks og röksemdir. Lögð er áhersla á að tengja heimspekina við veruleika nemenda og gera hana þannig merkingarbæra og hagnýta í lífi og starfi. Í áfanganum verður farið yfir klassískar spurningar innan heimspeki eins og hvað er þekking og hver er tilgangur lífsins, auk þess sem tilvist Guðs og raunveruleikinn fá umfjöllun.","c":5,"l":2,"v":null,"st":"í vinnslu","m":1361266313,"p":"FÉLV1ÞF05 eða HEIM2SI05","k":["sögulegri þróun heimspekilegra hugmynda","helstu heimspekingum sögunnar; s.s. Sókratesi, Platon, Aristótelesi, Ágústínusi, Descartes, Spinoza, Locke, Hume, Kant, Hegel, Schopenhauer, Mill, Nietzsche, Kierkegaard, Heidegger, Wittgenstein og Sartre","mikilvægum heimspekilegum hugtökum og hugmyndum úr heimspekisögunni; s.s. frummynd, hugmynd, réttlæti, lýðræði, dygð, afstæði, algildi, leikslokakenningu, reglusiðfræði, gildi, hughyggju, frumspeki, frelsi, trú, markhyggju og nautnahyggju"],"sk":["lesa heimspekitexta","endursegja og skýra textabrot","beita gagnrýnu viðhorfi; t.d. greina rökskekkjur í fréttaflutningi og annarri orðræðu tjá sig, hlusta á aðra og vega eigin rök og annarra"],"co":[["tengja hugmyndir heimspekinnar við eigin veruleika"],["sjá tengsl heimspeki og annarra sviða menningar s.s. trúarbragða, lista og vísinda"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"5272947f62933a493f00301c","a":"LEIK1ÚH05","t":"Útlitshönnun sviðslista","s":"leiklist","o":"útlitshönnun sviðslista","d":"Lýsing er ógerð en áfanginn stofnaður til að taka frá nafn.","c":5,"l":1,"v":null,"st":"í vinnslu","m":1383240831.972077,"p":"","k":[],"sk":[],"co":[],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"527b925c62933a493f0039ee","a":"HÖNN3TÖ05","t":"Tölvustudd hönnun","s":"hönnun","o":"tölvustudd hönnun","d":"Áfangalýsing ógerð en áfanginn stofnaður til að taka frá nafn.","c":5,"l":3,"v":null,"st":"í vinnslu","m":1383830108.457862,"p":"","k":[],"sk":[],"co":[],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"58a42f7262933a4e92016d91","a":"ENSK1BÓ05","t":"Enska með áherslu á bókmenntir","s":"enska","o":"bókmenntir 20. aldar","d":"Ný menntastefna er höfð til grundvallar og grunnþættir menntunar eru hafðir að leiðarljósi. Áhersla er á læsi í víðu samhengi, s.s. á bókstafi og hljóð, umhverfi, tákn, reglur, samskiptamiðla, hugtök, tjáskipti, tilfinningar, lesefni og samskipti.  Vinnuferlið miðast við að efla færni og sjálfsmynd nemenda til að takast á við fjölbreytt lesefni við hæfi hvers og eins.  ","c":5,"l":1,"v":13,"st":"í vinnslu","m":1487155058.526818,"p":"Engar","k":["Einföldum bókmenntatexta  á enskri tungu","Ýmsum aldurs- og áhugamiðuðum hugtökum á enskri tungu","Mikilvægi lestrar og bókmennta","Mikilvægi tjáningar og hlustunar"],"sk":["Finna sér bókmenntir við hæfi  á bókasöfnum og öðrum stöðum","Nýta sér bókmenntir á fjölbreyttu formi, s.s. á stafrænum miðlum","Tjá sig í mæltu og/eða rituðu máli","Vinna með texta sem hann hefur lesið og/eða hlustað á","Nýta sér leiðréttingarforrit og önnur hjálpargögn til verkefnavinnu","Lesa upp og/eða tjá sig fyrir framan aðra","Lesa og/eða hlusta á texta sér til gagns og gleði"],"co":[["Nýta sér enskar bókmenntir",""],["Auka sjálfstraust sitt og trú á eigin málfærni í tjáningu og/eða ritun",""],["Nýta sér læsi í víðu samhengi",""],["Hlusta á sjónarmið annarra af víðsýni",""],["Lesa í og/eða nýta sér upplýsingar sem koma fram í útvarpi, sjónvarpi og í netmiðlum",""],["Lesa í umhverfi, samskipti, tilfinningar og reglur í þeim tilgangi að átta sig á hvað er viðeigandi hverju sinni",""],["Hlusta á aðra og tjá eigin skoðanir",""],["Lesa ýmsa texta, s.s. bækur, fréttir og fræðigreinar",""]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9011","a":"FIML1AÞ03","t":"Afreksþjálfun í fimleikum","s":"fimleikar","o":"afreksþjálfun í fimleikum","d":"Um afreksíþróttaáfanga er að ræða, þar sem nemandinn æfir sína íþrótt 6 – 8x í viku með fullu skólanámi. Nemendur geta tekið hann sem stigvaxandi afreksþjálfun í alls 8 skólaannir jafnhliða æfingum með sínu félagsliði, eða sem einstakan áfanga inn í óbundið val.\r\n\r\nLögð er áhersla á að vinna með einstaklinginn með það markmið að efla tæknilega getu hans í fimleikum. Sett eru skýr einstaklingsmarkmið í upphafi áfangans, byggð á mælingum og mati kennara. Að þeim er síðan unnið með skipulegum hætti út önnina. Árangur nemandans er síðan metinn á grundvelli þeirra mælitækja sem notuð eru.\r\n\r\nNemendur áfangans gangast undir mikið æfingaálag. Strangar mætinga og agareglur gilda jafnframt í áfanganum,  með það að markmiði að nemandinn finni það skýrt hvað þurfi til þess að verða afreksíþróttamaður í fremstu röð.\r\n\r\nNemendur skrifa undir samning um bann á notkun hvers kyns vímuefna. Brot á þeim samningi veldur brottvísun úr áfanganum, að undangenginni aðvörun og tilraunum til úrbóta.","c":3,"l":1,"v":1,"st":"Samþykkt af skóla","m":1354618542,"p":"engar","k":["þeim aga sem til þarf til að ná árangri í afreksíþróttum","lífsstíl í samræmi við kröfur afreksíþrótta"],"sk":["auka tæknilega færni sína í fimleikum","bæta andlegt og líkamlegt ástand sitt"],"co":[["tileinka sér heilbrigt líferni og átta sig á hversu miklu það skiptir fyrir afreksíþróttafólk"],["setja sér raunhæf markmið og gera sitt besta til að ná þeim, gegnum markvissa ástundun"],["iðka fimleika á háu getustigi"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9061","a":"HEIM2SI05_1","t":"Siðfræði","s":"heimspeki","o":"siðfræði","d":"Í áfanganum er viðfangsefnið siðfræði sem er sjálfstæð undirgrein heimspeki. Áfanginn er kynning á siðfræði sem er bæði afstæð og fræðileg umræða um siðferðileg málefni. Farið verður í siðfræðikenningar, hagnýti þeirra við lausn siðaklemma og hvernig haga beri rökræðu og framsetningu afstöðu. \r\n\r\nÍ áfanganum verður farið yfir eftirfarandi viðfangsefni:\r\n\r\n•\tSiðferðilega rökræðu; hvað í henni felst, tilgang hennar og hvaðan hún sprettur.\r\n\r\n•\tMenningarlega afstæðishyggju; ólíkar siðareglur  sem gilda í ólíkum menningarsamfélögum.\r\n\r\n•\tNytjastefnu; að velja þá breytni sem leiðir til bestu heildarafleiðingarinnar fyrir alla sem málið snertir.\r\n\r\n•\tRökræðuna um nytjastefnu; krafan um réttlæti, réttindi og vísan í fortíðarástæður.\r\n\r\n•\tImmanúel Kant og skilyrðislausa skylduboðið.\r\n\r\n•\tThomas Hobbes og samfélagssáttmálann.\r\n\r\n•\tDygðasiðfræði.\r\n\r\n•\tUmhverfissiðfræði.","c":5,"l":2,"v":null,"st":"Samþykkt af skóla","m":1358786831,"p":"LÍFS1BE05, LÍFS1BS05 og FÉLV1ÞF05","k":["helstu kenningum og hugtökum í siðfræði","hagnýtri siðfræði og gildi siðfræðikenninga í daglegu lífi","lausn siðferðilegra álitamála"],"sk":["beita siðfræðikenningum","rökræða siðferðileg álitamál, átta sig á annmörkum eigin röksemdarfærslu og finna skynsamlegar lausnir á siðferðilegum álitamálum","móta eigin skoðanir um siðferðileg viðfangsefni og setja þær fram á skipulagðan og á gagnrýninn hátt","lesa mikilvæga frumtexta í siðfræði"],"co":[["taka upplýstar ákvarðanir í siðferðilegum málefnum"],["geta á gagnrýninn hátt greint góðar og slæmar röksemdarfærslur í ræðu og riti"],["sýna þroskaða siðferðisvitund í hegðun, ræðu og riti"],["vera virkur og ábyrgur þátttakandi í lýðræðissamfélagi"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c90a5","a":"STÆR2TÖ05_1","t":"Tölfræði","s":"stærðfræði","o":"undirstöðuatriði tölfræði","d":"Áfanginn er grunnáfangi í tölfræði. Í honum er fjallað um lýsandi tölfræði, þ.e. tölfræðigögn, miðsækni og dreifingu, flokkun gagna, úrtak og þýði, einkennishugtök, s.s. meðal- og miðgildi, frávik, tíðni og tíðnidreifingu og myndræna framsetningu gagna.\r\n\r\nEinnig er fjallað um tölfræðigreiningu, m.a. úrtaksfræði, meginmarkgildissetningu tölfræðinnar, fylgni og aðhvarfsgreiningu, ályktunartölfræði og tilgátur og prófanir. Þá er fjallað um áreiðanleika og ályktanir og fyrirvara við þær. Einnig er fjallað um marktekt, öryggismörk og skekkjumörk.","c":5,"l":2,"v":null,"st":"Samþykkt af skóla","m":1360927862,"p":"HSTÆ2FT05 eða STÆR2AF05","k":["dreifingu, miðsækni, og flokkun","gagnasöfnum, dreifingu og úrtaksfræðum","fylgni og áreiðanleikaprófunum"],"sk":["reikna út og vinna úr gagnasöfnum","nýta töflureikni við gagnavinnslu, prófanir og ályktanir","spá, reikna út og túlka fylgni milli tveggja breyta","beita fjölbreyttum aðferðum í myndrænni framsetningu tölfræðiupplýsinga","reikna út normaldreifingu og t-dreifingu","reikna út öryggisbil og prófanir á tilgátum, svo sem kí-kvaðrat próf og t-prófi","reikna út og túlka öryggis- og skekkjumörk"],"co":[["skilja merkingu og tengsl hugtaka í námsefninu og vinna með þau"],["beita aðferðum tölfræðinnar á skipulegan hátt við lausn viðfangsefna og þrauta"],["geta útskýrt hugmyndir innan námsefnisins skilmerkilega og skipst á skoðunum um þær"],["leggja mat á tölfræðigögn og átta sig á muninum á fylgni og orsaksamhengi"],["skilja röksemdir og framsetningu tölfræðinnar á almennum vettvangi á fræðilegan hátt, bæði í rituðu máli og myndrænt"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c90b4","a":"LÍFS1BS05_2","t":"Borgaravitund, samfélag","s":"lífsleikni","o":"borgaravitund, samfélag, samskipti, umhverfismál, vinnumarkaður","d":"Efni áfangans eru fjölbreyttir þættir sem snerta daglegt líf nemenda og tengslin við samfélagið.\r\n \r\nÞeir þættir sem verða teknir til umfjöllunar eru: \r\n\r\n•\tvinnumarkaður; réttindi og skyldur, ferilskrár, starfsumsóknir og atvinnuviðtöl\r\n\r\n•\tumhverfismál; sjálfbærni, náttúruauðlindir, umhverfissiðfræði og -vitund og neysluvenjur\r\n\r\n•\tborgaravitund; jafnrétti, staðalmyndir og lýðræði, alþjóðasamfélagið og fjölmenning\r\n\r\n•\tfjármálalæsi; eigin fjármál, neysluviðmið, fjárhagsaðstoð, auglýsingalæsi og markaðsvæðing\r\n\r\n•\táföll og sorg og streita\r\n\r\n•\tsamskipti og lausn ágreiningsmála\r\n\r\n•\ttjáning; flutningur formlegra og hálf-formlegra erinda.","c":5,"l":1,"v":null,"st":"Samþykkt af skóla","m":1361271406,"p":"engar","k":["hugtökum sem snerta umhverfismál og umhverfisvitund, s.s. sjálfbærni","umhverfismerkingum, eigin neysluvenjum og áhrifum þeirra á eigin velferð og umhverfið","fjármálahugtökum ásamt  umfjöllun um auglýsinga og neyslusamfélagið","formi tjáningar, hvernig skal undirbúa og flytja munnlegt erindi","helstu þáttum sem snerta gildi, kröfur, réttindi og skyldur á vinnumarkaði","ferli atvinnuumsókna, atvinnuleitar og gerð ferilskrár","umfjöllun um alþjóðasamfélagið og fjölmenningu sem varða jafnrétti og lýðræði","þáttum sem hafa áhrif á samskipti og ágreiningsstjórn","ferli sorgar og áfalla"],"sk":["afla og vinna með upplýsingar um eigin neyslu og nýtingu náttúruauðlinda","taka þátt í samræðum sem varða umhverfisvitund og sjálfbærni á ábyrgan og rökrænan hátt","fylgja því ferli sem þarf til að sækja um atvinnu","greina og meta aðstæður er tengjast fjölmenningu, jafnrétti, lýðræði og staðalmyndum","skipuleggja, taka réttar ákvarðanir og bera ábyrgð á eigin fjármálum og neyslumynstri","horfa gagnrýnið á auglýsingar og taka sjálfstæða afstöðu til auglýsinga","undirbúa málflutning í mismunandi aðstæðum og færa rök fyrir skoðunum sínum","skoða samskipti, ágreining og tilfinningar á jákvæðan og hagnýtan hátt"],"co":[["setja saman ferilskrá, bera sig að í atvinnuleit og atvinnuviðtölum"],["meta áhrif eigin lifnaðarhátta á umhverfið og geta hagrætt neysluvenjum m.t.t. sjálfbærni"],["taka upplýsta afstöðu til almennrar umfjöllunar um umhverfismál"],["lesa í fjármálatilboð; lesa auglýsingar og draga úr markaðsvæðingu"],["flytja mál sitt á sannfærandi og öruggan hátt, beita líkamanum rétt í flutningi"],["meta og gera grein fyrir aðstæðum og þáttum sem tengjast fjölmenningu og  alþjóðavitund"],["sýna góða samskiptahæfni og bregðast við eigin áföllum og styðja aðra"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c90b7","a":"FÉLA2HE05_1","t":"Heilsufélagsfræði","s":"félagsfræði","o":"heilsufélagsfræði","d":"Viðfangesefni þessa áfanga er vaxandi og öflugt sérsvið félagsfræðinnar sem beinir sjónum sínum að heilsu, veikindum og skipulagi heilbrigðismála í félagsfræðilegu samhengi. Bæði er fjallað um almenna heilsufélagsfræði sem og geðheilsufélagsfræði. Farið er í helstu kenningar sem tilheyra þessum sviðum, sögu og þróun þessara rannsóknasviða og hagnýtingu þeirra.\r\nFjallað er m.a. um sjúkdómsvæðingu og kenningar um sjúklingshlutverkið, frávik, félagslega dreifingu sjúkdóma, heilbrigðisþjónustu. Einnig er fjallað um samskipti sjúklinga og fagaðila, geðræn og langvinn veikindi, öldrun, dauðann og skoðuð áhrif kyns, aldurs og stéttar auk áhrifa lífsstíls.","c":5,"l":2,"v":null,"st":"Samþykkt af skóla","m":1360944077,"p":"FÉLV1ÞF05.\r\nEinnig er gott að hafa lokið FÉLA2SS05, SÁLF2SS05 eða UPPE2SS05.","k":["tengslum heilsu og samfélags","helstu ástæðum útbreiðslu heilsuvandamála","þróun heilbrigðisþjónustu, notkun hennar, þýðingu og árangur","mikilvægum heilsufélagsfræðilegum hugtökum og kenningum; s.s. siðbindingu, fagmennsku, fagræði, sjúkdómsvæðingu, sjúklingshlutverkinu, veikindahegðun, félagslegri flokkun og stimplun sjúkdóma"],"sk":["afla upplýsinga um heilsufélagsfræðileg viðfangsefni á grundvelli rannsóknarspurninga","lesa heilsufélagsfræðilegar rannsóknir og skýra frá innihaldi þeirra á skipulagðan hátt"],"co":[["tengja hugmyndir heilsufélagfræðinnar við eigin veruleika og nærumhverfi"],["meta tengsl lífsstíls, félagslegs umhverfis og heilbrigðis"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c90b8","a":"KYNJ2KK05_1","t":"Kyn og kyngervi","s":"kynjafræði","o":"kyn, kyngervi","d":"Í áfanganum er viðfangsefnið kynjafræði sem er þverfagleg fræðigrein sem á rætur sínar í félagsfræði og stjórnmálafræði. Kynjafræðin verður kynnt sem fræðileg og hagnýt umræða um mannlegan veruleika út frá grundvallarbreytunni; kyn. Farið verður í sögu jafnréttisbaráttu kvenna, rauðsokkur,  femínisma, getnaðarvarnir, fóstureyðingar, kynlíf og mótun kynverundar. Auk þess verður fjallað um móðurhlutverkið, föðurhlutverkið, klámvæðingu, og birtingarmynd kynjanna í fjölmiðlum, stjórnkerfi og hversdagslífi. \r\nMegináhersla verður á að tengja kynjafræðina á hagnýtan hátt við aðrar greinar og daglegt líf nemenda og hjálpa þeim að nota ‚kynjagleraugun‘ (sjónarhorn kynjafræðinnar) á fjölmiðla, heilbrigðiskerfi, skólagöngu, vinnumarkað og frávikshegðun s.s. vændi, ofbeldi og afbrot.","c":5,"l":2,"v":null,"st":"Samþykkt af skóla","m":1360945238,"p":"LÍFS1BE05, LÍFS1BS05 og annað hvort FÉLV1ÞF05 eða HEIM2SI05","k":["helstu hugtökum og kenningum kynjafræðinnar; s.s. líffræðilegri nauðhyggju, mótunarhyggju, kyngerfi, staðalmyndum, klámvæðingu, jafnrétti, mismunun, femínisma, karl og kvenrembu, feðraveldi og kynhlutverkum","helstu fræðimönnum í sögu jafnréttis- og kynjafræði, erlendum og innlendum","sögu jafnréttisbaráttunnar; þrjár bylgjur og áfangar","stöðu karla og kvenna í íslensku samfélagi, fyrr og nú"],"sk":["taka þátt í umræðum um algeng álitamál sem tilheyra kynjafræðinni og geti mótað sér afstöðu og gert grein fyrir henni með tilliti til kenninga kynjafræðinnar og hugtaka","beita femínísku viðhorfi (kynjagleraugum) ; t.d. greina staðalmyndir, nauðhyggju og rökskekkjur í fréttaflutningi og annarri orðræðu"],"co":[["líta á samfélagið út frá sjónarhorni kyns og kynferðis með gagnrýnum augum og geti tengt hugmyndir kynjafræðinnar við eigin veruleika"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c90d9","a":"UPPE2TÓ05_1","t":"Tómstundafræði","s":"uppeldisfræði","o":"tómstunda- og félagsmálafræði","d":"Tómstundastarf gegnir mikilvægu menningar- og uppeldishlutverki í nútímasamfélagi. Tómstunda- og félagsmálafræði er ung fræðigrein og felur meðal annars í sér að tileinka sér þekkingu á gildi, þýðingu og hlutverki tómstunda fyrir fólk á öllum aldri í samfélaginu. Einnig fjallar greinin um rannsóknir á tómstundum og mikilvægi þeirra í þróun tómstundastarfs. Í áfanganum verður horft á tómstundastarf í sinni víðustu mynd, bæði úti og inni, tengt náttúru, umhverfi og samfélagi. Rýnt verður í hugmyndafræði unglinga- og þátttökulýðræðis. Í tómstundastarfi með börnum og unglingum er nauðsynlegt að þekkja til forvarna, til að mynda birtingarmynd eineltis og til hvaða ráða er hægt að grípa við lausn þeirra. Þetta á einnig við um forvarnir í tengslum við áfengis- og fíkniefnamisnotkun. Markmiðið er að öðlast heildarsýn yfir þá starfsemi sem fram fer í tómstundum barna, ungmenna og aldraðra og það menningar- og uppeldishlutverk sem tómstundastarf gegnir í lífi þeirra.","c":5,"l":2,"v":null,"st":"Samþykkt af skóla","m":1361269487,"p":"FÉLV1ÞF05","k":["tómstundafræði samtímans í tengslum við íslenskt samfélag","sögulegri og fræðilegri þróun tómstundafræðinnar","helstu rannsóknum á tómstundastarfi","mikilvægi rannsókna í mótun og þróun tómstundastarfs","aðferðum sem koma að notum í tengslum við forvarnir í tómstundastarfi","sérstöðu tómstundafræði, viðfangsefnum hennar og aðferðum","mikilvægi tómstundastarfs og tengslum þess við farsælt uppeldi, vellíðan og    félagslega aðlögun"],"sk":["afla upplýsinga er tengjast rannsóknum á tómstundum og setja í fræðilegt                samhengi","nýta fræðilegan/vísindalegan texta","afla upplýsinga um tómstundir og tómstundastarf og nýta þær í hagnýtum     verkefnum","beita orðræðunni um tómstundir á ýmis viðfangsefni og á vettvangi","miðla fræðilegu efni í ræðu og riti"],"co":[["vinna úr rannsóknargögnum og leggja mat á rannsóknir á tómstundum"],["leggja mat á hagnýtar aðferðir sem henta við margvíslegar aðstæður í                 tómstundastarfi"],["tengja rannsóknarniðurstöður við tómstundastarf á vettvangi"],["beita grundvallaraðferðum í forvörnum og eineltismálum"],["taka þátt í rökræðum um tómstundastarf"],["meta eigin frammistöðu og vinnuframlag sem og annarra á gagnrýninn hátt"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c90da","a":"LÍFS1BE05_1","t":"Borgaravitund, einstaklingur","s":"lífsleikni","o":"borgaravitund, lífsstíll, náms- og starfsfræðsla, sjálfsmynd, tjáning","d":"Efni áfangans eru fjölbreyttir þættir sem snerta daglegt líf og tengsl nemenda við samfélag sitt.\r\n \r\nEftirfarandi viðfangsefni tilheyra námsefni áfangans:\r\n \r\n-\tSjálfsmynd; auka þekkingu og skilning á sjálfum sér, meta og efla sjálfstraust, samskiptafærni, skilgreina áhugasvið og eigin hæfni  á ýmsum sviðum. \r\n\r\n-\tLífsstíll; þar er farið í forvarnafræðslu um vímuefni, áfengi, átraskanir, mataræði, svefn, hreyfingu, líkamsbeitingu og geðheilbrigði. Auk þess kynheilbrigðsfræðsla frá Ástráði.\r\n\r\n-\tTjáning; farið verður í framkomu og tjáningu eigin skoðana.\r\n\r\n-\tNáms- og starfsfræðsla; lögð áhersla á átthagafræði framhaldsskólakerfisins s.s. skólakerfið, námsleiðir, námsmarkmið, sjálfsþekking, námstækni, vinnubrögð og gerð námsáætlana.","c":5,"l":1,"v":null,"st":"Samþykkt af skóla","m":1361270682,"p":"engar","k":["framhaldsskólakerfinu og námsleiðum sem leiða til mismunandi  útgönguleiða","góðum vinnubrögðum, námstækni og mikilvægi markmiðssetninga","tengslum sjálfsþekkingar og náms- og starfsvals sem og áhugasviði, styrkleikum og veikleikum í námi","helstu hugtökum sem tengjast sjálfsmynd og þekkingu og skilningi á eigin persónu","því hvernig skal undirbúa og flytja munnleg erindi við mismunandi aðstæður","gildi hreyfingar, góðrar líkamsvitundar og heilbrigðs lífsstíls sem og skaðsemi fíknihegðunar"],"sk":["skoða námsframboð og námsleiðir og tengja áhugasvið við náms- og starfsval","rýna í eigin sjálfsmynd og meta eigin stöðu t.d. með því að nýta sér ýmis stöðluð og viðurkennd sjálfsmatspróf","nýta sér góð vinnubrögð, góða námstækni og setja sér raunhæf markmið","undirbúa mál sitt og færa rök fyrir skoðunum sínum og afstöðu","nýta sér upplýsingar um forvarnir og heilsueflingu"],"co":[["velja sér leið gegnum framhaldsskólakerfið og búa til námsáætlun fyrir nám að loknum framhaldsskóla"],["greina og meta sjálfan sig á raunhæfan hátt og setja sér markmið m.t.t. áhugasviðs og styrkleika og veikleika"],["nota árangursríka námstækni, stjórna einbeitingu, beita mismunandi minnisaðferðum, skipuleggja og undirbúa próflestur, glósutækni, lestrartækni og tímastjórnun"],["flytja mál sitt á sannfærandi og öruggan hátt"],["velja heilsueflandi lífsstíl s.s. hollt mataræði, nægan svefn og kynheilsu"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9192","a":"NÁTT1JU05","t":"Kynning á jarð- og umhverfisfræði","s":"náttúrufræði","o":"eðlisfræði, jarðfræði, umhverfisfræði","d":"Í áfanganum er farið í þá þætti jarðfræðinnar sem tengjast daglegu lífi nemenda og eðlisfræðin á bak við þá skýrð með einföldum hætti. Sérstök áhersla er lögð á jarðfræði Íslands og umhverfismál. Dæmi um umfjöllunarefni eru sólkerfið okkar, hringrásir efna á jörðinni, veðrakerfi, loftslagsmál, hafstraumar, flekarek, eldvirkni, jarðskjálftar, landmótun og nýting náttúruauðlinda. Þá verða þau vandamál sem mannkyn stendur frammi fyrir um þessar mundir varðandi nýtingu náttúruauðlinda, mengun og loftslagsbreytingar sérstaklega skoðuð.","c":5,"l":1,"v":2,"st":"Samþykkt af skóla","m":1352972541,"p":"engar","k":["sólkerfinu okkar og þeim hringrásum sem snerta daglegt líf jarðarbúa","innri gerð jarðar, innrænum öflum og birtingarmynd þeirra á yfirborði jarðar","útrænum öflum og birtingarmynd þeirra á yfirborði jarðar","umhverfismálum, orkuöflun, nýtingu náttúruauðlinda og loftslagsbreytingum","jarðfræði Íslands og þeim þáttum sem mynda og móta landið dag hvern"],"sk":["beita hugtökum á skilmerkilegan hátt og í rökrænu samhengi","afla sér upplýsinga um viðfangsefni jarðvísindamanna, vinna úr þeim og koma frá sér á greinargóðan máta","fjalla um umhverfismál á upplýstan og vel rökstuddan hátt"],"co":[["tengja undirstöðuþætti jarðvísinda við umhverfi sitt og daglegt líf"],["gera sér grein fyrir þeim þáttum sem eru mikilvægir lífi á jörðinni og þeim ógnum sem steðja að lífríki jarðar"],["lesa í umhverfi sitt og draga ályktanir um þau jarðfræðilegu ferli sem þar ráða ríkjum"],["taka ábyrga og upplýsta afstöðu í umhverfismálum og nýtingu náttúruauðlinda"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9194","a":"SKYN1SE01","t":"Skyndihjálp og endurlífgun","s":"skyndihjálp","o":"endurlífgun, skyndihjálp","d":"Kynning; hvað er skyndihjálp?\r\n\r\nUndirstöðuatriði; streita í neyðartilfellum, tilfinningarleg viðbrögð eftir að hafa veitt skyndihjálp, sálrænn stuðningur og að forðast sýkingar.\r\n\r\nFjögur skref skyndihjálpar; tryggja öryggi á vettvangi, meta ástand slasaðara eða sjúkra, sækja hjálp og veita skyndihjálp.\r\n\r\nGrunnendurlífgun og sjálfvirkt hjartastuð; að athuga viðbrögð, að opna öndunarveg, að athuga öndun, hjartahnoð og blástursaðferð, sjálfvirkt hjartastuð (AED), endurlífgunarkeðjan, hliðarlega og losun aðskotahlutar úr öndunarvegi.\r\n\r\nSkyndihjálp: Áverkar; innvortis- og útvortis blæðingar, sár, brunasár, áverkar á höfði, hálsi eða baki, áverkar á beinum, vöðvum eða liðum, eitranir hitaslag/hitaörmögnun og ofkæling. Bráð veikindi; brjóstverkur (hjartaáfall), bráðaofnæmi, heilablóðfall, flog, sykursýki og öndunarerfiðleikar (astmi). \r\nSkyndihjálp framhald; nánari líkamsskoðun, eitrun, blóðnasir, lost, sár og sáraumbúðir, raflost, höfuðáverkar, tannáverkar, skorðun á hrygg, áverkar á brjóstkassa og kvið, vöðvakrampar, sýklasótt, yfirlið og spelkun útlima.","c":1,"l":1,"v":1,"st":"Samþykkt af skóla","m":1354617589,"p":"engar","k":["hinum fjórum skrefum skyndihjálparkeðjunnar","helstu áverkaeinkennum og réttum viðbrögðum við þeim","helstu einkennum bráðra veikinda og réttum viðbrögðum við þeim"],"sk":["sýna rétt viðbrögð við slysum","meta ástand sjúkra og slasaðra","veita skyndihjálp við slys og bráð veikindi"],"co":[["veitt sálræna skyndihjálp"],["veitt endurlífgun og geti beitt sjálfvirku stuðtæki i neyðartilfellum"],["bundið um sár og flutt sjúkling til við yfirvofandi hættu"],["sett sjúklinga í læsta hliðarlegu og tryggt þannig öryggi þeirra"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9220","a":"ENSK1LM05","t":"Lestur og málfræði","s":"enska","o":"lestur og menning, tjáning","d":"ENSK1LM05 samsvarar hæfnisþrepi A2 í Evrópska tungumálarammanum.\r\n\r\nMálfræði: Nemendur halda áfram að bæta við þekkingu sína á helstu málfræðiatriðum í ensku. Æft er að bæta málfræðireglur með ritun og noktun flóknari setningafræði.\r\n\r\nMenning: Kynnt verða helstu menningarmunirnir í enskumælandi löndum , t.d. samskipta- og siðvenjur. Einnig læra nemendur að þekkja mismunandi enskar mállýskur.","c":5,"l":1,"v":16,"st":"Samþykkt af skóla","m":1354616060,"p":"engar","k":["grunnhugtökum í málfræði (t.d. tíðir, orðaflokkar, greinarmerki o.s.frv.)","grunnatriðum í ritun","byggingu einfaldrar ritgerðar","mismunandi menningarheimum, mállýskum og stafsetningarvenjum","flóknari orðaforða"],"sk":["lesa fjölbreytta texta (t.d. þekkt ensk skáldverk)","tjá lesskilning í rituðu máli","ræða um helstu atriði í skáldverkum, sem og dægurmálum","hlusta eftir og skilja dægurmál frá mismunandi enskum menningarheimum","halda uppi samræðum um einföld dægurmál"],"co":[["túlka megininnhald lesinna texta"],["halda stutta kynningu fyrir samnemendur"],["rökræða mikilvæg málefni á gagnrýninn hátt"],["taka þátt í umræðum um alþekkt eða einföld málefni"],["tjá sig á skýran hátt í ræðu og riti með noktun flóknari orðaforða"],["taka afstöðu af umburðarlyndi með tilliti til enskra mállýskna og menningarsögu"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c926f","a":"SÁLF2BK05","t":"Inngangur að sálfræði","s":"sálfræði","o":"inngangur að sálfræði, jákvæð sálfræði, minni, nám, rannsóknir","d":"Ítarlega er farið í sjónarmið sálfræðinnar. Byggt er á því sem nemendur lærðu um sjónarmiðin í FÉVÍ1AK05 og leitast við að dýpka skilning og hæfni. \r\nFjallað er um alþýðusálfræði og jákvæða sálfræði þar sem nemendur greina jákvæða og neikvæða þætti í eigin lífi og annarra og leita leiða til að bregðast við þeim. \r\nHelstu rannsóknaraðferðir sálfræðinnar eru kynntar og unnin æfingaverkefni í sambandi við þær. Nemendur vinna a.m.k. eitt viðamikið rannsóknarverkefni í áfanganum og skila skýrslu um það. \r\nFarið er í námssálarfræði þar sem kynntar eru viðbragðsskilyrðingar, virkar skilyrðingar og hugrænt nám.  Einnig er fjallað ýtarlega um minni.  \r\nTekin er fyrir þrískipting minnisins og mismunandi minnistækni.  Eftir því sem færi gefst er rætt um ýmis viðfangsefni og vandamál daglegs lífs.\r\n","c":5,"l":2,"v":3,"st":"Samþykkt af skóla","m":1328779300,"p":"FÉVÍ1AK05","k":["jákvæðri sálfræði og viðfangsefnum hennar","rannsóknaraðferðum sálfræðinnar","kenningum og hugtökum um nám","kenningum og hugtökum um minni"],"sk":["greina viðfangsefni sálfræðinnar út frá mismunandi sjónarmiðum greinarinnar","greina jákvæða og neikvæða þætti í eigin lífi og annarra og þekkja leiðir til að  bregðast við þeim","beita mismunandi rannsóknaraðferðum við upplýsingaöflun í sálfræði","beita hugtökum námssálarfræðinnar og greina mismunandi aðferðir til náms","greina og beita mismunandi tegundum minnis"],"co":[["rækta með sér jákvæðari viðhorf til lífsins og bæta þannig eigin líðan"],["hjálpa öðrum að greina jákvæða og neikvæða þætti í eigin lífi og bregðast við þeim sem er metið með"],["skipuleggja og framkvæma einfaldar sálfræðitengdar rannsóknir með leiðsögn og miðla niðurstöðum í skýrslum og fyrirlestrum sem er metið með"],["vinna rétt með heimildir í skýrslum og öðrum sálfræðitengdum verkefnum sem er metið með"],["móta hegðun annarra á árangursríkan hátt, s.s. í barnauppeldi sem er metið með"],["bæta námstækni sína og minnistækni með aðstoð aðferða sem fjallað er um í áfangunum"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9341","a":"BÓKF1DU05","t":"Dagbók og uppgjör","s":"bókfærsla","o":"dagbók, fjármál einstaklinga, grunnatriði bókfærslu, uppgjör","d":"A)\r\nByrjunaráfangi þar sem fjallað er um bókhaldshringrásina og helztu reglur tvíhliða bókhalds. Fjallað er um grundvallarhugtökin eignir, skuldir,gjöld og tekjur .  Æfðar eru almennar færslur í dagbók með notkun helztu grunnreikninga í fjárhagsbókhaldi  og ge ,{"i":"51265b3d62933a77194c936c","a":"JARÐ2VV05","t":"Vatn og veður","s":"jarðfræði","o":"haffræði, jöklafræði, loftslagsfræði, vatn, veður","d":"Í þessum áfanga rannsaka nemendur eðli og eiginleika lofthjúps jarðar, hafsins og jökla. Fjallað er ítarlega um veður, úrkomu, lægðir og önnur fyrirbrigði andrúmsloftsins, loftslag og loftslagsþróun, myndun og bráðnun jökla og tengsl við jarðsögu ísaldar á Íslandi. Nemendur vinna einnig verkefni um kenningar um loftslagsbreytingar og áhrif mannsins á veðurfar og geislun. \r\nMeðal efnisþátta eru efnasamsetning og lagskipting lofthjúpsins, geislun, hiti og orka lofthjúpsins, þrýstingur, vindar og vindakerfi, myndun skýja og úrkomu, loftmassar og skil, lægðir og hæðir, loftslag og loftslagsrannsóknir, loftslags- og gróðurbelti, loftslagsbreytingar, ísaldir, hafið og hafsbotninn, selta, sjávarhiti, sjávarstraumar, hafís, hafefnafræði, lífsskilyrði í sjónum, eðli og hreyfing jökla,  ísaldir og orsakir þeirra, gróðurhúsaáhrif og ósoneyðing.","c":5,"l":2,"v":7,"st":"Samþykkt af skóla","m":1352971770,"p":"engar","k":["eðli, samsetningu og lagskiptingu lofthjúps jarðar","helstu ferlum sem valda veðrum","loftslags- og gróðurbeltum","loftslagsbreytingum og orsökum þeirra","helstu einkennum hafstrauma og sjávargerða við Ísland","helstu breytiþáttum sjávar og sjávarstraumum","eðli og mismunandi gerðum jökla,","kenningum um orsakir ísalda kulda- og hlýskeiða"],"sk":["greina veðurkort, s.s. áætla vindstyrk og vindstefnu út frá jafnþrýstilínum","greina veðurfarsupplýsingar og setja fram á myndrænan hátt","segja til um áhrif seltu og hita á hafstrauma","spá fyrir um hafísdreifingu við landið","fjalla um ástand sjávar og mikilvægi þess fyrir lífríkið","fjalla um veðurlag út frá stöðu veðrakerfa í nágrenni landsins"],"co":[["sýna sjálfstæð og öguð vinnubrögð í upplýsingaöflun, mati, úrvinnslu og framsetningu veðurgagna"],["meta veðurfar og veðurfarsbreytingar og áhrif þeirra á lífsskilyrði á Íslandi og í heiminum"],["gera einfaldar veðurspá
