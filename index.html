ar sem nemendur greina eigin verk, verk samnemenda og teikningar listateiknara, arkitekta og myndlistarmanna með tilliti til aðferða og forsendna teikningarinnar og tilgangs listamannanna með því að nýta kerfi fjarvíddarteikningar. Teiknaðir eru fjölbreyttar fyrirmyndir hluta þar sem form,  yfirborð, áferð og litbrigði krefjast nákvæmrar skoðunar og ólíkrar nálgunar. Lögð áhersla á að nemandi nái að greina styrk sinn í teikningunni, þrói með sér persónuleg og sjálfstæð vinnubrögð.","c":5,"l":2,"v":5,"st":"Samþykkt af skóla","m":1422625142.103111,"p":"SJÓN1TE05","k":["mismunandi aðferðum við teikningu í samsíða teikninga (isometriu)","að teikna hluti í réttum hlutföllum í fjarvídd með einum hvarfpunkti","að teikna  hluti í réttum hlutföllum í fjarvídd með tveimur hvarfpunktum","að teikna hluti í fjarvídd með þremur hvarfpunktum","skyggingu fjarvíddarmynda út frá ákveðnu ljóshorni"],"sk":["nýta sér línuna á blæbrigðarríkan hátt til túlkunar í fríhendisteikningu","nýta sér blýant og reglustikur við að teikna á nákvæman og lýsandi hátt í fjarvídd","notfæra sér mismunandi hörku blýanta til að skapa áherslumun í línuteikningum","teikna réttan skugga út frá ákveðinni afstöðu ljósgjafa í ísómetríuteikningu","nýta sér eins, tveggja og þriggja punkta fjarvídd við túlkun mismunandi fjarvíddarteikninga"],"co":[["greina áherslur og stílbrigði merkingar í fjarvíddarnotkun þekktra listamanna og hönnuða",""],["sýna fram á að hann sé fær um að þróa myndhugmyndir sínar, innan þröngra marka fjarvíddar, áfram á meðvitaðan og gagnrýninn hátt",""],["kynna niðurstöður sínar og hugmyndir á fjölbreyttan hátt",""],["taka á virkan hátt þátt í umræðu um verkefni sín og annarra nemenda",""]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"54cb89b562933a7ff500174c","a":"TEIK2MÓ05","t":"Módelteikning og anatómía","s":"teikning","o":"anatómía, módelteikning","d":"Kennd eru grundvallaratriði módelteikningar og anatómíu. Stefnt er að því að nemendur tileinki sér aðferðir til að mæla hlutföll mannslíkamans jafnframt því að þeir átti sig á samræmi hlutfalla og forma. Ýmist verða teiknaðar styttri stöður módels þar sem áherslan er á heildarsýn eða lengri stöður sem útheimta vandaðri mælingar og meiri námkvæmni.\n\nÍ upphafi er lögð áhersla á að nemendur tileinki sér aðferðir til mælingar á hlutföllum mannslíkamans, læri að nota lóðlínur og hjálparlínur til að meta stefnur og hlutföll. Lögð er áhersla á þrívíðan formskilning, jafnframt því að átta sig á styttingu forma í mismunandi líkamsstöðu módels frá ólíkum sjónarhornum. Ýmist eru teiknaðar stöður módels þar sem lögð er áhersla á að ná réttri heildarmynd eða lengri stöður þar sem nemandi glímir við formun módels með skyggingu. Tekin eru dæmi úr listasögu og samtímalist um mannslíkamann sem viðfangsefni myndlistar.\n\nSamfara verkefnum læra nemendur grunnatriði anatómíu fyrir teiknara og nýta sér þá kunnáttu við teikningu módelsins. Unnið verður að verkefnum sem auka kunnáttu og þjálfun í að sjá þá anatómísku þætti mannslíkamans sem mestu skipta við teikningu og mótun mannslíkamans. Unnið er  aðallega með blýanti og kolum á pappír en þó verða gerðar tilraunir með margvíslegum teikniáhöldum .  Einnig vinna nemendur við leirmótun með mannslíkamann sem fyrirmynd. Þá verður einnig unnið eftir anatómíuteikningum og ljósmyndum af mannslíkamanum. Kennari metur vikulega verkefni nemenda með leiðsagnarmati þannig að mikilvægt er fyrir hvern nemenda að mæta vel og fullklára öll verkefni sem lögð verða fyrir til að ljúka áfanganum.","c":5,"l":2,"v":6,"st":"Samþykkt af skóla","m":1422625205.38083,"p":"SJÓN1TE05","k":["mikilvægi línunnar við teikningu módels","aðferðum hlutfallamælingar við teiknun","hvernig  má nota hjálparlínur til að meta stefnu og stöðu módels í rými"],"sk":["teikna mismunandi líkamstöðu í réttum hlutföllum","forma módel og koma þrívídd þess til skila með skyggingu","nýta sér anatómíu til að teikna hluta módels á sannfærandi hátt"],"co":[["kynna niðurstöður sínar á fjölbreyttan hátt",""],["taka á virkan hátt þátt í umræðu um verkefni sín og annarra nemenda",""],["nýta sér teiknikunnáttu sína í tengslum við ýmis ólík verkefni",""]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"54dc85d862933a7a34000112","a":"ÍSLE1RM05","t":"Málfræði- og bókmenntahugtök","s":"íslenska","o":"málfræði, ritun, stafsetning","d":"Lögð er áhersla á orðflokkagreiningu, beygingarfræði, setningafræði og stafsetningu. Nemendur þjálfast í grundvallarvinnubrögðum ritunar.","c":5,"l":1,"v":66,"st":"Samþykkt af skóla","m":1423738328.693914,"p":"Einkunnin C í íslensku úr grunnskóla eða sambærileg færni.","k":["ýmsum grunnhugtökum varðandi sögu, ljóðstíl og form","merkingarlegum, beygingarlegum og setningafræðilegum einkennum orðflokka","stafsetningarreglum","gildi handbóka og uppflettirita","byggingu málsgreina og efnisgreina","uppsetningu, byggingu og framsetningu stuttra ritsmíða","hvernig skrifa á stuttar ritsmíðar í skrefum","forsendum góðrar framsagnar og samræðutækni"],"sk":["nýta málfræði til að bæta stíl og rita rétt","nýta sér uppflettirit og handbækur","skrifa læsilegan texta","byggja upp og ganga frá stuttum ritsmíðum","þekkja muninn á orðflokkum og geta greint málsgreinar í setningarhluta","lesa og skilja styttri bókmenntatexta"],"co":[["nýta málfræði til að bæta ritsmíðar sínar",""],["skrifa af hugmyndaauðgi og móta sér persónulegan stíl",""],["hlusta á sjónarmið annarra af víðsýni",""]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"54dc88d262933a7a3400011a","a":"ÍSLE1KM05","t":"Málfræði- og bókmenntahugtök","s":"íslenska","o":"bókmenntir, kvæði, ljóð, málnotkun, ritun","d":"Nemendur auka lesskilning sinn og æfast í að beita grunnhugtökum í bókmenntafræði. Nemendur kynnast bragfræði og stílbrögðum í ljóðum.  Nemendur þjálfist í stafsetningu. Nemendur kynnast samræðutækni og þjálfast í að tjá skoðun sína. Nemendur þjálfast í grundvallarvinnubrögðum ritunar.","c":5,"l":1,"v":67,"st":"Samþykkt af skóla","m":1423739090.011705,"p":"ÍSLE1RM05","k":["ýmsum
