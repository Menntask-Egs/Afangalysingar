a léttlestrarbók á þyngdarskala  2 til 3, sem nemendur gera grein fyrir í samtali við kennara (hluti af munnlegu prófi). Þá er horft á eina kvikmynd sem nemendur fjalla um í stuttri tímaritgerð og tjá sig um á munnlegu prófi. Nemendur vinna að hluta til sjálfstætt m.a. við verkefni að eigin vali. Þeir halda stutta kynningu í hópnum um valið efni, t.d. áhugamál, borg eða fylki á þýska málsvæðinu. Við lok áfangans eiga nemendur að vera komnir að mörkum A2 og B1 á samevrópska matsrammanum en áhugasamir nemendur geta þó verið komnir mun lengra. ","c":5,"l":2,"v":9,"st":"Samþykkt af skóla","m":1353509686,"p":"ÞÝSK1VU05","k":["orðaforða sem nauðsynlegur er til þess að ná hæfnimarkmiðum áfangans","mannlífi og menningu í þýskumælandi löndum með áherslu á líf ungs fólks og geta tengt það eigin reynslu","grundvallaratriðum þýska málkerfisins þ.á.m. flóknari atriðum eins og viðtengingarhætti og þolmynd","mismuninn á töluðu og rituðu máli t.d. hvað varðar notkun einfaldrar þátíðar","almennum samskiptavenjum og og mismunandi notkun málsins eftir aðstæðum"],"sk":["fylgja  meginefni lengri texta með almennum orðaforða","ná aðalatriðum í styttri textum í dagblöðum, tímaritum eða á netinu með hjálp orðabókar","skilja talað mál um þekkt efni og ná aðalatriðum í fjöl- og myndmiðlum þegar fjallað er um afmarkað efni","nota orðaforða sem gagnast við almenn samskipti við þýskumælandi fólk","taka þátt í samtali um afmarkað undirbúið efni","halda stutta kynningu eða segja skilmerkilega frá undirbúnu efni , t.d. sögu eða kvikmynd","skrifa lengri samfelldan texta  t.d.um persónulega reynslu eða útdrátt úr bók eða kvikmynd og taka afstöðu","lýsa staðháttum og landslagi","tjá sig markvisst með því að nota málfræðiatriði eins og aukasetningar, tíðir sagna, lýsingarorð, persónufornöfn og forsetningar af meira öryggi en áður í ræðu og riti og flóknari atriði eins og þolmynd og viðtengingarhátt í ritun"],"co":[["skilja daglegt mál ef talað er skýrt og bregðast rétt við, svo og fjölmiðlaumfjöllun um þekkt, afmarkað efni"],["nota mismunandi aðferðir við lestur eftir því hver tilgangurinn er"],["lesa og skilja meginefni lengri texta með almennum orðaforða og geta dregið ályktanir ef efnið er kunnugt"],["greina aðalatriði í flóknari sérhæfðum textum með hjálp orðabókar"],["eiga tjáskipti við þýskumælandi aðila um efni sem tengjast daglegu lífi, ferðalögum, skóla og starfi"],["segja skírt og skilmerkilega frá undirbúnu eða vel þekktu efni"],["geta lýst staðháttum og landslagi í heimabyggð í ræðu og riti"],["skrifa lengri samfelldan texta um afmarkað efni almenns eða persónulegs eðlis og gera grein fyrir skoðun sinni"],["nýta sér öll helstu grundvallaratriði þýskrar málfræði í ritun"],["meta eigið vinnuframlag og framfarir í þýskunáminu"],["tileinka sér jákvætt viðhorf til tungumálanáms og vera óhræddur við að nota það sem hann er búinn að læra til samskipta við þýskumælandi fólk"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93c0","a":"HUGM2HS05","t":"Hugmyndaauðgi og sköpunarkraftur","s":"hugmyndavinna","o":"hugmyndaauðgi, sköpunarkraftur","d":"Í áfanganum er unnið með að virkja sköpunarkraft og hugmyndaauðgi nemenda. Nemendur kynnast aðferðum og tileinka sér hefðbundnar/ persónlegar vinnuaðferðir við úrvinnslu hugmynda.   Nemendur safna hugmyndum í leiðabók/ skissubók og vinna með sambandið á milli hugmyndar, hráefnis, tækni, aðferða og listrænnar sköpunar.  Unnið er markvisst  með form, áferð, mynstur, litanotkun, hugmyndavinnu í tölvu og afrakstrinum safnað í hugmyndabanka/bók.   Á þessari vinnu byggist áframhaldandi verkefnavinna í áfanganum s.s. textílhönnun, vöruhönnun og skúlptúr. Sérstök áhersla er lögð á þemavinnu/hópvinnu sem tengist uppsetningu á sýningu innan eða utan skóla.  Lögð er áhersla á sjálfstæði í vinnubrögðum og að nemendur læri að taka gagnrýni, meta eigin verk og annarra á jákvæðan og uppbyggilegan hátt.  Nemendur fara í vettvangsferðir og á fyrirlestra  í tengslum við námið.","c":5,"l":2,"v":1,"st":"Samþykkt af skóla","m":1353515920,"p":"SJÓN1TE05 og SJÓN2LF05","k":["hvað hugtökin list og hönnun standa fyrir í víðum skilningi","hver munurinn er  á öpun og sköpun","náttúrunni og eigin menningu sem uppsprettu hugmynda","að verða læs á umhverfi sitt og læra að tjá sig um það munnlega, skriflega, verklega","nýjungum í gegnum upplýsingamiðla, handbækur og fagtímarit"],"sk":["tileinka sér hefðbundnar og óhefðbundar vinnuaðferðir við hönnun og hugmyndavinnu s.s. hugmyndasöfnun, lita og formfræði, skissuvinnu á blað og í tölvu","vinna með mismunandi hráefni  og gera tilraunir með efnin hefðbundin  og óhefbundin","koma hugmyndum sínum myndrænt á framfæri í formi skissuvinnu á blaði eða í tölvu","temja sér sjálfstæði, gagnrýna hugsun og öguð vinnubrögð"],"co":[["skilja sambandið milli  hugmyndar, hráefnis, tækni, aðferða og listrænnar sköpunar"],["skilja mikilvægi ferilvinnu  í allri sköpun"],["kynna og  rökstyðja hugmyndina/verkefnið fyrir samnemendum og kennara"],["greina hvernig gagnrýni á verk hans getur gagnast við endanlega útkomu"],["hugleiða útlit og notagildi út frá fagur-  og formfræðilegum forsendum"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93c1","a":"LEIK1ÞJ05","t":"Þjóðleikur","s":"leiklist","o":"uppsetning á leikverki, þjóðleikur","d":"Leiklistaráfangi á fyrsta þrepi. Verkefnið er hluti af Þjóðleik á Austurlandi. Hópurinn vinnur 45 mínútna uppsetningu á nýju leikverki sem skrifað er fyrir verkefnið. Nemendur sjá sjálfir um allan leik, tæknivinnu og útlitshönnun sýningarinnar undir stjórn kennara. Tæknifólk áfangans og aðstoðarleikstjórar fara á helgarnámskeið. Áfanganum lýkur með sýningu í lok spannar og þátttöku í leiklistarhátíð Þjóðleiks.","c":5,"l":1,"v":5,"st":"Samþykkt af skóla","m":1353516650,"p":"engar","k":["ýmsum þáttum leikhúsvinnu eftir vali hvers og eins, leik, leikstjórn, útlits- eða umgjarðarhönnun","grunnþáttum leikritagreiningar","fjölbreytni mögulegra uppsetningaraðferða í leikhúsi"],"sk":["vinna að uppsetningu leikverks í samvinnu við leikstjóra og leikhóp","finna leiðir til uppsetningar í samvinnu við aðra í leikhópnum","sjá og tileinka sér möguleikana í að sjá mismunandi uppsetningar af sömu leikverkum"],"co":[["vinna að leiklistartengdum verkefnum sem leikari, aðstoðarleikstjóri, útlits- og/eða hljóðhönnuður"],["hafa gagn að þátttöku í leiklistarhátíðum"],["taka þátt í gagnrýnum umræðum um leikhús"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93c2","a":"LEIK1LF10","t":"Leikfélag fljótsdalshéraðs","s":"leiklist","o":"uppsetning á söngleik með leikfél. fljótsdalshérðas","d":"Þátttaka í uppsetningu Leikfélags Fljótsdalshéraðs á stóru verkefni. Nemendur taka að sér þau hlutverk sem þeim er úthlutað í leik, tónlistarvinnu eða útlitshönnun sýningarinnar og vinna að þeim. Æfingatímabil verður 6 – 8 vikur og sýningar í kjölfar þess. ","c":10,"l":1,"v":6,"st":"Samþykkt af skóla","m":1353517320,"p":"SVIÐ1GT05 eða LEIK1ÞJ05 eða þátttaka í leiklistarstarfsemi í grunnskóla, leiklistarnámskeið eða Þjóðleikur í heimabyggð.","k":["helstu þáttum vinnuferlis við stórar og umfangsmiklar leiksýningar","sérþekkingu á mismunandi þáttum ferlisins, eftir því hvaða þáttum í ferlinu þeir sjálfir sinna"],"sk":["fara að fyrirmælum leikstjóra eða verkefnastjóra viðkomandi hönnunarsviðs sýningarinnar","sýna sjálfstæði og skapandi hugsun í lausnavinnu ýmissa verkefna sem tengjast uppsetningu stórra leiksýninga"],"co":[["takast á hendur verkefnastjórnun og umsjón ýmissa ferla í leikhúsvinnu"],["beita ýmsum vinnuaðferðum sem leikstjóri notar í vinnu sinni"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93c3","a":"LEIK2LM05","t":"Leikfélag me","s":"leiklist","o":"greining, leikfélag me, persónusköpun, senuvinna","d":"Áfanginn gengur út á ítarlega greiningu, persónusköpun og senuvinnu úr einu leikverki. Farið verður í ýmsar aðferðir til uppsetningar á atriðum verksins og rannsókna á innra lífi persónanna með rannsóknarvinnu, spunavinnu og öðrum aðferðum. Leikrit verður lagt til grundvallar en hvert það verður ræðst af fjölda þátttakenda. Áfanganum lýkur með sýningu.","c":5,"l":2,"v":5,"st":"Samþykkt af skóla","m":1353517979,"p":"SVIÐ1AL05 eða LEIK1ÞJ05 eða LEIK1LF10 eða þátttaka í uppsetningu leikverks eða leiklistarnámskeið.","k":["helstu þáttum dýpri greiningarvinnu leikverka","mikilvægi rannsóknarvinnu í persónusköpun"],"sk":["vinna greiningu á leikverki samkvæmt nokkrum mismunandi aðferðum","búa til heildstæða persónu byggða á rannsóknarvinnu, spuna og ýmsum öðrum aðferðum","nýta greiningarvinnu á verki og persónusköpun til samsetningar heildstæðrar leiksýningar"],"co":[["takast á við stærri og flóknari hlutverk í leiklistarverkefnum framtíðar"],["taka leikverk til greiningar í undirbúningi leiksýninga"],["vinna krefjandi persónusköpun undir handleiðslu leikstjóra"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93c4","a":"SVIÐ1GT05","t":"Grunnatriði og tækni","s":"sviðslistir","o":"grunnatriði, tækni","d":"Áfanginn veitir grunnþekkingu í tækni og vinnu í sviðslista. Nemendur kynnast ýmsum upphitunaræfingum og –leikjum og aðferðum spunavinnu auk þess að læra grunntækni í raddbeitingu, framsögn og hreyfingum á sviði. Einnig verður horft á upptökur af nokkrum sviðslistaverkum og verkefni unnin upp úr þeim.","c":5,"l":1,"v":1,"st":"Samþykkt af skóla","m":1353518512,"p":"engar","k":["hverjar helstu greinar sviðslista eru","mikilvægi líkamlegrar nærveru og einbeitingar á sviði","mikilvægi upphitunar, tilraunavinnu og spuna í sviðslistavinnu","mikilvægi jákvæðrar nálgunar og samvinnu í skapandi starfi","ýmsum leiðum til frumsköpunar í sviðslistum","helstu þáttum þess ferlis sem liggur til grundvallar fullbúnum sviðslistaverkum, frumsköpun verka, persónusköpun og útlitshönnun"],"sk":["gera upphitunaræfingar","vinna styttri sviðslistaverk með hópi með ýmsum aðferðum","beita hugmyndavinnu í útlitshönnun sviðslistaverka","greina ferli sviðslista frá spuna og tilraunavinnu til fullbúinnar sýningar"],"co":[["taka þátt í skapandi hópastarfi af öryggi"],["beita nokkrum grunndvallaraðferðum í sköpun sviðslistaverka"],["taka þátt í umræðum um sviðslistir"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93c5","a":"ÍÞRF2ÞJ05","t":"Þjálfun barna og unglinga","s":"íþróttafræði","o":"þjálfun","d":"Áfanginn er bóklegur og verklegur. Nemendur skulu þjálfast í grundvallar aðferðum kennslu barna og unglinga og undirbúa nemendur undir þjálfara hlutverkið.\r\nNemendur læra um hlutverk þjálfara og leiðbeinanda í íþróttastarfi, þar sem sértök áhersla er lögð á aldurinn þriggja til tólf ára. Lögð er áhersla á skipulag þjálfunar, áætlanagerð og markmiðssetningu. Meðal efnis er þolþjálfun, styrktarþjálfun, tækniþjálfun og liðleikaþjálfun.\r\nNemendur læri um vöxt barna, hreyfiþroska, næringu, félagsþroska og sálrænan þroska.  Farið verður í stefnu íþróttahreyfingarinnar í þjálfun barna og unglinga auk annarra stefna er snúa að þjálfara hlutverkinu. Sérstök áhersla skal lögð á mikilvægi leikrænnar kennslu í þjálfun barna og unglinga, auk þess sem nemendum skal leiðbeint með framsögn og aðferðir til að ná til barna í þjálfun.\r\nFjallað er um þjálfarann sem fyrirmynd og í því samhengi áhrif áfengis, tóbaks og annarra vímuefna á líkamann og afkastagetu þjálfara og iðkenda. Farið skal í siðfræði þjálfarans.\r\nÁfanginn fæst metinn inn í þjálfarakerfi ÍSÍ sem almennur hluti 1a, 1b, og 1c.","c":5,"l":2,"v":3,"st":"Samþykkt af skóla","m":1353577314,"p":"engar","k":["hlutverki þjálfarans","skipulagi og áætlanagerð í þjálfun","muninum á þjálfun barna og unglinga","hreyfiþroska, sálrænum þroska og félaglegum þroska barna","mikilvægi holls mataræðis í þjálfun","mikilvægi þess að þjálfarinn sé fyrirmynd"],"sk":["skipuleggja þjálfun til lengri og skemmri tíma","standa fyrir framan hóp og útskýra æfingar","ná athygli nemenda í kennslu","notfæra sér upplýsingatækni við þjálfun og undirbúning þjálfunar"],"co":[["miðla þekkingu sinni til iðkenda við grunnþjálfun barna og unglinga"],["skipuleggja grunnþjálfun miðað við mismunandi aðstæður og mismunandi getustig iðkenda"],["breyta æfingum svo þær hæfi mismunandi aldursstigum"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93c8","a":"LÍFF3VB05","t":"Vöðvar og bein","s":"líffræði","o":"bein, hreyfingarfræði, líffærafræði, vöðvar","d":"Í áfanganum verður fjallað um starfsemi mannslíkamans með áherslu á bein og vöðva. Sérstök áhersla verður lögð á þau líffæri og líffærakerfi sem tengjast hreyfingum mannslíkamans. Fjallað verður um bein, bönd og liðamót, liðfleti og liðpoka. Einnig verður fjallað um hreyfingu í liðamótum og stefnu hreyfinga. Fjallað verður um einstaka vöðva,\r\nupptök þeirra, festu og starf. Fjallað er um hugtök og grundvallaratriði hreyfifræðinnar og komið inn á tækni íþróttagreina. Enn fremur er fjallað um rétta lyftitækni, starfsstellingar og hreyfingar við vinnu.","c":5,"l":3,"v":12,"st":"Samþykkt af skóla","m":1353582228,"p":"ÍÞRF2ÞJ05 eða LÍFF2EL05","k":["hlutverki beinagrindar og hreyfingum helstu liðamóta","helstu vöðvum og vöðvahópum líkamans","grundvallaratriðum hreyfifræðinnar"],"sk":["staðsetja helstu bein, bönd og liðamót","beita helstu lögmálum hreyfifræðinnar í leik og starfi"],"co":[["nýta  sér rétta lyftitækni við vinnu sína"],["beita réttum  starfsstellingum við athafnir daglegs lífs"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93c9","a":"LÍFF3LÞ05","t":"Lífeðlis- og þjálffræði","s":"líffræði","o":"lífeðlisfræði, þjálffræði","d":"Áfangamarkmið:\r\nÍ áfanganum er lögð áhersla á að nemendur læri um starfsemi hjarta og blóðrásarkerfis, lungna og taugakerfis og áhrif markvissrar þjálfunar á þessi líffærakerfi. Einnig verður fjallað um gerð vöðvaþráða og áhrif mismunandi þjálfunar á starfsemi þeirra. Sérstök áhersla verður lögð á að tengja lífeðlisfræði við íþróttaiðkun. \r\n\r\nÍ áfanganum verður fjallað um þol, kraft, hraða og liðleika. Farið verður\r\nyfir kannanir tengdar þrekþáttum. Komið er inn á tækni og tækniþjálfun íþróttamanna. Nemendur fræðast um skipulag þjálfunar íþróttamanna og mikilvægi markmiðs-setningar í tengslum við áætlanagerð. Áfanginn er bæði bóklegur og verklegur.\r\n\r\nEfnisatriði:\r\nLífeðlisfræði, efnaskipti, líffærakerfi, hraðir og hægir vöðvaþræðir, hjarta og blóðrásarkerfi, endurmyndun ATP, orkuþörf við mismunandi álag, þol, þolþjálfun, loftháð þol, loftfirrt þol, grunnþol, sérhæft þol, þjálfunaraðferðir, kraftur, kraftþjálfun, kannanir á þrekþáttum. Liðamót, aðferðir við liðleikaþjálfun, vöðvar, bandvefur, taugakerfi, hraði, hraðaþjálfun, viðbragð, hraðakraftur (snerpa), tækniþjálfun, heildaraðferð, hlutaaðferð, kannanir á hraða og liðleika, skipulag þjálfunar.","c":5,"l":3,"v":13,"st":"Samþykkt af skóla","m":1353580799,"p":"ÍÞRF2ÞJ05 eða LÍFF2EL05","k":["starfsemi hjarta og blóðrásarkerfis","starfsemi lungna","taugakerfi líkamans","vöðvakerfi líkamans"],"sk":["tileinka sér helstu aðferðir sem beita má við uppbyggingu þols og krafts","læra æfingar og leiki sem nota má markvisst til að byggja upp þol og kraft","þekkja helstu þjálfunaraðferðir"],"co":[["nota aðferðir við liðleika og þolþjálfun"],["nota aðferðir við kraft og hraðaþjálfun"],["nota  aðferðir við  tækni og tækniþjálfun"],["nota markvisst skipulag íþróttaþjálfunar"],["framkvæma  kannanir á þrekþáttum"],["nýta sér upplýsingatækni við skipulag þjálfunar"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93ca","a":"SAGA2ÍÞ05","t":"Íþróttasaga","s":"saga","o":"félagasamtök, íþróttasaga","d":"Í áfanganum er farið yfir helstu atriði í íslenskri íþróttasögu. Komið er inn á helstu þætti í erlendri íþróttasögu ss. Ólympíuleika og ýmsar greinar íþrótta.Einnig er komið inn á Íþróttir Grikkja, íþróttir Etrúra og íþróttir Rómverja.\r\n\r\nFjallað er um gidli og hlutverk íþrótta í nútíma samfélagi. Komið er inn á félagslegar rannsóknir á sviði íþrótta á Íslandi, áhrif fjölmiðla á þróun íþrótta, kynjamun og íþróttaiðkun, ásamt tengingu fjármagns og auglýsinga við íþróttir. Fjallað er um stefnur í íþróttum, ss. Afreksmannastefnu íþróttahreyfingarinnar og afreksmannasjóð. Vikið er að skipulagningu íþróttahreyfingarinnar og uppbyggingu hérlendis og hvernig við tengjumst heimssamtökunum.\r\n\r\nEfnisatriði: \r\nÍþróttir á Krít til forna, íþróttir Grikja til forna, íþróttir Etrúra, íþróttir Rómverja, Íþróttir á miðöldum, Húmanisminn og íþróttir, Upplýsingin og íþróttir, Upphaf nútíma íþróttakennslu, Ólympíuleikar nútímans, Ólympíuhreyfinging og hugsjónin.\r\nÍþróttir á Íslandi frá landnámi til nútímans. Farið í íþróttahreyfinguna, árangur íslendinga á Ólympíuleikum. Þá er skoðaðar íþróttir út frá áhrifum á samfélagið, íþróttir mismunandi hópa, íþróttir sem heilsuefling, gildi íþrótta, forvarnir, áhrifamáttur og tengsl fjölmiðla og fjármagns við íþróttir.\r\n","c":5,"l":2,"v":10,"st":"Samþykkt af skóla","m":1353583302,"p":"ÍÞRF2ÞJ05 eða SAGA1MF05","k":["sögu íþrótta í heiminum til forna, allt frá grikkjum","sögu íþrótta á Íslandi fyrr og nú","glímu, sem þjóðaríþrótt Íslendinga","helstu atriðum í sögu Ólympíuleika"],"sk":["skilja gildi íþrótta sem forvarnarstarfs","skilja samfélagslegt gildi íþrótta fyrr og nú","skilja gildi íþrótta sem söluvöru"],"co":[["þekkja uppbyggingu og skipulag íþróttahreyfingarinnar á Íslandi"],["læra um áhrifamátt og tengsl fjölmiðla og fjármagns við íþróttir"],["taka þátt í umræðum um íþróttir í samfélaginu í víðum skilningi"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93cb","a":"SÁLF2ÍÞ05","t":"Íþróttasálfræði","s":"sálfræði","o":"félagsstörf, félög, íþróttasálfræði","d":"Áfanginn er tvíþættur.\r\n\r\nFyrst er fjallað um félög og félagstarf, stofnun þeirra, kynningarmál og samkomuhald á þeirra vegum. Þessum hluta lýkur með verkefni sem tengist efninu.\r\n\r\nSeinna í áfanganum verður fjallað um helstu þætti íþróttasálarfræðinnar.\r\n\r\nSkoðuð verða ýmis áreiti sem áhrif hafa á afreksgetu íþróttamanna. Ennfremur fjallar áfanginn um spennu (streitu) og helstu spennuvalda, slökun og hug-rækt af ýmsu tagi. Skoðað verður hvernig vinna má með sjálfstraust og sjálfsmynd íþróttamannsins í því skyni að bæta árangur. Fjallað verður um muninn á einstaklings- og hópíþróttum og farið í áhrif félagslegra þátta á íþróttamanninn.\r\n\r\nEfnisatriði:\r\nFélog og félagsstarf, hlutverk félagsstjórna, kynningarstarf félaga og samkomuhald,\r\nÍþróttasálfræði, hvatning, íþróttaleiðtoginn/þjálfarinn, skynjun og viðbragðsþjálfun, andlegt ástand, spennustilling, slökun, íþróttir og greind, hugræn þjálfun, hópastarf, keppni eða ekki keppni. ","c":5,"l":2,"v":11,"st":"Samþykkt af skóla","m":1353583732,"p":"ÍÞRF2ÞJ05 eða FÉVÍ1ÞF05","k":["félögum og félagslögum","helstu áreitum sem herja á íþróttamenn","þeim þáttum sem mynda sjálfsmynd íþróttamannsins","mikilvægi hvatningar í íþróttum"],"sk":["þekkja lagaumhverfi og helstu tengingar í starfsemi félaga","vinna markvisst með sjálfstraust og sjálfsmynd íþróttamannsins","nota slökunartækni af ýmsu tagi til að minnka spennustig íþróttamanna"],"co":[["standa fyrir félagslegum uppákomum af ýmsu tagi t.d. innan síns félags"],["minnka eða auka spennustig íþróttamanna í æfingu og leik"],["hvetja iðkendur til dáða, fá þá til gera sitt allrabesta í starfi og leik"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93ce","a":"NÆRI2ON05","t":"Orka og næring","s":"næringarfræði","o":"næringarefni, orka","d":"Í áfanganum er lögð áhersla á að nemendur öðlist þekkingu á grundvallar-atriðum næringarfræðinnar og samspili næringar, heilsu og íþróttaiðkunar. Fjallað er um næringarþörf mannsins, næringargildi og samsetningu helstu matvara.\r\n \r\nFarið verður í uppbyggingu og samsetningu próteins, fitu og kolvetna. Fjallað um vatn, vítamín og steinefni og gerð grein fyrir gildi þessara efna í fæðunni. Matseðlar metnir og samdir og reiknað næringargildi út frá töflum. Fjallað er um áhrif matreiðsluaðferða á næringargildi.\r\n\r\nEfnis hæfi"],["þróa  með sér aga og skipulögð vinnubrögð"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93e5","a":"DANS2MO05","t":"Málfræði og orðaforði","s":"danska","o":"lesskilningur, málfræði, stig b1 í evrópska tungumálarammanum","d":"Nemendur lesa fjölbreytta texta um fréttatengd efni, danska menntakerfið og bókmenntatexta. Áhersla lögð á virkan og hagnýtan orðaforða. Farið verður í flóknari atriði málfræði og málnotkunar. Nemendur vinna sjálfstætt að viðameiri verkefnum í formi  kynninga og ritunarverkefna. Nú er lögð áhersla á sjálfstæð vinnubrögð og að nemendur leggi fram verkefnamöppur í lok áfangans. Nemendur þjálfast í samræðutækni og að tjá afstöðu sína og skoðanir.","c":5,"l":2,"v":13,"st":"Samþykkt af skóla","m":1353928403,"p":"DANS1LM05","k":["dönsku þjóðlífi og menningu og hvernig danskan opnar aðgang að norræna menningarsvæðinu (menntun og atvinnulífi)","hvað er sameiginlegt og hvað er ólíkt með hinum norrænu þjóðum","orðaforða til undirbúnings áframhaldandi náms á Norðurlöndum","uppsetningu og skipulagi ritaðs máls","mikilvægi þess að beita mismunandi lestraraðferðum eftir tilgangi lesturs (dæmi: er verið að lesa nákvæmar leiðbeiningr eða auglýsingar í kvikmyndahúsi)"],"sk":["skilja eðlilegt talað mál við mismunandi aðstæður og algengustu orðasambönd","lesa fjölbreytta texta um ólík efni og beita þeim lestraraðferðum sem henta hverju sinni","tjá sig munnlega skýrt og með nokkru öryggi um málefni sem hann hefur kynnt sér","rita texta af ólíkum gerðum (t.d. starfsumsókn, umfjöllun um skáldsögu eða kvikmynd, sendibréf o.s. frv.) og fylgja helstu málnotkunarreglum","beita  meginreglum danskrar málfræði og setningafræði","túlka mismunandi bókmenntatexta"],"co":[["skilja daglegt mál svo sem samræður og fjölmiðlaefni"],["skilja inntak erinda og annars flóknara efnis sem hann hefur kynnt sér"],["afla sér upplýsinga úr margvíslegum rituðum textum svo sem blaðagreinum,  bókmennta- eða fræðitextum"],["draga eigin ályktanir af tex ta um ólík efni og beita þeim lestraraðferðum sem henta hverju sinni","tjá sig munnlega á dönsku um málefni sem hann hefur kynnt sér","rita texta af ólíkum gerðum. Styttri texta svo sem starfsumsókn, auglýsingu, umfjöllun um skáldsögu eða kvikmynd, sendibréf o.s. frv. og lengri texta svo sem bókmenntaritgerð eða aðra fræðilega ritgerð þar sem leita skal heimilda og nota þær","fylgja skal helstu málnotkunarreglum við þessi skrif","beita  meginreglum danskrar málfræði og setningafræði","túlka mismunandi bókmenntatexta"],"co":[["skilja daglegt mál svo sem samræður og fjölmiðlaefni"],["skilja inntak erinda og annars flóknara efnis sem hann hefur kynnt sér"],["afla sér upplýsinga úr margvíslegum rituðum textum svo sem blaðagreinum,  bókmennta- eða fræðitextum"],["draga eigin ályktanir af textum og  setja þær fram bæði munnlega og skriflega"],["taka þátt í daglegum samræðum við fólk sem hefur dönsku að móðurmáli"],["skiptast á skoðunum og tjá hugmyndir sínar á áheyrilegan hátt"],["halda undirbúnar kynningar blaðalaust fyrir áheyrendur"],["skrifa læsilega og málfræðilega rétta lengri texta um valið efni á persónulegan og skapandi hátt"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93ea","a":"ENSK2MO05","t":"Málfræði og orðaforði","s":"enska","o":"málfræði, orðaforði, stig b1 í evrópska tungumálarammanum","d":"Markmið áfangans er að nemendur æfi frekar þá málfræðiþekkingu sem þeir öðluðust í grunnskóla ásamt með ríkri áherslau  á orðaforða.  Nemendur munu kynnast menningu og málfari mismunandi enskamælandi landa.  Margvíslegar greinar og bókmenntir tengdar þessum menningarsvæðum verða teknar fyrir til lestrar og umræðu.  Áhersla verður lögð á sjálfstæð vinnubröð nemenda.  Þá verða þeir einnig þjálfaðir í hópvinnu.   Samskiptahæfni verður þjálfuð með því að nemendur þurfa að rökstyðja skoðun sína bæði í ræðu og riti.  Nemendur þjálfast í að skrifa margbreytilega texta.","c":5,"l":2,"v":15,"st":"Samþykkt af skóla","m":1353943783,"p":"ENSK1MM05","k":["mismunandi viðhörfum og gildum fólks í enskumælandi löndum","grunnatriðum málfræði enskrar tungu","orðaforða í tengslum við efni áfangans","samspili íslenskrar og enskrar tungu"],"sk":["skilja algengustu orðasambönd sem einkenna enskt mál","greina á milli máls frá mismunandi málssvæðum (hreim, málýskur)","lesa fjölbreytta texta í formi bókmennta, blaðagreina og svo frv.","rita lipra texta","tjá sig munnlega við mismunandi aðstæður","beita sjálfstæðum  vinnubrögðum og mismunandi námstækni"],"co":[["greina á milli menningu ýmissra enskumælandi landsvæða"],["hagnýta sér málfræðiþekkingu sína í ræðu og riti"],["hagnýta sér orðaforða áfangans í ræðu og riti"],["skrifa læsilegan texta um fjölbreytt viðfangsefni"],["nýta sér ýmsa námstækni og beita sjálfstæðum vinnubrögðum"],["túlka  og endursegja  fjölbreytta texta"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93eb","a":"ENSK2OB05","t":"Orðaforði og bókmenntir","s":"enska","o":"bókmenntir, orðaforði, stig b2 í evrópska tungumálarammanum","d":"Markmið áfangans er að efla menningarvitund nemenda með því að þjálfa þá í að tjá sig um eigin samfélag og menningarheim á ensku.  Einnig verður skoðað hvað enskumælandi þjóðir eiga sameiginlegt og það borið saman við Ísland.  Jafnframt er skoðað hvað er ólíkt með þessum þjóðum. Einnig er það markmið áfangans að nemendur öðlist dýpri skilning á flóknari málfræði  enskrar tungu.  Þetta er jafnframt síðasti áfanginn þar sem markvisst er farið yfir málfræði.  Farið verður yfir grundvallaratriði í skrifum texta af ýmsum toga og munu nemendur æfa sig í nýtingu þeirra.  Nemendum verður gerð grein fyrir eigin raun-orðaforða í ensku og vinna þeir markvisst í að auka hann.  Lesin eru einnig ýmis bókmenntaverk.","c":5,"l":2,"v":16,"st":"Samþykkt af skóla","m":1353944401,"p":"ENSK2MO05","k":["orðaforða sem tengist eigin samfélagi og menningu og þeim menningarheimum þar sem enska er töluð","flóknari málfræði  enskrar  tungu","uppbyggingu mismunandi t stmálun, skúlptúr, grafík, ljósmyndun, videólist, kvikmyndagerð, leirlist, hönnun; grafísk hönnun, vöruhönnun, fatahönnun,  arkitektúr, dans; ballet, nútímadans, jass, tónlist; klassísk tónlist, hljóðlist, rokktónlist o.fl. ","c":5,"l":1,"v":1,"st":"Samþykkt af skóla","m":1354116807,"p":"engar","k":["mikilvægi  allrar listsköpunar í samfélaginu","því menningarlega samhengi sem list- og hönnun sprettur úr","þeim  möguleikum sem allt listnám hefur upp á að bjóða"],"sk":["njóta lista og hönnunar","skilja mun á öpun og sköpun","verða opnari og víðsínni hvað varðar menningu og listir í samfélaginu"],"co":[["tileinka sér hæfni til umfjöllunar um eðli listar og/eða hönnunar"],["tileinka sér færni til að skynja, greina og meta list út frá eigin forsendum og annarra"],["vera þátttakendur í listrænum viðburðum"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93f9","a":"ÍÞST3AÐ03","t":"Aðstoðarþjálfun","s":"starfsnám í íþróttum","o":"aðstoðarþjálfun, æfingaáætlun, íþróttakennsla","d":"Þessi áfangi er hugsaður sem undirbúningur fyrir starf í íþrótta- eða frístundaskóla fyrir börn á aldrinum 4-12 ára eða í íþróttastarfi/frístundastarfi hjá íþróttafélögum, fyrir sama aldurshóp. Nemandinn mun setja upp æfingaáætlun í samráði við íþróttaþjálfara/kennara. Hann mun síðan  þjálfa/kenna með íþróttakennara eða þjálfara. Æfingaáætlun og kennsla er metin í lok æfingakennslutímabils.\r\n\r\nMiðað er við 60-70 klukkustunda vinnu nemanda undir stjórn þjálfara yfir eina önn.","c":3,"l":3,"v":1,"st":"Samþykkt af skóla","m":1354205993,"p":"ÍÞRF2ÞJ05","k":["kennslu og þjálfun barna og unglinga á aldrinum 4-12 ára","helstu forsendum áætlanagerðar í íþróttum","hlutverki íþróttaþjálfara sem fyrirmyndar barna og unglinga"],"sk":["leiðbeina börnum og unglingum í í tækniatriðum ýmissa íþróttagreina","kynna nýja leiki og æfingar fyrir æfingahóp barna og unglinga","hafa jákvæð og örvandi samskipti við æfingahópa sína"],"co":[["kenna börnum og unglingum ýmsa leiki og grun  alls 8 skólaannir jafnhliða æfingum með sínu félagsliði, eða sem einstakan áfanga inn í óbundið val.\r\n\r\nLögð er áhersla á að vinna með einstaklinginn með það markmið að efla tæknilega getu hans í körfuknattleik. Sett eru skýr einstaklingsmarkmið í upphafi áfangans, byggð á mælingum og mati kennara. Að þeim er síðan unnið með skipulegum hætti út önnina. Árangur nemandans er síðan metinn á grundvelli þeirra mælitækja sem notuð eru.\r\n\r\nNemendur áfangans gangast undir mikið æfingaálag. Strangar mætinga og agareglur gilda jafnframt í áfanganum,  með það að markmiði að nemandinn finni það skýrt hvað þurfi til þess að verða afreksíþróttamaður í fremstu röð.\r\n\r\nNemendur skrifa undir samning um bann á notkun hvers kyns vímuefna. Brot á þeim samningi veldur brottvísun úr áfanganum, að undangenginni aðvörun og tilraunum til úrbóta.","c":3,"l":1,"v":1,"st":"Samþykkt af skóla","m":1354618093,"p":"engar","k":["þeim aga sem til þarf til að ná árangri í afreksíþróttum","lífsstíl í samræmi við kröfur afreksíþrótta"],"sk":["auka tæknilega færni sína í körfuknattleik","bæta andlegt og líkamlegt ástand sitt"],"co":[["tileinka sér heilbrigt líferni og átta sig á hversu miklu það skiptir fyrir afreksíþróttafólk"],["setja sér raunhæf markmið og gera sitt besta til að ná þeim, gegnum markvissa ástundun"],["spila körfuknattleik í öðrum flokki eða meistaraflokki með keppnisliðum"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93fc","a":"SAGA2LI05","t":"Menningar- og listasaga frá miðöldum fram yfir miðja 19. öld","s":"saga","o":"menningar- og listasaga, miðaldir fram yfir miðja 19. öld","d":"Í áfanganum læra nemendur um forsendur sjónlista, tónlistar og sviðslista frá miðöldum og  fram yfir miðja 19. öld.  Markmið áfangans er að nemandinn geri sér grein fyrir eðli þeirra þátta sem mótað hafa listsköpun mannsins í gegnum tíðina. Áfanganum er skipt upp í  nokkrar lotur þar sem nemendur kynnast og vinna heildrænt með menningarsamhengið á ákveðnum stað á ákveðnum tíma.  Þær listastefnur/tímabil listasögunnar sem verða helst skoðaðar hér eru; miðaldir, endurreisn, barrokk, klassík og rómantíska tímabilið.\r\n \r\nNemendur rannsaka hvert þema undir stjórn kennara, greina helstu þætti listgreinanna, menningar og þjóðfélagshátta á hverju tímabili. Þeir skoða alla þætti listalífsins; myndlist, handverk, hönnun, tónlist, dans og leiklist, hvern í samhengi við annan og við félagslegt og heimspekilegt umhverfi. Einnig eiga nemendur að gera grein fyrir eigin menningarheimi  og rannsaka íslenskan veruleika á hverju tímabili fyrir sig og kynna í niðurstöðum sínum eins og unnt er.  \r\n\r\nVinna í áfanganum fer ýmist fram í hópum eða eru einstaklingsverkefni.  Hver hópur eða einstaklingur tekur fyrir ákveðna þætti menningarinnar, leitar heimilda, vinnur úr þeim og kynnir að lokum fyrir öðrum nemendum.  Áfanginn kallar á kennsluhætti þar sem nemendur eru virkir og sjálfstæðir í þekkingarleit. Nauðsynlegt er að í upphafi séu fyrir hendi góðar upplýsingar um hvar megi finna efni og upplýsingar sem tengjast tilteknum stað, tíma og menningarsamhengi. Nemendur nýta sér fjölbreytta miðla við upplýsingaleit og  við framsetningu  hugmynda sinna. Mikilvægt er, þótt áhersla sé  lögð á ákveðin tímabil, að litið sé á söguna sem heild og að kennari tengi saman þau tímabil sem um ræðir hverju sinni.","c":5,"l":2,"v":11,"st":"Samþykkt af skóla","m":1355415437,"p":"LSTR1LS05","k":["menningarlegri og hugarfarslegri þróun og margbreytileika í mannlegu samfélagi","því hvernig listir eru nátengdar félagslegum veruleika á hverjum stað á hverjum tíma","sínum eigin menningarheimi í tengslum við þau tímabil í sögunni sem um ræðir hverju sinni","samsvörun og mismun á menningu þess staðar sem nemendur rannsaka og á íslenskum veruleika  sama tímabils"],"sk":["kynna niðurstöður sínar á fjölbreyttan hátt","skilja hvernig hin ólíku listform tengjast hefðum, notagildi, listrænu yfirbragði, samfélagsímynd, þjóðareinkennum o.fl.","skipuleggja vinnu og þekki til hugmyndavinnuaðferða í frjálsu hópastarfi","vinna sjálfstætt og tileinka sér gagnrýna hugsun","kynna verkefni sýn á fjölbreyttan og áhugaverðan hátt"],"co":[["gera sér grein fyrir samhengi á milli ólíks birtingarmáta tjáningar á ólíkum stöðum og ólíkum tímum"],["greina sameiginlega þræði í ólíkum listgreinum á hverjum tíma"],["skilja hvernig atriði eins og staðhættir, náttúruauðlindir, tæknistaða og stjórnarfar geta mótað möguleika manna til menningarlegrar tjáningar"],["nýta sér vinnubrögð verkefnisvinnu („prójekt“-vinnu)"],["taka á virkan hátt þátt í umræðu um verkefni sín annarra nemenda"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93fd","a":"TEIK3FJ05","t":"Fjarvídd og umhverfisteikning","s":"teikning","o":"fjarvídd, umhverfisteikning","d":"Í áfanganum læra nemendur að nýta sér eins, tveggja og þriggja punkta fjarvídd við túlkun flókinna rýmishugmynda. Í upphafi læra nemendur forsendur samsíða fjarvíddar, ísómetríu og hvernig hægt er að gera myndir af umhverfinu með þeirri tækni. Síðan einbeita þeir sér að raunsærri fjarvídd, læra frumforsendur hennar og þjálfa kunnáttu sína á þessu sviði með því að vinna myndir sem byggjast á þeim. Áhersla er lögð á fríhendisteikningu og teiknaðir verða manngerðir  hlutir í umhverfinu, byggingar og náttúruform. Hugað verður að mælingum og hlutföllum, stefnum og staðsetningu hluta í rými. Unnið með gagnsæishugsun og formgreiningu, mótun og efnisáferð með blæbrigðaríkri skyggingu. Farið er í vettvangsferðir og teiknuð mismunandi rými og kringumstæður. Tveir þættir vega því þyngst í vinnu áfangans: annars vegar ferlið sköpun, túlkun og tjáning og hins vegar ferlið skynjun, greining og mat þar sem nemendur greina eigin verk, verk samnemenda og teikningar listateiknara, arkitekta og myndlistarmanna með tilliti til aðferða og forsendna teikningarinnar og tilgangs listamannanna með því að nýta kerfi fjarvíddarteikningar. Teiknaðir eru fjölbreyttar fyrirmyndir hluta þar sem form,  yfirborð, áferð og litbrigði krefjast nákvæmrar skoðunar og ólíkrar nálgunar. Lögð áhersla á að nemandi nái að greina styrk sinn í teikningunni, þrói með sér persónuleg og sjálfstæð vinnubrögð.","c":5,"l":3,"v":1,"st":"Samþykkt af skóla","m":1355414294,"p":"SJÓN1TE05","k":["mismunandi aðferðum við teikningu í samsíða teikninga (isometriu)","að teikna hluti í réttum hlutföllum í fjarvídd með einum hvarfpunkti","að teikna  hluti í réttum hlutföllum í fjarvídd með tveimur hvarfpunktum","að teikna hluti í fjarvídd með þremur hvarfpunktum","skyggingu fjarvíddarmynda út frá ákveðnu ljóshorni"],"sk":["nýta sér línuna á blæbrigðarríkan hátt til túlkunar í fríhendisteikningu","nýta sér blýant og reglustikur við að teikna á nákvæman og lýsandi hátt í fjarvídd","notfæra sér mismunandi hörku blýanta til að skapa áherslumun í línuteikningum","teikna réttan skugga út frá ákveðinni afstöðu ljósgjafa í ísómetríuteikningu","nýta sér eins, tveggja og þriggja punkta fjarvídd við túlkun mismunandi fjarvíddarteikninga"],"co":[["greina áherslur og stílbrigði merkingar í fjarvíddarnotkun þekktra listamanna og hönnuða"],["sýna fram á að hann sé fær um að þróa myndhugmyndir sínar, innan þröngra marka fjarvíddar, áfram á meðvitaðan og gagnrýninn hátt"],["kynna niðurstöður sínar og hugmyndir á fjölbreyttan hátt"],["taka á virkan hátt þátt í umræðu um verkefni sín og annarra nemenda"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93fe","a":"TEIK3MÓ05","t":"Módelteikning og anatómía","s":"teikning","o":"anatómía, módelteikning","d":"Kennd eru grundvallaratriði módelteikningar og anatómíu. Stefnt er að því að nemendur tileinki sér aðferðir til að mæla hlutföll mannslíkamans jafnframt því að þeir átti sig á samræmi hlutfalla og forma. Ýmist verða teiknaðar styttri stöður módels þar sem áherslan er á heildarsýn eða lengri stöður sem útheimta vandaðri mælingar og meiri námkvæmni.\r\n\r\nÍ upphafi er lögð áhersla á að nemendur tileinki sér aðferðir til mælingar á hlutföllum mannslíkamans, læri að nota lóðlínur og hjálparlínur til að meta stefnur og hlutföll. Lögð er áhersla á þrívíðan formskilning, jafnframt því að átta sig á styttingu forma í mismunandi líkamsstöðu módels frá ólíkum sjónarhornum. Ýmist eru teiknaðar stöður módels þar sem lögð er áhersla á að ná réttri heildarmynd eða lengri stöður þar sem nemandi glímir við formun módels með skyggingu. Tekin eru dæmi úr listasögu og samtímalist um mannslíkamann sem viðfangsefni myndlistar.\r\n\r\nSamfara verkefnum læra nemendur grunnatriði anatómíu fyrir teiknara og nýta sér þá kunnáttu við teikningu módelsins. Unnið verður að verkefnum sem auka kunnáttu og þjálfun í að sjá þá anatómísku þætti mannslíkamans sem mestu skipta við teikningu og mótun mannslíkamans. Unnið er  aðallega með blýanti og kolum á pappír en þó verða gerðar tilraunir með margvíslegum teikniáhöldum .  Einnig vinna nemendur við leirmótun með mannslíkamann sem fyrirmynd. Þá verður einnig unnið eftir anatómíuteikningum og ljósmyndum af mannslíkamanum. Kennari metur vikulega verkefni nemenda með leiðsagnarmati þannig að mikilvægt er fyrir hvern nemenda að mæta vel og fullklára öll verkefni sem lögð verða fyrir til að ljúka áfanganum.","c":5,"l":3,"v":2,"st":"Samþykkt af skóla","m":1355410086,"p":"SJÓN1TE05","k":["mikilvægi línunnar við teikningu módels","aðferðum hlutfallamælingar við teiknun","hvernig  má nota hjálparlínur til að meta stefnu og stöðu módels í rými"],"sk":["teikna mismunandi líkamstöðu í réttum hlutföllum","forma módel og koma þrívídd þess til skila með skyggingu","nýta sér anatómíu til að teikna hluta módels á sannfærandi hátt"],"co":[["kynna niðurstöður sínar á fjölbreyttan hátt"],["taka á virkan hátt þátt í umræðu um verkefni sín og annarra nemenda"],["nýta sér teiknikunnáttu sína í tengslum við ýmis ólík verkefni"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93ff","a":"SAGA2ML05","t":"Menningar- og listasaga, 19. öld fram yfir miðja 20. öld","s":"saga","o":"19. öld fram yfir miðja 20. öld, menningar- og listasaga","d":"Markmið áfangans er að nemandinn geri sér grein fyrir eðli þeirra þátta sem mótað hafa listsköpun mannsins í gegnum tíðina.  Í áfanganum læra nemendur um forsendur sjónlista, sviðslista og tónlistar frá miðri 19. öld fram yfir miðja 20. öld eða allt til samtímans. Áfanganum er skipt upp í  nokkrar lotur þar sem nemendur kynnast og vinna heildrænt með menningarsamhengið á ákveðnum stað á ákveðnum tíma. Helstu straumar og stefnur;  s.s. impressionismi, expressionismi, súrrealismi, nýklassík, módernismi/nútimalist, popplist, minimalismi og póst-módernismi.\r\n\r\nNemendur rannsaka hvert þema undir stjórn kennara, greina helstu þætti listgreinanna, menningar og þjóðfélagshátta á hverju tímabili og kynna síðan verkefni sín hver fyrir  öðrum. Þeir skoða alla þætti listalífsins, myndlist, handverk, hönnun, tónlist, dans og leiklist, í tengslum við félagslegt og heimspekilegt umhverfi á hverjum stað og tíma. Einnig eiga nemendur að gera grein fyrir eigin menningarheimi  og rannsaka íslenskan veruleika á hverju tímabili fyrir sig og kynna í niðurstöðum sínum eins og unnt er.  \r\n\r\nVinna í áfanganum fer ýmist fram í hópum eða eru einstaklingsverkefni.  Hver hópur eða einstaklingur tekur fyrir ákveðna þætti menningarinnar, leitar heimilda, vinnur úr þeim og kynnir að lokum nIðurstöður sínar. Áfanginn kallar á kennsluhætti þar sem nemendur eru virkir og sjálfstæðir í þekkingarleit. Nauðsynlegt er að í upphafi séu fyrir hendi góðar upplýsingar um hvar megi finna efni og upplýsingar sem tengjast tilteknum stað, tíma og menningarsamhengi.  Nemendur nýta sér fjölbreytta miðla við upplýsingaleit og  við framsetningu  hugmynda sinna. Helstu þræðir í sögu nútímalistar eru raktir eftir öldinni og settir í samhengi við samfélagsgerð og samfélagsbreytingar, stjórnarfar, tæknibreytingar,  heimspeki og hugmyndafræði.  Mikilvægt er, þótt áhersla sé  lögð á ákveðin tímabil, að litið sé á söguna sem heild og að kennari tengi  þau tímabil saman. ","c":5,"l":2,"v":12,"st":"Samþykkt af skóla","m":1355480182,"p":"LSTR1LS05","k":["tæknilegum og hugmyndafræðilegum forsendur sjónlista og sviðslista frá miðri 19. öld fram yfir miðja 20. öld","tengslum samfélagslegra þátta og listgreina frá miðri 19. öld fram yfir miðja 20. öld áhrifum stjórnmálaþróunar og átaka á listgreinarnar","því hvaða áhrif iðnbyltingin hafði á lifnaðarhætti, listsköpun og manngert umhverfi í hinum vestræna heimi  og á Íslandi","þeim listastefnum sem fram komu 1851-1970 og áhrif höfðu á listgreinarnar auk  hönnunar fatnaðar, húsa, farartækja og vöruhönnun almennt"],"sk":["greina helstu stílbrigði sjónlista frá miðri 19. öld fram yfir miðja 20.öld","gera sér grein fyrir áhrifum nútímatækni á listsköpun","gera sér grein fyrir menningarlegu og persónulegu afstæði fagurfræðilegs mats á staðreyndum listasögunnar","þekkja helstu tækninýjungar sem fram komu á þessum tíma og hvaða afleiðingar þessar tækninýjunar höfðu heima og erlendis"],"co":[["fjalla um forsendur nútímalistar á gagnrýninn hátt í ræðu og riti"],["taka þátt í umfjöllun um tengsl heimspeki og listgreina frá miðri 19. öld fram yfir miðja 20. öld"],["gera grein fyrir tengslum íslenskrar hönnunar og erlendrar á þessu tímabili"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9400","a":"SAGA3SL05","t":"Samtímalistir í sögulegu samhengi","s":"saga","o":"samtímalistir í sögulegu samhengi","d":"Í áfanganum læra nemendur um forsendur samtímalista.\r\nÞeir kynnast helstu hræringum í  tónlist, sviðslistum, myndlist, hönnun og  byggingarlist allt frá lokum 20. aldar til dagsins í dag. Meginmarkmið áfangans er að nemendur verði vel með á nótunum um stöðu sjónlista, tónlistar og sviðslista í samtíma sínum, að þeir skilji þær hugmyndir og stílbrigði sem nú tíðkast. Þeir rannsaka listgreinar samtímans í samhengi við meginþætti  samfélagsgerðarinnar: stjórnarfar, fjölmiðlun, lífsgæði, hagsmuni einstakra hópa, tísku og hefðir, hugmyndafræði og heimsmynd. Innlögn í áfanganum verður í fyrirlestrarformi en auk þess er mikil áhersla lögð á sjálfstæðar rannsóknir nemenda á þeim hugmyndum sem uppi eru í listsköpun og umræður um stöðu myndlistarinnar, hönnunar, tónlistar og sviðslistanna í sögulegu ljósi. Nemendur nýta sér fjölbreytta miðla við upplýsingaleit og læra að nýta sér tölvutækni við framsetningu hugmynda sinna. Í áfanganum kynna nemendur sér einnig menningarumhverfi samtíma síns og rannsaka það út frá merkingarfræði og menningarsögu. Námið byggist á virkri þátttöku og skiptist í nokkur stór verkefni  og hluti námsins felst í að upplifa og taka þátt í listviðburðum og vettvangsferðum þeim tengdum. Um er að ræða leiðsagnarmat og nemendur skila af sér „portfolio“  sem inniheldur rannsóknarvinnuna í áfanganum og þeirra eigin upplifun. Efnið verður tekið fyrir á fjölbreyttan hátt og farið verður í þætti sem snúa að fagurfræði og heimspeki,  túlkun og tjáningu. ","c":5,"l":3,"v":17,"st":"Samþykkt af skóla","m":1355480711,"p":"SAGA2LI05 og SAGA2ML05","k":["skipulagningu og framkvæmd fjölbreyttra viðburða sviði lista og hönnunar","mikilvægi hlutverki lista og menningar í eigin samfélagi","samhengi  og tengsl á milli ólíkra listgreina og ólíkra listamanna","ólíkum lífstíl  og hefðum fólks útfrá  ólíkum lífsviðhorfum"],"sk":["greina, bera saman og gagnrýna; hönnun, listviðburði, eða fjölmiðla í samtímanum","njóta listaverka og ólíkra listviðburða","fylgjast vel með því sem er að gerast í listum og menningu, tísku og  hönnun  á líðandi stundu  bæði hérlendis og erlendis","vera opinn fyrir umræðum og gagnrýni á listviðburðum og verkum ólíkra listamanna"],"co":[["fjalla um stöðu listar og hönnunar með vísun í menningar- og sögulega þætti"],["skilgreina eigin lista- og menningarsamhengi á líðandi stundu"],["fjalla um ólík listform í samhengi við hefðir, tækifæri, boðskap, nýjar stefnur og lífsstíl"],["kynna niðurstöður sínar á fjölbreyttan hátt"],["taka á virkan hátt þátt í umræðu um verkefni sín og annarra nemenda"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9401","a":"MYNL2FO05","t":"Tvívíð formfræði, myndbygging og málun","s":"myndlist","o":"myndbygging, málun, tvívíð formfræði","d":"Í áfanganum vinna nemendur að því marki að efla næmi sitt fyrir litanotkun og myndbyggingu á tvívíðum fleti og dýpka skilning sinn á meginatriðum hennar.  Auk eigin athugana á eðli og möguleikum myndbyggingar, með notkun línu, flata og  áferða, gera nemendur samanburð á eigin tilraunum og notkun myndbyggingar í ýmsum myndum úr umheiminum, svo sem ljósmyndum, myndlistarverkum og auglýsingum.  Með þessu er reynt að meta hvernig mismunandi áhrifum er náð með ólíkri myndbyggingu og hvaða þátt  myndbyggingin á í merkingu myndar.  Nemendur vinna m.a.  verkefni út frá nánasta umhverfi, bæði innan húss og utan  og skila af sér myndaseríu unna með mismunandi tækni;  ljósmyndun, skissugerð, vatnslitum, akríllitum og  olíulitum. Einnig verður rýnt í  verk og aðferðafræði  þekktra listamanna  frá ýmsum ólíkum tímabilum  í listasögunni og unnin verkefni út frá þeirri skoðun.  Samhliða rannsóknarvinnunni eru reglulegar umræður þar sem nemendur kynna niðurstöður sínar og gagnrýna hver annan á uppbyggilegan hátt.  Tölvur skulu að einhverju leyti nýttar í vinnu áfangans til myndgreiningar og gagnsöfnunar.","c":5,"l":2,"v":6,"st":"Samþykkt af skóla","m":1355481881,"p":"SJÓN2LF05","k":["forsendum myndbyggingar","markvissu þróunarferli í rannsóknum sínum","góðu valdi á myndbyggingu","hvernig unnið er á persónulegan hátt út frá myndbyggingu"],"sk":["þróa eigin hugmyndir  í teikningu og málun","sýna frumleika í skipulagi og útfærslu myndverka sinna","vinna myndir þannig að gott jafnvægi sé milli einstakra þátta","blanda liti og nota þá markvisst í málverki"],"co":[["vinna myndir þannig að þær verði spennandi og fjölbreyttar án þess að missa tökin á öruggri myndbyggingu"],["fjalla um og meta eigin verk og annarra á upplýstan og greinargóðan hátt"],["ræða um og rökstyðja þær hugmyndir sem hann túlkar í verkum sínum"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9402","a":"MYNL3FM05","t":"Frjáls málun","s":"myndlist","o":"frjáls málun","d":"Ætlað nemendum með undirstöðu í málun og teikningu. Í upphafi áfanga eru lögð fyrir verkefni þar sem  reynir á teikni- og  myndskipunarkunnáttu. Einnig eru frjáls viðfangsefni. Mikilvægt er að nemendur hafi góðan grunn í teikningu, myndbyggingu og formfærði og séu búnir með báða sónlistaáfanga skólans eða annað sambærilegt. Gerðar verða fjölbreyttar æfingar sem stuðla að betri skilningi á eðli og áhrifum lita. Sérstök áhersla verður lögð á litafjarvídd og dýpt í málverki. Verkefnin verða  tengd við dæmi úr listasögunni.  Farið verður í ljósmyndaferð og unnið verður upp úr afrakstri hennar. Sérstök áhersla  á skynjun, greiningu og blöndun lita. Skoðaðar verða ýmsar leiðir til að stækka upp og nýta sér ljósmyndina í málverki. Áhersla lögð á þjálfun í litgreiningu og litablöndun. Í seinni hluta áfangans er unnið í frjálsri málun. Fjallað er um efnasamsetningu lita og íblöndunarefna og þau efni sem málað er á. Einnig er fræðsla um pensla og önnur verkfæri tengd málun. ","c":5,"l":3,"v":3,"st":"Samþykkt af skóla","m":1355490439,"p":"SJÓN1TE05 OG SJÓN2LF05","k":["mikilvægi réttrar meðhöndlunar efna og áhalda í málun","mismunandi stílbrigðum og aðferðum í málun","mismunandi áferðum í málun","helstu efnum sem notuð eru við olíumálun"],"sk":["vinna með helstu efni sem notuð eru við olíumálun","nýta sér teiknikunnáttu sína, þekkingu á fjarvíddarreglum og   myndbyggingu í málverkinu","ná valdi á blöndun lita","nýta sér litasamsetningar á markvissan hátt"],"co":[["þróa hugmynd og útfæra í málverk"],["skilgreina málverk ólíkra listamanna"],["fjalla um ólík listform í samhengi við hefðir og nýjar stefnur"],["kynna niðurstöður sínar á fjölbreyttan hátt"],["taka á virkan hátt þátt í umræðu um verkefni sín og annarra nemenda"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9403","a":"MYNL3ÞR05","t":"Þrívíð hönnun - skúlptúr","s":"myndlist","o":"skúlptúr, þrívíð hönnun","d":"Þrívíð verkefni verða unnin frá hugmynd til útfærslu. Leitast er við að dýpka skilning nemenda á meginatriðum þrívíðrar myndbyggingar um leið og næmi  fyrir mismunandi eiginleikum efna er eflt. Hönnunarsagan skoðuð í tengslum við verkefnin. Þjálfun í þeirri skissu- og hugmyndavinnu sem öll myndræn sköpun byggist á, hvort sem um er að ræða hönnun eða frjálsa myndlist. Í áfanganum er unnið með grunnforsendum tvívíðrar myndbyggingar og þrívíðrar hönnunar.  Fjölbreyttar æfingar eru gerðar til að kanna myndflötinn, skoðað hvernig form og hlutföll hafa áhrif á jafnvægi hans og áhersla breytist eftir því hvernig lína og form skipta fletinum upp. Unnið er með hugtök eins og  hrynjanda, jafnvægi og ójafnvægi, léttleika  og þunga bæði í rými og í tvívíðum verkum.  Einnig er kannað með endurtekningu hvernig hægt er að byggja upp mynstur á fleti og kenningar hönnuðarins William Morris kannaðar í því sambandi. Einnig er módernisminn í lista- hönnunar og byggingarlistasögu lagður til grundvallar verkefnum.\r\n\r\nVerkefnin þróast frá tvívíðri formfræði yfir í þrívídd og niðurstöður tvívíðra æfinga nýtast sem grunnur að frekari könnunum á formi og hlutföllum í rými.\r\nNemendur læra meginatriði myndbyggingar í rými og þróa hugmyndir sínar áfram með tilliti til þess efniviðar sem við á hverju sinni. Að lokum vinna nemendur tillögur að einföldum hönnunarverkefnum eða skúlptúrum. Í tvívíðum æfingum er unnið með óhlutbundin form, svartan lit á hvítt og í þrívíðum verkefnum er byggt úr einföldum efnum, pappa, við og vír.","c":5,"l":3,"v":4,"st":"Samþykkt af skóla","m":1355491023,"p":"SJÓN1TE05 OG SJÓN2LF05","k":["hugtökum eins og jákvætt/neikvætt rými","vægi forma og hlutfalla í myndbyggingu","grunnforsendum myndbyggingar í tvívíðum og þrívíðum verkum"],"sk":["nota á meðvitaðan hátt jákvæð og neikvæð form í myndbyggingu","yfirfæra niðurstöðu kannana sinna úr tvívídd yfir í þrívídd","geta byggt upp einföld verk sem byggist á virkni í þrívídd"],"co":[["túlka hugmyndir með beitingu forma og hlutfalla í mynd"],["þekkja áhrif línu og flata í myndbyggingu"],["kynna niðurstöður sínar á fjölbreyttan hátt"],["taka á virkan hátt þátt í umræðu um verkefni sín og annarra nemenda"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9404","a":"LJÓS3ST05","t":"Stafræn ljósmyndun","s":"ljósmyndun","o":"stafrænar myndavélar","d":"Um er að ræða framhaldsnámskeið í ljósmyndun fyrir þá sem þegar hafa náð góðum tökum á grunninum í ljósmyndatækni. Á námskeiðinu verður farið yfir helstu atriði stafrænnar ljósmyndunar og er markmið námsins að nemendur bæti við tæknilega kunnáttu og listræna getu. Í tæknilega hluta námsins verður nemendum kennt nánar á stillingar á myndavélinni, hvernig á að hlaða niður myndum og vista og réttan hátt. Þá er einnig  farið í það hvernig megi laga myndir og vinna stafrænar skrár sem nýttar eru í mismunandi tilgangi  svo sem fyrir tölvupóst, netvinnslu, skjávarpa og fleira. Einnig verður farið yfir prentun mynda. Í áfanganum verður farið í ljósmyndaferð og síðan unnið úr afraktsrinum.  Skoðað verður hvernig nemendur geta notað ljósmyndir sem listrænan miðil  bæði sem stakar myndir þar sem myndbygging og sjónarhorn eru skoðuð og eins hvernig röð mynda getur sagt áhrifaríka sögu. Nemendur munu kanna, ræða og rannsaka stakar myndir og hvernig maður tekur betri  myndir.  Þá verður einnig unnið í ljósmyndastúdíói þar sem farið er yfir notkun á stúdíó- flössum  og grunnurinn í stúdímyndatökum skoðaður. Ljósmæling og mismunandi ljósmælkerfi verða einnig skoðuð, RAW vinnuferlið, Lightroom o.fl. Þátttakendur þurfa að hafa DSLR myndavél og helst ferðatölvu með uppsettu Photoshop eða sambærilegu myndvinnsluforriti.","c":5,"l":3,"v":1,"st":"Samþykkt af skóla","m":1355497972,"p":"LJÓS2AT05","k":["mikilvægi hlutverki  ljósmyndunar í samtímalistum","mikilvægi ljósmynda í fjölmiðlum","ólíkum stíl og tilgangi ljósmynda","ljós filmuhraða","möguleikum á ljósmyndavinnslu í tölvu"],"sk":["fullvinna ljósmynd til sýningar","stækka mynd í stækkara","framkalla mismunandi filmugerðir"],"co":[["gera sér grein fyrir áhrifum mismunandi mynduppbyggingar á merkingu ljósmynda"],["skilja hvernig ólík tákn, sem birtast í myndum og samhengi þeirra geta breytt merkingu mynda"],["fjalla um og meta eigin verk og annarra á upplýstan og greinargóðan hátt"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9406","a":"SJÓN1TE05","t":"Teikning og merking","s":"sjónlistir","o":"merking, teikning","d":"Í áfanganum læra nemendur grunnatriði teikningar. Námið er í þremur hlutum. Í fyrsta hlutanum er lögð áhersla á að þjálfa formskilning með greiningu einfaldra forma, svo sem kassa- og kúluforma og athugun á náttúruformum. Í næsta hluta einbeita nemendur sér að skoðun umhverfisins. Þeir teikna rýmið í kringum sig, innanhúss og utan, og læra þannig forsendur eins og tveggja punkta fjarvíddar. Að lokum læra þeir að teikna mannslíkamann eftir lifandi fyrirmynd. Þar læra þeir að greina rétt stærðarhlutföll líkamans, stöðu og styttingar í rýminu.\r\nÍ tengslum við vinnuna í teikningu er lögð á það áhersla að nemendur reyni að gera sér grein fyrir því í hvers konar samhengi þeir gætu nýtt sér þessa þjálfun miðað við eigin áhugasvið. Þeir eru hvattir til að þróa hugmyndir sínar áfram á þessu stigi og að nota skissubækur við þá þróun. Í þessu samhengi eru þeim kynntar forsendur tákn- og merkingarfræði og teikningar þeirra skoðaðar út frá dæmum um sams konar áherslur í  heiminum almennt.  Áhersla er lögð á umræður og að nemendur geti greint niðurstöður sínar.","c":5,"l":1,"v":1,"st":"Samþykkt af skóla","m":1355499088,"p":"engar","k":["eðli, uppbyggingu og samsetningu mismunandi forma","mikilvægi grunnforma í myndsköpun","skynjun mismunandi forma í nánasta umhverfi og nýtingu þeirra í teiknivinnunni","mikilvægi samspils hugar og handa","því hvernig fjarvíddarstyttingar breyta myndinni"],"sk":["skyggja og sneiða form á blaði, eins og kúlu, kassa, keilu, píramída og rör þannig að þau virðist eðlileg í rými","teikna einfaldar skissur út frá mismunandi fyrirmyndum","teikna einfalda hluti þannig að þeir sýnist réttir í rýminu","teikna einföld náttúruform þannig að þau verði trúverðug","teikna einfaldar rýmismyndir í fjarvídd og réttum hlutföllum"],"co":[["beita táknfræðilegum rökum við umræðu um mögulega merkingu óhlutbundinna mynda og hlutbundinna mynda"],["sýna að hann geti þróað hugmyndir sínar út frá teiknivinnunni"],["hagnýta sér tæki eins og skissubækur við hugmyndavinnuna"],["ræða og rökstyðja þær hugmyndir sem hann túlkar í verkum sínum"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9407","a":"SJÓN2LF05","t":"Litafræði-formfræði-myndbygging","s":"sjónlistir","o":"formfræði, litafræði, myndbygging","d":"Nemendur læra um vægi forma og hlutfalla í mynd á fleti og í rými. Þeir kynnast sjónrænum áhrifum þessara þátta og aðferðum við að nota þau áhrif meðvitað í myndbyggingu. Unnið er að æfingum í myndbyggingu með mismunand útfærslum. Kannaðar eru mismunandi aðferðir, þar sem fjallað erum jafnvægi, ójafnvægi, léttleika og þunga, samstæður og andstæður lita og forma. Kannaðar eru særðir og hlutföll forma í rými  og í lok áfangans er unnið frá tvíviðri formfræði yfir í þrívídd. Verkefni  í  myndbyggingu eru einnig tengd dæmum úr listasögu og umhverfi samtímans.\r\n\r\nNemendur vinna í skissubók, skrá framvindu verkefna og hugmyndir sínar sem tengjast námsefni skriflega,  með skissum og ljósmyndum. Einnig vinna nemendur með litablöndun, mynstur og form. Nemendur blanda liti með tilliti til litatóna, ljóss og dimmu. Kannaðir eru eiginleikar litanna í notkun þeirra, vægi og áhrif þeirra innbyrðis sem út á við og frá sem flestum sjónarhornum. Kannaðar eru andstæður og samstæður í litum. Samtímis  litablöndun og tilraunum eru tekin dæmi um notkun lita og myndbyggingar með dæmum úr lista- og hönnunarsögu frá ýmsum tímum. ","c":5,"l":2,"v":1,"st":"Samþykkt af skóla","m":1355499671,"p":"engar","k":["forsendum óhlutbundinnar myndbyggingar","afstöðu hluta og stærðarhlutföllum á blaði","þáttum eins og jafnvægi og þunga forma og lita","túlkun hugmynda með einföldum línum og formum í mynd","klassískum fegurðarlögmálum og notkun þeirra í myndlist, hönnun og byggingarlist"],"sk":["beita litum til að ná fram mismunandi áhrifum","nýta sér andstæðuliti til að ná fram áhrifum","beita litum á einföld form til að ná fram mismunandi áhrifum","beita andstæðum skærra og dempaðra lita","nota mismunandi efni til að ná fram ólíkum áhrifum og áferðum"],"co":[["nota og meðhöndla mismunandi efnistegundir bæði í tvívíðum og þrívíðum verkum"],["greina út frá táknfræðilegum forsendum hvaða áhrif mismunandi litir og mismunandi efni hafa"],["rökstyðja skoðun sína um málefni sem tengjast mismunandi merkingu lita, forma og efnis"],["sýna fram á forsendur jákvæðrar litablöndunar ljóss"],["sýna fram á forsendur neikvæðrar litablöndunar málningar"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c940a","a":"ÍSLE1MB05","t":"Málfræði- og bókmenntahugtök","s":"íslenska","o":"bókmenntir og ritun, málnotkun","d":"Bókmenntir og læsi: Nemendur auka lesskilning sinn og æfast í að beita grunnhugtökum í bókmenntafræði.\r\n \r\nMálfræði: Beygingarfræði, setningafræði og stafsetning.\r\n \r\nMunnleg tjáning: Nemendur kynnast samræðutækni og þjálfast í að tjá skoðun sína.\r\n\r\nRitun: Nemendur þjálfast í grundvallarvinnubrögðum ritunar.","c":5,"l":1,"v":14,"st":"Samþykkt af skóla","m":1356016337,"p":"Einkunn 5-8 í grunnskóla.","k":["ýmsum grunnhugtökum varðandi sögu, ljóðstíl og form","merkingarlegum, beygingarlegum og setningafræðilegum einkennum orðflokka","stafsetningarreglum","gildi handbóka og uppflettirita","byggingu málsgreina og efnisgreina","uppsetningu, byggingu og framsetningu stuttra ritsmíða","hvernig skrifa á stuttar ritsmíðar í skrefum","forsendum góðrar framsagnar  og samræðutækni"],"sk":["beita óta sér vandaðan persónulegan stíl"],["nýta sér uppbyggilega endurgjöf"],["taka gagnrýna afstöðu til samfélagslegra og siðferðilegra álitamála af umburðarlyndi og á jafnréttisgrundvelli"],["skrifa fullunna rannsókn þar sem hann setur fram kenningu, dregur ályktun út frá heimildum og setur fram niðurstöður sínar"],["temja sér nákvæm og vönduð vinnubrögð við heimildavinnu"],["takast á við ritun hvers kyns texta"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9417","a":"LOKA3VE05","t":"Lokaverkefni","s":"lokaverkefni","o":"sjálfstætt verkefni","d":"Áfanginn er unninn á síðasta námsári. Nemandi velur sér viðfangsefni og skipuleggur í samráði við leiðbeinanda. Hægt er að útfæra verkefnin á ýmsan hátt, s.s. í formi ritgerðar, vefsíðu, heimildamyndar, sýningar, tímaritsgreinar, bókagerðar, portfolio, útvarpsþáttar eða rannsóknarskýrslu. Mikil áhersla er lögð á sjálfstæð og skapandi vinnubrögð. Gert er ráð fyrir að nemandi velji efni tengt sinni braut þótt mögulegt sé að víkja frá þeirri reglu. Afrakstur allra lokaverkefna er kynntur innan ME í annarlok og birtur á heimasíðu skólans. Einnig er æskilegt að verkefnin séu gerð sýnileg í nærsamfélaginu. Áfanginn gefur möguleika á þverfaglegu samstarfi. \r\n\r\nMiðað er við að nemendur vinni lokaáfangann sem einstaklingsverkefni þótt þeir geti óskað eftir að gera það tveir og tveir saman. Hafi nemendur hug á að vinna í fjölmennari hópum þarf að rökstyðja það sérstaklega og lýsa fyrirfram hlutverki og vinnuframlagi hvers og eins.","c":5,"l":3,"v":4,"st":"Samþykkt af skóla","m":1358761296,"p":"Nemandi skal hafa lokið 150 einingum.","k":["ákveðnu sviði faggreinar sinnar; uppbyggingu, aðferðum, hugtökum, sérkennum og sögu"],"sk":["skipuleggja verkefni með ábyrgum og sjálfstæðum hætti","sýna frumkvæði og skapandi nálgun","lesa fræðilegan texta og vinna úr honum samkvæmt viðurkenndum reglum um meðferð heimilda","beita viðeigandi aðferðum við útfærslu verkefnis","tjá sig á skýran, ábyrgan, gagnrýninn og skapandi hátt um eigið verkefni","velja viðeigandi miðlunaraðferð og beita henni af öryggi","taka þátt í samvinnu þegar við á"],"co":[["þróa hugmyndir og sýna sjálfstæði, áræðni og innsæi við útfærslu þeirra og túlkun"],["greina, tjá sig um og meta eigin verkefni og annara af þekkingu, víðsýni og virðingu"],["takast á við ný verkefni og breyta hugmynd í afurð"],["vera meðvitaður um styrkleika sína"],["átta sig á virði verkefnisins og menntunar sinnar fyrir samfélag og atvinnulíf"],["standa að sýningu/viðburði og miðla þar verkefnum sínum"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"512e08ac62933a6741000022","a":"SVIÐ2SS05_1","t":"Straumar og stefnur","s":"sviðslistir","o":"stefnur, straumar","d":"Byggt verður á þeim grunni sem lagður er í Sviðslistum 1. Áfram verður unnið með upphitunaræfingar, einbeitingu, framsögn og spuna en mismunandi aðferðum og kenningum í leiktækni og textameðferð á sviði blandað inn í það. Nemendur lesa leikrit, greina og vinna með ýmis konar leiktexta og öðlast innsýn í aðferðir helstu hugmyndasmiða leiklistarinnar, svo sem Stanislavskís, Brechts og Grotowskis og unnið með samsköpunaraðferð. Einnig verður horft á nokkur sviðs- og kvikmyndaverk og greiningar gerðar á þeim. ","c":5,"l":2,"v":null,"st":"Samþykkt af skóla","m":1361971372.97067,"p":"SVIÐ1GT05","k":["hugmyndum Brechts, Stanislavskis og Grotowskis um leikhús","mismunandi aðferðum í senuvinnu","algengustu hugtökum helstu kennismiða meðal leikhúsmanna","samsköpunaraðferð"],"sk":["greinina leiktexta með mismunandi aðferðum","vinna í hópum og samstarfi í spuna og greiningarvinnu","beita nokkrum lykilþáttum samsköpunaraðferðar í leikhúsvinnu"],"co":[["nota ýmsar aðferðir við greiningar- og senuvinnu",""],["greina eftir aðferðum hvaða leikhúslistamanns  leiksýningar eru unnar",""],["setja fram eigin hugmyndir um leikhús í ræðu og riti og rökstyðja þær",""]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"512e0c1162933a6741000036","a":"SVIÐ2ÚH05","t":"Útlits ðstoð kennara. Markmiðið er að eftir námskeiðið hafi nemendur fengið nægilega undirstöðuþekkingu til að takast á við tvívíð grafísk hönnunarverkefni s.s. bæklinga, plaköt, bækur ofl. með InDesign og hafi náð tökum á undirstöðuatriðum í myndvinnslu með Photoshop.\n\nKennd eru hagnýt atriði í grafískri útlitshönnun (layout) með forritunum og fjallað er um liti og hvernig hægt er að nota þá til þess að koma ákveðnum boðum til skila í hönnun. Einnig er fjallað um leturgerðir með margs konar merkingar í huga. Unnin er fjöldi verkefna sem miðar að því að þroska myndræna skynjun nemenda, gæðamat og gagnrýna hugsun. Í lokin er eitt lokaverkefni og nemendur hafa frjálsar hendur með að nota hvert það verklag sem hefur verið kynnt, þá eru ýmis jaðartæki kynnt eftir þörfum. \n\nÍ áfanganum fá nemendur einnig að kynnast ýmsum öðrum  myndvinnsluforritum (opnum hugbúnaði svo sem Gimp, Sketch-up, Inksape o.fl.).  Ætlast er til að nemendur séu á þessu stigi tilbúnir til að móta sín verkefni sjálfir en fái leiðbeiningar kennara varðandi tæknileg atriði eftir þörfum til að ná fram þeirri tilfinningu eða sýn sem þeir leita eftir. Skil verkefnisins verða á vefsíðu sem nemandi hannar sjálfur. Notast verður við einfaldan opinn hugbúnað til vefsíðugerðar.","c":5,"l":2,"v":1,"st":"Samþykkt af skóla","m":1370529363.98306,"p":"Æskilegt að hafa lokið sjónlistum. \nMjög góð tölvukunnátta er nauðsynleg.","k":["grunnatriðum grafískrar framsetningar","helstu atriðum í grafískri útlitshönnun (layout)","grunnatriðum í tvívíðri formfræði, litafræði og leturfræði","mismunandi áherslum í hönnun fyrir vef eða prentmiðil","vefsíðu og hönnunarforritum photshop, indesign (gimp, inkscape)"],"sk":["stofna skjal á réttu sniði samkvæmt markmiði","sækja aðföng eða búa þau til","geta metið hvort myndefni sé vinnanlegt","vinna með myndir og texta í hönnunarforritunum Photoshop og Indesign eða sambærilegum opnum hugbúnaði","setja upp eigin vefsíðu með eigin verkefnum"],"co":[["meta og ákveða rétt vinnulag í  hvers nningu",""]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51b1c27b62933a1deb001fea","a":"ERLE3ES05","t":"Erlend samskipti","s":"erlend samskipti","o":"Erlend samskipti","d":"Áfanginn er hannaður til að ýta undir og efla alþjóðasamskipti nemenda sem eru að læra erlend tungumál. Meginviðfangsefnið felst í að nota upplýsinga- og margmiðlunartækni til að tengjast nemendum í öðrum löndum og vinna að samvinnuverkefnum gegnum alþjóðlegar menntaáætlanir s.s. etwinning og Comenius.\nNemendur munu fá tækifæri til að meta eigin færni í erlendum tungumálum í samskiptum við jafningja sína gegnum sameiginlegt matsverkfæri, evrópsku tungumálamöppuna. Hæfni í lestri, ritun, ræðu og hlustun er efld með þverfaglegri vinnu, bæði gegnum vinnu í námsefni og með margmiðlunartækni.\nNámið í þessum áfanga eykur menningarlæsi og fjölmenningarmeðvitund nemenda auk meðvitundar þeirra um eigin menningu. Ennfremur efla nemendur félags- og borgaravitund sína, auk þess sem þeir þjálfast í samskiptatækni.","c":5,"l":3,"v":1,"st":"Samþykkt af skóla","m":1370604155.350637,"p":"","k":["mismunandi málnotkun og áherslum í samskiptum við fólk frá öðrum löndum","sterkum og veikum hliðum sínum í samskiptum á erlendu tungumáli gegnum vinnu í samvinnuverkefnum","mikilvægi menningar- og borgaravitundar þegar samskipti fara fram í alþjóðlegu umhverfi","nauðsyn sterkrar undirstöðu í málnotkun svo sem málfræði og orðaforða á erlendu tungumáli","hlutverki samvinnu þegar unnið er að samstarfsverkefnum","samskiptatækni sem eflir miðlun upplýsinga milli landa"],"sk":["vinna með jafningjum sínum í öðrum löndum að sameiginlegu verkefni","nota þau tungumál sem hann hefur lært til samskipta","gera grein fyrir niðurstöðum verkefna í ræðu og riti á erlendu tungumáli sem hann hefur lært","nýta sér upplýsingatækni","umgangast fólk á öðrum menningarsvæðum og virða siði þess og venjur"],"co":[["skilja menningarmun og aðlaga sig ólíkum aðstæðum í alþjóðlegum samskiptum",""],["nýta þekkingu á erlendu tungumáli ti jálfsmatspróf","nýta sér góð vinnubrögð, góða námstækni og setja sér raunhæf markmið","undirbúa mál sitt og færa rök fyrir skoðunum sínum og afstöðu","nýta sér upplýsingar um forvarnir og heilsueflingu"],"co":[["velja sér leið gegnum framhaldsskólakerfið og búa til námsáætlun fyrir nám að loknum framhaldsskóla",""],["greina og meta sjálfan sig á raunhæfan hátt og setja sér markmið m.t.t. áhugasviðs og styrkleika og veikleika",""],["nota árangursríka námstækni, stjórna einbeitingu, beita mismunandi minnisaðferðum, skipuleggja og undirbúa próflestur, glósutækni, lestrartækni og tímastjórnun",""],["flytja mál sitt á sannfærandi og öruggan hátt",""],["velja heilsueflandi lífsstíl s.s. hollt mataræði, nægan svefn og kynheilsu",""]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51b215a862933a1deb002045","a":"LÍFS1BS05","t":"Borgaravitund, samfélag","s":"lífsleikni","o":"borgaravitund, samfélag, samskipti, umhverfismál, vinnumarkaður","d":"Efni áfangans eru fjölbreyttir þættir sem snerta daglegt líf nemenda og tengslin við samfélagið.\n \nÞeir þættir sem verða teknir til umfjöllunar eru: \n\n•\tvinnumarkaður; réttindi og skyldur, ferilskrár, starfsumsóknir og atvinnuviðtöl\n\n•\tfjármálalæsi; eigin fjármál, neysluviðmið, fjárhagsaðstoð\n\n•\tumhverfismál; sjálfbærni, náttúruauðlindir, umhverfissiðfræði og -vitund og neysluvenjur\n\n•\tborgaravitund; jafnrétti, staðalmyndir og lýðræði, alþjóðasamfélagið og fjölmenning\n\n•\ttjáning; flutningur formlegra og hálf-formlegra erinda.","c":5,"l":1,"v":6,"st":"Samþykkt af skóla","m":1370625448.833379,"p":"engar","k":["hugtökum sem snerta umhverfismál og umhverfisvitund, s.s. sjálfbærni","umhverfismerkingum, eigin neysluvenjum og áhrifum þeirra á eigin velferð og umhverfið","fjármálahugtökum ásamt  umfjöllun um auglýsinga og neyslusamfélagið","formi tjáningar, hvernig skal undirbúa og flytja munnlegt erindi","helstu þáttum sem snerta gildi, kröfur, réttindi og skyldur á vinnumarkaði","ferli atvinnuumsókna, atvinnuleitar og gerð ferilskrár","umfjöllun um alþjóðasamfélagið og fjölmenningu sem varða jafnrétti og lýðræði","þáttum sem hafa áhrif á samskipti og ágreiningsstjórn"],"sk":["afla og vinna með upplýsingar um eigin neyslu og nýtingu náttúruauðlinda","taka þátt í samræðum sem varða umhverfisvitund og sjálfbærni á ábyrgan og rökrænan hátt","fylgja því ferli sem þarf til að sækja um atvinnu","greina og meta aðstæður er tengjast fjölmenningu, jafnrétti, lýðræði og staðalmyndum","skipuleggja, taka réttar ákvarðanir og bera ábyrgð á eigin fjármálum og neyslumynstri","horfa gagnrýnið á auglýsingar og taka sjálfstæða afstöðu til auglýsinga","undirbúa málflutning í mismunandi aðstæðum og færa rök fyrir skoðunum sínum","skoða samskipti, ágreining og tilfinningar á jákvæðan og hagnýtan hátt"],"co":[["setja saman ferilskrá, bera sig að í atvinnuleit og atvinnuviðtölum",""],["meta áhrif eigin lifnaðarhátta á umhverfið og geta hagrætt neysluvenjum m.t.t. sjálfbærni",""],["taka upplýsta afstöðu til almennrar umfjöllunar um umhverfismál",""],["lesa í fjármálatilboð; lesa auglýsingar og draga úr markaðsvæðingu",""],["flytja mál sitt á sannfærandi og öruggan hátt, beita líkamanum rétt í flutningi",""],["meta og gera grein fyrir aðstæðum og þáttum sem tengjast fjölmenningu og  alþjóðavitund",""]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51b5accb62933a1deb002270","a":"ÍSLE3SK05","t":"Skáldsögur","s":"íslenska","o":"skáldsögur","d":"Í áfanganum er lögð áhersla á lestur íslenskra fagurbókmennta, skáldsagna, á markvissan og greinandi hátt með því að nota bókmenntahugtök. Einnig að nemandi komi rökstuddri skoðun á verkunum á framfæri í ræðu og riti. Nemandi hefur áhrif á val skáldsagna.","c":5,"l":3,"v":7,"st":"Samþykkt af skóla","m":1370860747.443525,"p":"Nemandi skal hafa lokið ÍSLENSKU á 2. þrepi.","k":["hvað skilur að fagurbókmenntir og afþreyingarbókmenntir","beitingu bókmenntahugtaka","menningarlegu og fagurfræðilegu gildi bókmennta","að bókmenntir þroska málkennd og efla les skölum.  Í tengslum við þessa vinnu þarf nemandinn að vinna skissuvinnu í formi teikninga og eða í tölvu. Nemandi verður þjálfaður  í sjálfstæðum og skapandi vinnubrögðum auk þess að nýta sér tölvutækni við hugmyndavinnu og upplýsingaöflun.  Lögð er áhersla á að nemandinn geti rökstutt forsendur fyrir hönnun sinni út frá sniði, efnis- og litavali.  Nemendur læra mikilvæga grunnvinnu sem er fólgin í að sauma prufuflíkur, máta á gínu og gera sniðbreytingar. Farið verður í vettvangsferðir og á fyrirlestra tengda námsefninu. Nemandi tekur þátt í sýningu verkefna í lok áfangans.","c":5,"l":2,"v":3,"st":"Samþykkt af skóla","m":1383067139.000081,"p":"TEXT1FA05","k":["leiðbeiningatextum og skýringarmyndum","orðaforða greinarinnar","mikilvægi vandvirkni og skipulags við saumaskap"],"sk":["vinna á sjálfstæðan og skapandi hátt","skrá hugmyndir sínar í formi skissuvinnu og tískuteiknunar í  hugmyndabækur og geta nýtt tölvu í því sambandi","endurmeta hugmynd sína og framkvæmd verksins á mimunandi stigum með t.d. prufugerð og tilraunum"],"co":[["sníða flíkur og sauma á mismunandi saumavélar",""],["nýta grunnsnið til að útfæra flík út frá eigin hugmynd",""],["rökstyðja forsendur fyrir hönnun sinni út frá snið-, efnis- og litavali",""],["sauma fóðraða flík og kunni skil á mismun aðferða við að sauma í teygjanleg efni",""]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"527291bc62933a493f003015","a":"HÖNN2VÖ05","t":"Vöruhönnun, frá hugmynd að vöru","s":"hönnun","o":"vöruhönnun","d":"Um er að ræða grunnáfanga í vöruhönnun á framhaldsskólastigi.\nFarið verður yfir það hvað vöruhönnun er, hvaða tilgangi hún þjónar í nútíma samfélagi og hvað er VARA? Einnig verður saga vöruhönnunar frá 1750 til dagsins í dag kynnt í örmynd til að nemendur hafi betri heildarsýn á fagið. \nÁfanginn er að mestu leiti verklegur en nokkur skrifleg verkefni geta þó verið þó inn á milli. Nemendur þurfa að halda úti skissubók fyrir öll verkefnin og er hluti af áfanganum því kennsla í að kortleggja hugmyndirnar, rannsaka og færa inn í skissubók. Kennari aðstoðar við útfærslu á hugmyndum, ljósmyndum, texta og teikningum, en bæði er hægt að notast við Photoshop og sambærileg forrit og/eða þá að nemendur teikna upp hugmyndir sjálfir og fá aðstoð við framsetningu í skissubók.\nNemendur fá einnig innsýn inn í módelgerð og þurfa að skila af sér verkefni því tengdu þar sem nemandi fær aðstoð við að gera eftirlíkingu af fyrirfram gefnum hlut/vöru í sem nákvæmastri mynd.\nÍ lokin verður unnið lokaverkefni þar sem nemendur hanna sína eigin vöru út frá fyrri rannsóknarvinnu og fyrirfram ákveðnu þema sem kennari leggur fyrir. Nemendur búa til „prótótípu/frumgerð“ af vörunni og enda svo áfangann með sýningu á bæði lokaverkefni, kynningarefni og skissubók.","c":5,"l":2,"v":5,"st":"Samþykkt af skóla","m":1383240124.168477,"p":"SJÓN1TE5 \nSJÓN2LF5 \nMARG2MI05\nHUGM2HS5 ","k":["faginu vöruhönnun","fjölbreytni vöruhönnunar í nútíma samfélagi","hvernig ferli er unnið frá hugmynd að vöru"],"sk":["koma hugmyndum sínum, rannsóknum og ferli skilmerkilega frá sér í formi skissubókar","útbúa einföld módel/frumgerðir","virkja eigin sköpunarmátt og hugmyndir sem einstaklingur og í hóp","nýta „verkfæri“ og verktækni sem vöruhönnuðir notast við í vinnu sinni"],"co":[["vera óhræddur við að gera „mistök“",""],["taka þátt í umræðum og nota gagnrýna hugsun þegar hann tjáir skoðanir sínar",""],["taka við uppbyggilegri gagnrýni og nýta hana til þess að bæta verkefnið sitt/vöruna",""],["sýna sjálfstæð vinnubrögð",""]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"527293a262933a493f003019","a":"ÍSLE3BU05","t":"Menningarheimur barna og unglinga","s":"íslenska","o":"Barna- og unglingabókmenntir","d":"Í áfanganum eru fjölbreytt viðfangsefni. Áhersla er á menningarheim barna og unglinga. Fjallað er um ýmsar bókmenntategundir s.s. myndabækur, barna- og unglingabækur, teiknimyndasögur, þjóðsögur og ævintýri. Skoðaðar eru myndskreytingar í barnabókum. Bækurnar eru skoðaðar með augum gagnrýnandans með tilliti til fjölmenningar, jafnréttis og stöðu kynjanna. Nemendur styðjast við verkfæri bókmenntagreiningar til að kryfja efnið. Barnaefni sjónvarpsstöðvanna er skoðað. Bornir eru saman leikir barna nú og fyrr á tímum. Einnig er fjallað um ljóð fyrir börn og ýmsa aðra afþreyingu eins og tölvuleiki og spil. Lögð er áhersla á þjálfun og færni í ritun. ","c":5,"l":3,"v":12,"st":"Samþykkt af skóla","m":1383240610.194713,"p":"ÍSLE2NH05 og \nÍSLE2RR05","k":["mismunandi tegundum barnabókmennta","mikilvægi ævintýra, þjóðsagna, leikja og ljóða í menningu þjóða","mikilvægi gagnrýninnar hugsunar við val á barnabókum","mikilvægi þess að börn lesi og að lesið sé fyrir þau","þætti myndskreytinga í barnabókum","því hvernig beita má bókmenntagreiningu til að öðlast dýpri skilning á   bókmenntaverkum","því hvers konar afþeying er í boði fyrir börn","því að færa rök fyrir skoðun sinni á skipulegan hátt","heimildavinnu"],"sk":["fjalla af skilningi og þekkingu um barnabókmenntir","notfæra sér bókmenntagreiningu í umfjöllun um verk","greina verk á gagnrýninn hátt t.d. út frá fjölmenningu, jafnrétti og stöðu kynjanna","fjalla af skilningi og þekkingu um afþreyingu barna og unglinga","átta sig á hvað einkennir jákvæða/heppilega afþreyingu","mynda sér skoðun á efni fyrir börn og tjá hana á gagnrýninn hátt með rökum","skrifa heimildaritgerð og styttri texta um barnaefni"],"co":[["velja á gagnrýninn hátt lesefni handa börnum og unglingum",""],["meta með gagnrýnum huga barnaefni af ýmsu tagi",""],["greina hvað er heppilegt efni fyrir börn og unglinga miðað við aldur og þroska",""],["miðla til annarra menningarlegu efni",""],["rökstyðja skoðun sína á barnaefni og vera tilbúinn að rökræða hana",""],["túlka, greina og beita gagnrýninni hugsun við lestur ýmiss konar texta og myndefnis fyrir börn",""]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"5272965f62933a493f00301f","a":"STÆR1RU05","t":"Rúmfræði og hornaföll","s":"stærðfræði","o":"Rúmfræði og hornaföll","d":"Viðfangse
