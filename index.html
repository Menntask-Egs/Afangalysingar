 efnahagsmál og sótt þær á Netið"],["taka þátt í upplýstri  umræðu um efnahagsmál og tengt þær við efni áfangans"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9376","a":"HAGF1RE05","t":"Rekstrarhagfræði","s":"hagfræði","o":"rekstrarhagfræði, rekstur fyrirtækja","d":"Byrjunaráfangi um rekstur fyrirtækja og umhverfi þeirra. Grunnatriði hagfræðinnar, mismunandi efnahagsheildir. Nemendur öðlist yfirsýn yfir fyrirtæki sem efnahagsheild og hvernig það þrífst í samkeppni við önnur fyrirtæki. Nemendur öðlist skilning á eðli og uppbyggingu fyrirtækja með því að skoða innviði svo sem kostnaðarsamsetningu, deildaskiptingu og sölumál og síðan ytra umhverfi fyrirtækis. Flokkun atvinnugreina, starfsgrundvöllur fyrirtækja, stefnumótun og markmiðssetning og kostnaðargreining. Grunnatriði markaðsfræði og bókhalds. Nemendur nýti sér eigin  þekkingu úr atvinnulífinu, taki dæmi þaðan og beri saman við námsefnið. Nemendur  nýti  Netið til upplýsingaöflunar.","c":5,"l":1,"v":2,"st":"Samþykkt af skóla","m":1352453865,"p":"engar","k":["grundvallarhugtökum hagfræðinnar, s.s. skorti, vali og fórn","helztu framleiðsluþáttum","helztu þáttum í umhverfi fyrirtækja og mismunandi áhrifum þeirra","hvað ræður staðarvali fyrirtækja - Hagsmunakenningunni","rekstrarformi fyrirtækja - skipuriti og dreifingu valds og ábyrgðar","helztu kostnaðarhugtökum","aðferðum við útreikning framlegðar og rekstrarjafnvægis. Muninum á beinum og óbeinum kostnaði. Helztu hugtökum markaðsfræðinnar","grunnhugsun frávikagreiningar við áætlanagerð"],"sk":["flokka helztu atvinnugreinar á mismunandi hátt","vinna við stefnumótun og markmiðssetningu","fjalla um helztu stjórnunarstíla","skilja verðmætamyndun í fyrirtækjum og ráðstöfun þeirra","skilgreina hugtökin tekjur, kostnaður og afkoma","reikna eigið verð afurðar. Fjalla um  mikilvægi bókhalds í rekstri"],"co":[["útskýra framboð, eftirspurn og jafnvægi á markaði"],["skilgreina starfsgrundvöll fyrirtækja"],["útskýra framleiðslukerfi, skipulag framleiðsluþátta og samræmingu afkastagetu og geti sett þessi atriði fram myndrænt"],["setja fram fjárhagsáætlun og meta gildi hennar fyrir stjórnendur fyrirtækja"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9377","a":"SAGA1MF05","t":"Mannkynssaga, fyrri hluti","s":"saga","o":"mannskynssaga til 1800","d":"Þetta er fyrri kjarnaáfanginn. Hér er sögunni fylgt frá fornöld og fram til um 1800 e.Kr, hér er þó að mestu leyti um að ræða sögu vestrænnar menningar. Áhersla er lögð á 6 ákveðin tímabil/efnisatriði þar sem um ákveða dýpkun verður að ræða, annars er ætlunin að nemendur fái sem heilstæðasta mynd af þróun sögunar frá fornöld til upphafs nútímans.","c":5,"l":1,"v":5,"st":"Samþykkt af skóla","m":1352459044,"p":"engar","k":["helstu tímaskeiðum tímabilsins, hvað markar upphaf þeirra og endi og hvað einkennir þau","helstu hugtökum og atburðum tímabilsins með sérstaka áherslu á Íslandsögu","stöðu Íslands gagnvart Norðurlöndum og Vesturlöndum hvað varðar sögulegaþróun","mismunandi menningarheimum","grunnþáttum varðandi miðlun sögunnar"],"sk":["greina aðalatriði og setja þau upp á skipulegan hátt","nýta sér fjölbreytta miðla í sögunáminu","meta orsakir og afleiðingar","ræða álitamál við samnemendur sína og leysa verkefni í samvinnu við þá","afla sér heimilda og vinna verkefni byggðu á heimildum"],"co":[["meta söguleg fyrirbæri út frá forsendum hvers tíma og sjái tegnsl þeirra við nútímann"],["tjá sig um söguleg álitamál"],["vinna heilstætt verkefni,  einn sér sem og í samvinnu við aðra"],["auka siðferðisþroska sinn og  umburðarlyndi"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9378","a":"SAGA3AU05","t":"Saga austurlands","s":"saga","o":"saga austurlands","d":"Í áfanganum er saga Austurlands tekin til sérstakrar skoðunar.  Farið er yfir helstu einkenni sögulegrar þróunar í landshlutanum og síðan valdir nokkrir þættir og um þá fjallað sérstaklega.  Lögð er áhersla á að tengja umfjöllunarefnin umhverfi nemenda með námsferðum á sögustaði.  Farið er í safnaheimsóknir og rannsóknum á sviði sagnfræði og fornleifafræði sem snerta Austurland gerð \r\nsérstök skil. Í áfanganum er gert ráð fyrir heimsóknum gestafyrirlesara, sem fjalla um afmörkuð efni. \r\n\r\nÁfanganum er ætlað að vera inngangur að sagnfræði og því lögð áhersla á að nemandinn skrifi stóra ritgerð. Lögð er áhersla á öflun gagna með fjölbreyttum hætti meðal annars með viðtölum. \r\nÍ áfanganum er leitast við að vera í sambandi við samfélagið og það helsta sem er að gerast í þeim efnum sem tengjast viðfangsefni áfangans, meðal annrs möguleika á menningartengdri ferðaþjónustu. Þá má nefna samstarf við söfn á Austurlandi og verkefni sem þar geta boðist. \r\nLeitast er við að gera verkefni nemenda sýnileg og má þar nefna að nokkur verkefni nemenda hafa verið gefin út í tímaritum þeim sem fjalla um málefni Austurlands.\r\n","c":5,"l":3,"v":14,"st":"Samþykkt af skóla","m":1352460201,"p":"SAGA2ÁN05","k":["megin þáttum í sögu Austurlands","afmörkuðum viðfangsefnum  tengdum sögu fjórðungsins að eign vali","mótun austfirsks samfélags","heimildum um sögu Austurlands","fjölbreyttum aðferðum við miðlun sögunnar"],"sk":["nota söfn og þær heimildir sem þar finnast til að tileinka sér nærsögu sína","taka viðtöl til gagnaöflunar","tileinka sér sagnfræðilegt efni í íslenskum fræðiritum","meta gildi og árieiðanleika heimilda","vinna út heimildum og koma þeim á framfæri á viðurkenndan hátt"],"co":[["leggja sitt af mörkum fjórðungnum til framdráttar"],["hafa öðlast sjálfstraust og sjálfstæði í þróun hugmynda og sýni áræðni og innsæi við útfærslu þeirra og túlkun"],["greina hverskonar heimildir eru til staðar og hvernig hægt sé að nýta þær"],["setja sjálfan sig í samhengi sögunnar sem þátttakanda og skoðanda, og verða hæfur til að fjalla um málefni fjórðungsins"],["vinna heilstætt verkefni samkvæmt reglum um gerð heimildaverkefna"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9379","a":"SAGA2ÁN05","t":"Átjánda öld til nútímans","s":"saga","o":"mannkynssaga frá 1750 til nútímans","d":"Þetta er seinni kjarnaáfanginn, en hér er haldið áfram þar sem frá var horfið í SAGA1MF05 og sögunni fylgt eftir fram til okkar daga, það tímabil sem hefur verið kennt við nútíma, frá upplýsingaröld til líðandi stundar. Ekki er um að ræða sögu tímabilsins í heild sinni heldur eru ákveðnir þættir valdir úr, svo sem lífskjör, menning, lífsþættir og stjórnmál.  Eins og í SAGA1MF05 er hér að mestu um sögu vestrænnar menningar að ræða.  ","c":5,"l":2,"v":8,"st":"Samþykkt af skóla","m":1352460324,"p":"SAGA1MF05","k":["nokkrum afmökuðum skeiðum sögunnar með tilliti til ýmissa sviða hennar svo sem: menningar, hugarfars, stjórnmála, einstaklinga, samfélags, tækni og vísinda","sögu Íslands í samhengi  við sögu Norðurlanda, Evrópu og heimsins","fjölbreytileika heimilda","miðlun sögunnar á fjölbreyttan hátt og þeim reglum sem gilda um heimildaritgerðarsmíð"],"sk":["greina afmarkað sögulegt málefni, greint meginþætti og álitamál, leitað eftir mismunandi sjónarhornum , lýst málinu og gefið álit sitt","meta gildi og áreiðanleika heimilda","vinna sjálfstætt sem og í hópum að gerð fjölbreyttra heimildaverkefna","lesa og túlka texta, kort, töflur, gröf og myndir frá mismunandi tímaskeiðum"],"co":[["meta söguleg fyrirbæri út frá forsendum hvers tíma og sjái tengsl þeirra við nútíma"],["leita að, greina og meta mismunandi sjónarmið um söguleg efni"],["rýna í  heimildir, vinna úr þeim og leggja á þær gagnrýnið mat"],["vinna heilstætt verkefni samkvæmt reglum um heimildasmíð"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c937a","a":"SAGA3ME05","t":"Menningarsaga","s":"saga","o":"menningar, saga","d":"Í þessum áfanga eru valin tímabil og svið til fjölþættrar menningarlegrar könnunar. Þetta er verkefnavinna þar sem nemendur kryfja viðfangsefni í ljósi margra þátta, t.d. myndlistar, bygginga, tækni, bókmennta, heimspeki, hugarfars og félagsgerðar. Ætlunin er að nemendur skapi sér mynd af því sem fengist er við með því að kynna sér frumtexta, skoða samtímamyndefni og hlýða á tónlist ásamt því að tileinka sér fræðilega og skáldlega umfjöllun um efnið. Úrvinnsla og framsetning nemenda miði að því að miðla þekkingu og skilningi ásamt tilfinningu fyrir tíðaranda. Í ferlinu þarf að sundurgreina efnið, skipuleggja vinnuna, tengja efnisþætti og velja sjónarhorn. Gert er ráð fyrir að jafnaðarlega sé staldrað við og skipulega rætt um aðferðir, eðli heimilda, tengsl efnisþátta og möguleika á heildarmynd.  \r\n\r\nÆtlunin er að áfanginn sé sniðinn að þörfum nemenda á öllum brautum þannig að nemendur geti valið sér efni við hæfi og þannig kannað valda þætti úr sögu sinnar greinar/áhugasviðs frá fornöld til nútímas. Nemendur kynnast þar með fjölbreyttum heimildum, geta unnið einir sér eða í hópum og eiga þess kost á að setja fram verkefni sín á fjölbreyttan hátt. Þannig gæti nemandi með áhuga á læknisfræði notað áfangann til þessað kanna sögu læknisfræðinnar, nemandi með áhuga á byggingalist kannað sögu arkitektúrs og svo fram vegis.","c":5,"l":3,"v":16,"st":"Samþykkt af skóla","m":1352462561,"p":"SAGA2ÁN05","k":["fjölbreyttum menningarheimum","heimildafræði","fjölbreyttum aðferðum við miðlun sögunnar","ákveðnu sviði að eigin vali og framvinndu þess og birtingamyndum í gegnum söguna"],"sk":["greina einkenni menningarheima","tileinka sér sagnfræðilegt efni í íslenskum fræðiritum og létta erlenda fræðitexta","meta gildi og áreiðanleika heimilda","miðla sögunni á sjálfstæðan og fjölbreyttann hátt","nýta sér fjölbreytileika sögunar af áhuga og geti yfirfært lærdóm hennar á aðrar greinar"],"co":[["meta söguleg fyrirbæri út frá forsendum hvers tíma og meningarheimi"],["leggja mat á mismunandi tegundir heimilda, s.s. ánnála, frásagnir, fræðirit, fagurbókmenntir, tónlist, byggingar og fleira"],["gera heilstætt heimildarverkefni samkvæmt kröfum um gerð heimildaverkefna"],["auka þekkingu sína í eigin valgrein"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c937b","a":"SAGA3TU05","t":"20. öldin","s":"saga","o":"tuttugasta öldin","d":"Í áfanganum er farið nánar í sögu 20. aldarinna en gert var í SAGA2ÁN05.  Sérstök áhersla er lögð á átök; orsakir og afleiðingar.  Fjórir megin þættir eru teknir fyrir, fyrri heimstyrjölin, síðari heimstyrjöldin, Kalda stríðið og átök síðustu ára.   Mikil áhersla lögð á verkefnavinnu og sjálfstætt nám nemenda. Áhersla verður lögð á að nemendur nýti sér fjölbreyttar heimildir, þar á meðal;  munnlegar heimildir, dagblöð, sjónvarp, veraldarvefinn, skáldskap og kvikmyndir. ","c":5,"l":3,"v":15,"st":"Samþykkt af skóla","m":1352467575,"p":"SAGA2ÁN05","k":["sögu 20. aldarinnar með sérstakri áherslu á átök","sögu 20. aldarinnar sem lykli að stöðu heimsmála í dag","áhrifum átaka á mannlegt samfélag","fjölbreytileika heimilda til gagnaöflunar og takmörkum þeirra"],"sk":["greina orsakir og afleiðingar átaka í sögu átaka 20. aldarinnar","tileinka sér sagnfræðilegt efni í íslenskum fræðiritum og létta erlenda fræðitexta","meta gildi og áreiðanleika heimilda","miðla sögunni á sjálfstæðan og fjölbreyttann hátt"],"co":[["greina orsakir og afleiðingar átaka"],["greina hverskonar heimildir henta best mismunandi viðfangsefnum"],["greina gildi og afstæðni sögulegrar frásagnar og skýringa"],["rökræða söguleg deilumál"],["vinna heildstætt heimildaverkefni samkvæmt reglum á sjálfstæðan hátt"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9389","a":"LÍFF2VF05","t":"Vistfræði","s":"líffræði","o":"vistfræði","d":"Markmið áfangans er að kynnast vistfræði, sögu hennar, helstu hugtökum og rannsóknaraðferðum. Fjallað er um uppbyggingu vistkerfa og mótun þeirra, tengsl lífvera við aðrar lífverur sem og lífvana umhverfi, orkuflæði vistkerfa og efnahringrásir. Litið er til sjálfbærrar nýtingar stofna og lífrænna auðlinda ásamt því að skoða helstu rök fyrir náttúruvernd. Rætt er um áhrif vistfræðilegra þátta á aðlögun, þróun og hæfni lífvera. Fjallað er um líffræðilegan fjölbreytileika og breytingar á tegundasamsetningu líffélaga, bæði af náttúrulegum orsökum og af völdum manna.","c":5,"l":2,"v":11,"st":"Samþykkt af skóla","m":1352989976,"p":"LÍFF2EL05","k":["sögu vistfræðinnar og tengslum við aðrar greinar","helstu hugtökum vistfræðinnar","aðferðafræði  vistfræðirannsókna","uppbyggingu og mótun vistkerfa","sérstöðu Íslands","orkuflæði og efnahringrásum","helstu hugtökum stofnvistfræði","sjálfbærri nýtingu lífrænna auðlinda","líffræðilegum fjölbreytileika","helstu rökum fyrir náttúruvernd"],"sk":["lesa vistfræðilegar upplýsingar úr máli og myndum","beita hugtökum vistfræðinnar í rökrænu samhengi","fjalla um álitamál sem varða íslenska náttúru í víðum skilningi","beita einföldum vistfræðilegum aðferðum  í verklegum æfingum og vinna skýrslur úr þeim","þekkja einkenni og áhrifaþætti ólíkra vistkerfa"],"co":[["geta tekið ábyrga og rökstudda afstöðu til vistfræðilegra dægurmála"],["tengja undirstöðuþekkingu í vistfræði við daglegt líf og sjá notagildi hennar"],["fjalla um vistfræði á gagnrýninn hátt og velta fyrir sér ólíkum sjónarmiðum og lausnum"],["afla sér frekari upplýsinga og þekkingar á vistfræðilegum viðfangsefnum"],["taka ábyrgð á áhrifum eigin lífs á umhverfið m.t.t. vistfræði og sjálfbærrar nýtingar"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c938a","a":"LÍFF2ÍS05","t":"Lífríki íslands","s":"líffræði","o":"lífríki íslands","d":"Í áfanganum er megináhersla á að kynna lífríki Íslands og þá sérstöðu sem það hefur bæði vegna jarðsögu landsins og landfræðilegrar legu þess. Skoðaðir eru helstu hópar lífvera á landi, sjó og ferskvatni; spendýr, fuglar, fiskar, hryggleysingjar og plöntur. Lifnaðarhættir mismunandi hópa lífvera eru kynntir og helstu einkenni þeirra. Lögð er áhersla á að nemendur þekki algengar lífverutegundir á Íslandi. Einnig eru breytingar á lífríki Íslands í gegnum árin skoðaðar. Lögð er áhersla á sjálfstæð vinnubrögð og gagnaöflun frá mismunandi miðlum. Einnig er áhersla á að nemendur miðli þekkingu sinni á skapandi hátt. ","c":5,"l":2,"v":12,"st":"Samþykkt af skóla","m":1352989059,"p":"NÁTT1LE05 / LÍFF2EL05","k":["sérstöðu lífríkis Íslands, m.a. vegna eyjaáhrifa og jarðsögu","einkennum helstu hópa lífvera sem finnast í lífríki Íslands (á landi, í fjöru, sjó og ferskvatni), s.s. gróðri, hryggleysingjum, fiskum, fuglum og spendýrum","búsvæðum, lífsferlum og lífsögu mismunandi lífvera","gagnsemi greiningalykla við tegundagreiningar","mismunandi rannsóknaraðferðum í líffræði","breytingum sem hafa orðið á íslensku lífríki undanfarin ár","framandi tegundum og ágengum tegundum","hugtakinu líffræðilegur fjölbreytileiki"],"sk":["greina á milli mismunandi lífveruhópa og/eða tegunda","tjá sig um málefni tengd lífríki Íslands á ábyrgan og rökrænan hátt","beita einföldum líffræðilegum  rannsóknaraðferðum","að lesa líffræðilegar upplýsingar úr máli og myndum"],"co":[["afla sér frekari þekkingar á lífríki Íslands með aðstoð fjölbreyttra miðla"],["leggja mat á upplýsingar sem tengjast lífríki Íslands á ábyrgan og rökrænan hátt"],["taka þátt í umræðum um málefni tengdum lífríki Íslands á ábyrgan og sjálfstæðan hátt"],["koma þekkingu sinni á framfæri á skapandi hátt"],["taka þátt í verklegum æfingum þar sem líffræðilegum rannsóknaraðferðum er beitt"],["taka tillit til íslenskrar náttúru í daglegu lífi og stuðla að sjálfbærni hennar"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c938c","a":"FÉLA3ÞR05","t":"Félagsfræði þróunarlanda","s":"félagsfræði","o":"þróunarlönd","d":"Í áfanganum er fjallað um mismunandi hugmyndir um skiptingu heimsins, einkum um skiptinguna í þróuð lönd og vanþróuð.  Fjallað er um mismunandi hugmyndir að baki hugtökum sem notuð eru yfir þróunarlönd svo sem „vanþróuð lönd“, „þriðji heimurinn“ og „suðrið“.  Nemendur læra um ólíka merkingu og bakgrunn þróunarhugtaka.  Sérstök umfjöllun er um efnahagsleg, stjórnmálaleg og menningarleg einkenni þróunarlanda, orsakir og afleiðingar mishröðunar heimshluta.  Kenningar um orsakir þróunarástands og hugmyndafræði sem kenningarnar byggja á eru  teknar til greiningar.  Fjallað verður um sögu og tegundir þróunarsamvinnu og hugað sérstaklega að verkefnum þar sem íslenskar stofnanir hafa komið við sögu.  Áhersla er lögð á að nemendur geri sér grein fyrir margbreytileika samfélaga sem teljast til þróunarlanda.","c":5,"l":3,"v":10,"st":"Samþykkt af skóla","m":1352815147,"p":"FÉLA2SS05","k":["hugtökum sem notuð eru í umræðu um þróunarmál","kenningum, viðfangsefnum, rannsóknaraðferðum og álitamálum","skýringum á þróunarmismun","mikilvægi þróunarsamvinnu og vandamálum sem tengjast henni"],"sk":["tengja einstök viðfangsefni lífi í nútímasamfélagi","leita upplýsinga um málefni þróunarlanda á markvissan og gagnrýnin hátt og setja í fræðilegt samhengi","lýsa breytingum sem orðið hafa á stöðu ýmissa þróunarlanda síðustu ár og áratugi","bera saman mismunandi aðferðir þróunaraðstoðar og þróunarsamvinnu"],"co":[["leggja mat á mismunandi útskýringar og kenningar um ástand og stöðu þróunarlanda"],["miðla þekkingu sinni og afstöðu í samræðu og rökræðu"],["taka gagnrýna afstöðu til aðferða í þróunarsamvinnu"],["vinna með heimildir og gera grein fyrir niðurstöðum sínum"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c938d","a":"FÉLA3AÐ05","t":"Aðferðafræði","s":"félagsfræði","o":"aðferðafræði","d":"Í þessum áfanga er áhersla lögð á tengsl á milli kenninga  og rannsóknaraðferða innan félagsfræðinnar.  Nemendur kynna sér megindlegar og eigindlegar rannsóknir innan félagsfræðinnar í þeim tilgangi að þeir geti metið, tekið afstöðu til og fjallað á gagnrýnin hátt um niðurstöður rannsókna.  Auk þess að geta greint á milli þessara ólíku rannsóknarhefða þá er í áfanganum fjallað sérstaklega um sögu og þróun megindlegra rannsóknaraðferða og stöðu þeirra innan félagsvísinda í dag. Farið verður yfir helstu einkenni þessara rannsókna og við hvaða aðstæður megindlegar aðferðir henta best. Ítarlega verður fjallað um helstu rannsóknaraðferðir og lögð áhersla á að nemendur öðlist reynslu í að beita þessum aðferðum. Þá er fjallað um greiningu megindlegra rannsóknargagna og skrif á rannsóknarniðurstöðum. Rætt verður um aðferðafræðileg og siðfræðileg vandamál sem tengjast rannsóknum.","c":5,"l":3,"v":11,"st":"Samþykkt af skóla","m":1352815547,"p":"FÉLA2SS05","k":["sjónarhornum kenninga í félagsfræði","sértækum hugtökum félagsfræðinnar","megindlegum og eigindlegum rannsóknaraðferðum","hvað hefur áhrif á val á rannsóknaraðferð","helstu aðferðum innan megindlegrar rannsóknarhefðar"],"sk":["tengja saman rannsóknarniðurstöður og kenningar","nýta fræðilegan texta á íslensku og ensku","beita megindlegum rannsóknaraðferðum á margvísleg viðfangsefni","beita fræðihugtökum á margvísleg viðfangsefni","miðla fræðilegu efni í ræðu og riti"],"co":[["geta séð samfélagið út frá ólíkum kenningarlegum sjónarhornum"],["vinna úr megindlegum rannsóknargögnum og leggja mat á félagsfræðirannsóknir"],["leggja mat á hvaða rannsóknaraðferðir henta best við margvíslegar aðstæður og á mismunandi rannsóknarefni"],["meta eigin frammistöðu og vinnuframlag sem og annarra á gagnrýnin hátt. Geta sett fram þekkingu sína í ræðu og riti"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c938e","a":"SÁLF3FG05","t":"Félagssálfræði, greind og persónleiki","s":"sálfræði","o":"félagssálfræði, greind, persónuleikinn","d":"Atferli, hugsanir og viðhorf eru skoðuð í félagslegu samhengi.  Meðal efnisþátta sem teknir eru fyrir eru staðalmyndir, fordómar, hjálpsemi, hlýðni, félagslegur þrýstingur, ást og fortölur.\r\nKenningar og staðreyndir um greind, vitsmunaþroska og greindarmælingar eru kynntar auk þess sem fjallað er um nokkrar gerðir greindarprófa.  \r\nMismunandi persónuleikakenningar eru skoðaðar, fjallað um mismunandi tegundir persónuleikaprófa og gerð tilraun til að útbúa persónuleikapróf. \r\nÁhersla er lögð á að nemandi geti tekið sjálfstæða, vel rökstudda afstöðu til álitamála varðandi félagssálfræði, persónuleikasálfræði og greind.","c":5,"l":3,"v":12,"st":"Samþykkt af skóla","m":1352821201,"p":"SÁLF2SS05","k":["félagssálfræði, helstu hugtökum hennar og rannsóknarniðurstöðum","greindarhugtakinu og mismunandi kenningum um greind","persónuleikanum og ólíkum kenningum um hann","mismunandi skoðunum fræðimanna á sálfræðilegum prófum og notkun þeirra","áhrifum erfða og umhverfis á mótun mannlegra eiginleika"],"sk":["greina samskiptamynstur einstaklinga og hópa í umhverfi sínu","útbúa drög að sálfræðilegum prófum og leggja mat á þau","framkvæma sálfræðirannsókn og setja niðurstöður fram í skýrslu og fyrirlestri","undirbúa og taka þátt í rökræðum um efni áfangans","leggja mat á eigin vinnu og vinnu annarra nemenda í áfanganum"],"co":[["skilja betur viðhorf og hegðun við mismunandi aðstæður, bæði hjá sjálfum sér og öðrum"],["taka afstöðu til og rökræða málefni sem tengjast sálfræðinni"],["miðla því sem hann hefur lært í áfanganum"],["vinna sjáfstætt úr sálfræðilegum gögnum og leggja mat á þau"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c938f","a":"SÁLF3LS05","t":"Lífeðlis- og skynjunarsálfræði","s":"sálfræði","o":"draumar, lífeðlisleg sálfræði, skynjunarsálfræði, svefn","d":"Farið er í gerð og starfsemi taugakerfis, einkum heila og taugafrumna. Hormónakerfið og tengsl hormóna við hegðun eru einnig tekin fyrir. Skynjun, lífeðlislegar undirstöður hennar og hugræn úrvinnsla er til umfjöllunar, sem og skynvillur. Fjallað er um vitund og breytt vitundarstig svo sem: svefn, drauma, dagdrauma, dáleiðslu og vímu af völdum lyfja.\r\nÁherslur áfangans kunna að ráðast nokkuð af áhuga nemenda og kennara.","c":5,"l":3,"v":13,"st":"Samþykkt af skóla","m":1352823367,"p":"SÁLF2SS05","k":["skiptingu taugakerfisins, grunneiningum þess og virkni","tengslum heila- og hormónastarfsemi við hegðun hugsun og tilfinningar","áhrifum lyfja á taugakerfið","gerð skynfæranna fimm, einkum augna og eyrna, virkni þeirra og úrvinnslu skynáreita í heila","mismunandi vitundarstigum, einkum ólíkum stigum svefns"],"sk":["afla upplýsinga um taugalífeðlissálfræði og setja í fræðilegt samhengi","greina helstu aðferðir við rannsóknir á taugakerfinu","miðla fræðilegu efni um taugalífeðlissálfræði skýrt og skilmerkilega í ræðu og riti","greina skaðsemi ávana- og vímuefna og miðla vitneskju sinni til annarra","rekja skynjun frá því að taugafrumur sjónar, heyrnar eða annarra skynfæra eru áreitt og þar til boð berast heila","greina mismun ólíkra vitandarstiga svefns og vöku"],"co":[["sýna frumkvæði og vinna á sjálfstæðan og skipulagðan hátt með viðfangsefni taugalífeðlissálfræðinnar"],["heimfæra viðfangsefni taugalífeðlissálfræðinnar yfir á sjálfan sig og aðra í kringum sig"],["færa rök fyrir því í hvaða mæli skynjun sé meðfædd eða lærð"],["fylgjast með eigin vitund og auka líkur á betri svefni"],["taka þátt í rökræðum um mál sem tengjast efni áfangans"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9390","a":"SÁLF3ÞR05","t":"Þroskasálfræði","s":"sálfræði","o":"lífstíðarþróun, þroski","d":"Helstu kenningar, viðfangsefni og rannsóknaraðferðir þroskasálfræðinnar eru tekin fyrir og rýnt í alhliða þroska frá frjóvgun fram á fullorðinsár, einkum líkamsþroska, vitsmunaþroska, persónuleikaþroska og tilfinningaþroska.   Byggt er á því sem nemendur hafa áður lært um sögu og sjónarmið sálfræðinnar, rannsóknaraðferðir og nám. Kafað er ofan í mismunandi þætti þrosaksálfræðinnar og helstu álitamál, s.s. erfðir og umhverfi, stigskiptan og samfelldan þroska svo eitthvað sé nefnt.    Komið er inn á álitamál eins og barnseignir táninga, fóstureyðingar o.fl.  Einnig eru mótunaráhrif fjölskyldu skoðuð auk þess sem tekin eru fyrir frávikshegðun og ýmis vandamál barna og unglinga. Viðfangsefnin geta verið breytileg og mótast af áhuga nemenda og kennara hverju sinni. Í áfangaum vinna nemendur a.m.k. eitt rannsóknarverkefni og flytja fyrirlestur.","c":5,"l":3,"v":14,"st":"Samþykkt af skóla","m":1352825808,"p":"SÁLF2SS05","k":["þroska mannsins frá frjóvgun fram á fullorðinsár","helstu hugtökum, kenningum, viðfangsefnum, rannsóknaraðferðum og álitamálum þroskasálfræðinnar","vægi þroskasálfræði innan sálfræðinnar og þeim hugmyndum sem hafa haft mest áhrif á framvindu hennar, s.s. hugmyndum sálkönnunar, atferlisstefnu og Piagets","mikilvægi bæði líkamlegrar og andlegrar umönnunar og örvunar fyrir þroska barnsins","mikilvægi fjölskyldunnar sem mótunarafls fyrir einstaklinginn","ýmsum vandamálum sökum uppeldisaðstæðna, sjúkdóma eða fötlunar"],"sk":["tengja viðfangsefni þroskasálfræði við sögu sálfræðinnar og mismunandi sjónarmið hennar","leita upplýsinga um efni tengt þroskasálfræði á fjölbreyttan hátt, s.s. með rannsóknum, í bókum, á netinu og í tímaritum, og setja í fræðilegt samhengi","skipuleggja og framkvæma einfalda þroskasáfræðirannsókn og gera grein fyrir niðurstöðum í skýrslu","miðla þroskasálfræðilegu efni skýrt og skilmerkilega í ræðu og riti og bregðast við uppbyggilegri gagnrýni","meta eigin verkefni og annarra á faglegan og gagnrýninn hátt"],"co":[["leggja mat á mismunandi hugmyndir um þroska og mótun mannsins"],["miðla skoðunum sínum um þroska og mótun mannsins í samræðu og rökræðum"],["nota hugmyndir þroskasálfræðinnar í samskiptum sínum við börn og í uppeldi þeirra"],["vinna úr sálfræðilegum gögnum og leggja mat á þau"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9391","a":"UPPE2SS05","t":"Sjónarmið og saga","s":"uppeldisfræði","o":"almenn uppeldisfræði, saga, sjónarmið","d":"Í áfanganum er fjallað um uppeldis- og menntunarfræði sem fræðigrein, rætur hennar, sögu og hagnýtingu. Lögð er áhersla á að efla skilning á mikilvægi uppeldis og menntunar og að nemendur öðlist hæfni í að takast á við störf er tengjast uppeldi og menntun.  Hugtakið uppeldi er tekið til skoðunar og umræðu. Mismunandi viðhorf til mannlegs eðlis eru skoðuð í ljósi kenninga um uppeldi og menntun. Fjallað er um þróun uppeldis og menntunar og hugmyndafræði nokkurra þekktra uppeldisfrömuða. Fjallað verður um uppeldi í íslensku nútímasamfélagi, t.d. í tenglum við dagvistun, kynjamismun og breytingar í fjölskyldum. Einnig verður fjallað um þau uppeldisáhrif sem list, bækur, fjölmiðlar, leikir, leikföng, íþróttir, o.fl. hafa á börn.","c":5,"l":2,"v":4,"st":"Samþykkt af skóla","m":1352826444,"p":"FÉLV1ÞF05","k":["mótunaraðilum uppeldis og menntunar í samfélaginu","sérstöðu þeirra aðila og stofnana sem eru mótandi fyrir uppeldi og hvað þeir eiga sameiginlegt","kenningum sem hafa áhrif á uppeldi og menntun","margvíslegum könnunum á uppeldi og menntun","mikilvægi þeirra sem starfa með börnum og unglingum","aðalatriðum í sögu uppeldis og menntunar"],"sk":["beita einföldum kenningum í uppeldis- og menntunarfræði","túlka kannanir tengdar uppeldi og menntun","greina á milli tilfinningalegs mats og faglegs mats á ýmsum þáttum sem hafa áhrif á uppeldi og menntun"],"co":[["leggja sjálfur gagnrýnið mat á hvað er vænlegt til árangurs í uppeldi barna"],["geta hagnýtt sér kenningar í raunhæfum verkefnum"],["meta siðferðileg álitamál í tengslum við uppeldi og menntun"],["afla sér heimilda eftir fjölbreyttum leiðum"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9392","a":"UPPE3RA05","t":"Rannsóknaraðferðir","s":"uppeldisfræði","o":"kenningar, rannsóknaraðferðir","d":"Í þessum áfanga er áhersla lögð á tengsl á milli kenninga innan uppeldis- og menntunarfræða og rannsóknaraðferða.  Nemendur kynna sér megindlegar og eigindlegar rannsóknir innan uppeldis – og menntunarfræða í þeim tilgangi að þeir geti metið, tekið afstöðu til og fjallað á gagnrýnin hátt um niðurstöður  rannsókna á uppeldi og menntun.  Auk þess að geta greint á milli þessara ólíku rannsóknarhefða þá er í áfanganum fjallað sérstaklega um sögu og þróun eigindlegrar rannsóknarhefðar og stöðu eigindlegra rannsókna innan félagsvísinda í dag. Farið verður yfir helstu einkenni þessara rannsókna og við hvaða aðstæður eigindlegar aðferðir henta best. Ítarlega verður fjallað um helstu rannsóknaraðferðir og lögð áhersla á að nemendur öðlist reynslu í að beita þessum aðferðum. Þá er fjallað um greiningu eigindlegra rannsóknarganga og skrif á rannsóknarniðurstöðum.","c":5,"l":3,"v":4,"st":"Samþykkt af skóla","m":1352827124,"p":"UPPE2SU05","k":["sjónarhornum kenninga í uppeldis- og menntunarfræði","sértækum hugtökum uppeldis- og menntunarfræði","megindlegum og eigindlegum rannsóknaraðferðum","hvað hefur áhrif á val á rannsóknaraðferð","helstu aðferðum innan eigindlegrar rannsóknarhefðar"],"sk":["tengja saman rannsóknarniðurstöður og kenningar","nýta fræðilegan texta á íslensku og ensku","beita eigindlegum rannsóknaraðferðum á margvísleg viðfangsefni","beita fræðihugtökum á margvísleg viðfangsefni","miðla fræðilegu efni í ræðu og riti"],"co":[["sjá uppeldis- og menntunarfræðileg hugðarefni út frá ólíkum kenningarlegum sjónarhornum"],["vinna úr eigindlegum rannsóknargögnum og leggja mat á rannsóknir í uppeldis- og menntavísindum"],["leggja mat á hvaða rannsóknaraðferðir henta best við margvíslegar aðstæður og á mismunandi rannsóknarefni"],["meta eigin frammistöðu og vinnuframlag sem og annarra á gagnrýnin hátt. geta sett fram þekkingu sína í ræðu og riti"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9393","a":"UPPE2SU05","t":"Skólastarf og uppeldi","s":"uppeldisfræði","o":"skólastarf, uppeldi","d":"Kynnt verða helstu markmið leikskóla, grunnskóla og framhaldsskóla og starfsemi mismunandi stofnana sem sinna börnum og ungmennum. Skólakerfið getur stundum reynst flókið og því er þekking á skólakerfinu og hvernig það kemur til móts við ólíkar þarfir nemenda forsenda þess að skólastarf verði farsælt. Nemendur kynna sér helstu kenningar um þroska og hegðun sem stuðst er við í skólastarfi og þekki helstu áhættuþætti er geta haft áhrif á nám og líðan. Jafnframt verður fjallað um verndandi þætti og seiglu sem geta skipt miklu máli fyrir börn og ungmenni sem standa frammi fyrir erfiðleikum. Auk þess verður fjallað um mismunandi aðferðir við lestrarkennslu við upphaf skólagöngu en lestrarkennsla nemenda er einstaklingsbundin þar sem lestrargeta þeirra er mismunandi við upphaf skólagöngu. Þá verður áhersla lögð á samspil kennara og nemenda í kennslustofunni með tilliti til kynhlutverka og hegðunar. Fjallað er um málefni bráðgerra barna og stuðningskennslu barna með sérþarfir. Fjallað er um helstu kvíðavalda er geta birst í lífi barna, mikilvægi sjálfsmyndar í þroska og mikilvægi forvarna sem varða einelti og áfengis- og fíkniefnanotkun. Auk þess verður fjallað um uppeldi í tengslum við íþróttir og starf í félagsmiðstöðvum.","c":5,"l":2,"v":5,"st":"Samþykkt af skóla","m":1352827530,"p":"FÉLV1ÞF05","k":["íslenska grunn- og framhaldsskólakerfinu","helstu rannsóknarniðurstöðum á sviði kennslu og skólastarfs","einstaklingsmun nemenda innan skólans","aðferðum sem hægt er að nota til farsælla samskipta í skólastofunni","aðferðum sem koma að notum í tengslum við forvarnir í skólum","hvernig kenningar nýtast í uppeldisstarfi innan stofnana"],"sk":["afla upplýsinga er tengjast rannsóknum á kennslu og skólastarfi og setja í fræðilegt samhengi","nýta fræðilegan texta á íslensku og ensku","afla uppeldisfræðilegra upplýsinga og nýta þær í hagnýtum verkefnum","beita kenningum á ýmis viðfangsefni","miðla fræðilegu efni í ræðu og riti"],"co":[["vinna úr rannsóknargögnum og leggja mat á rannsóknir á kennslu og uppeldistarfi"],["leggja mat á hvaða samskiptaaðferðir henta best við margvíslegar aðstæður og ólíka nemendur"],["beita grundvallaraðferðum í eineltismálum"],["taka þátt í málefnalegum umræðum um uppeldisleg málefni og færa skýr rök                fyrir afstöðu sinni"],["meta eigin frammistöðu og vinnuframlag sem og annarra á gagnrýninn hátt og setja fram þekkingu sína í ræðu og riti"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9394","a":"EFNA2GE05","t":"Gaslögmálið og efnahvörf","s":"efnafræði","o":"gaslögmálið, hraði efnahvarfa, orka í efnahvörfum","d":"Í áfanganum er áfram unnið með undirstöðuþætti efnafræðinnar. Til viðbótar er fjallað um gaslögmálið og tengingu þess við mól- og massaútreikninga í efnahvörfum auk þess sem farið verður í orkubreytingar við efnahvörf, hraða efnahvarfa og jafnvægishugtakið kynnt. Áhersla er lögð á aukið sjálfstæði í verklegum æfingum og vinnubrögðum almennt.","c":5,"l":2,"v":10,"st":"Samþykkt af skóla","m":1352892986,"p":"EFNA2LM05","k":["gaslögmálinu og hagnýtingu þess í efnafræði og skyldum greinum","orkuhugtakinu og orkubreytingum við efnahvörf","helstu efnagreiningaraðferðum","helstu drifkröftum efnahvarfa","jafnvægishugtakinu"],"sk":["beita mól-, rúmmáls-, massa- og hlutfallareikningi í tengslum við efnahvörf","greina óþekkt efnismagn t.d. með títrun eða söfnun gass","beita einfaldri efnagreiningu","reikna út hvarfhraða og orkubreytingar við efnahvörf","setja upp og framkvæma verklegar æfingar og vinna markvisst úr niðurstöðum"],"co":[["leggja rökstutt mat á gang efnahvarfa og áhrif utanaðkomandi þátta t.d. á hvarfhraða og jafnvægisstöðu"],["vinna sjálfstætt að úrlausn efnafræðilegra viðfangsefna, bæði verklega og skriflega"],["koma niðurstöðum rannsókna á framfæri með skilmerkilegum hætti bæði í ræðu og riti"],["notfæra sér efnafræðina í öðrum raungreinum og hinu daglega lífi"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9395","a":"EFNA2LM05","t":"Lotukerfið og mólhugtakið","s":"efnafræði","o":"grunnhugtök, lotukerfið, mólhugtakið","d":"Í áfanganum er farið í undirstöðuatriði efnafræðinnar og nemendur látnir vinna með grunnhugtök greinarinnar. Þeir þjálfast í meðferð hjálpargagna, s.s. lotukerfis, jónatöflu, töflu yfir auðleyst og torleyst sölt, rafdrægnigildi frumefna o.þ.h. Nemendur kynnast verklegum æfingum í efnafræði og þjálfast í þeim vinnubrögðum sem þar eru viðhöfð.","c":5,"l":2,"v":11,"st":"Samþykkt af skóla","m":1352893727,"p":"engar","k":["uppbyggingu atóma, jóna og sameinda","rafeindaskipan og mikilvægi hennar","flokkun efna, efnatáknum og helstu efnabreytingum","efnatengjum og áhrifum þeirra á eiginleika efna","helstu gerðum efnahvarfa","mólhugtakinu","nafnakerfi ólífrænna efna"],"sk":["nota hjálpargögn í efnafræði, s.s. lotukerfi, jónatöflu, rafdrægnigildi, virkniröð málma","rita og stilla efnajöfnur","beita mólútreikningum og hlutfallareikningi í efnahvörfum","framkvæma verklegar æfingar og vinna úr niðurstöðum"],"co":[["tengja efnafræðina við daglegt líf og umhverfi"],["leggja rökstutt mat á eiginleika efna, s.s. ástandsform, hvarfhegðun o.fl. með aðstoð hjálpargagna"],["sjá notagildi efnafræðinnar og mikilvægi í raungreinum"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9396","a":"LÍFF3LE05","t":"Lífeðlisfræði","s":"líffræði","o":"lífeðlisfræði","d":"Í þessum áfanga er gerð grein fyrir grunninntaki lífeðlisfræði og fjallað almennt um líkamsstarfsemi lífvera með megináherslu á lífeðlisfræði mannslíkamans. Skoðuð er innri starfsemi frumna og hlutverk frumulíffæra skilgreind. Fjallað er um boðflutning um bæði hormónakerfið og taugakerfið. Blóðrás og önnur flutningskerfi eru einnig skoðuð sem og varnarkerfi, úrgangslosunarkerfi, næringarnám og melting. Farið er í stoðkerfi og hreyfingu, skynjun, æxlun og fósturþroskun. Fjallað er um hvert líffærakerfi fyrir sig með megináherslu á byggingu þeirra og virkni í mannslíkamanum, einnig eru þau borin saman við líffærakerfa annarra lífvera eftir því sem við á. Fjallað er um heilbrigða starfsemi líkamans sem og algeng frávik eða sjúkdóma. Lögð er áhersla á að nemendur öðlist þekkingu og skilning á starfsemi eigin líkama og geti tekið frekari ábyrgð á lifnaðarháttum sínum og viðhaldið heilbrigði sínu . Auk þess að tengja lífeðlisfræðina daglegu lífi nemenda eru þeir undirbúnir fyrir frekara nám í lífeðlisfræði og skyldum greinum.","c":5,"l":3,"v":10,"st":"Samþykkt af skóla","m":1352990828,"p":"LÍFF2EL05","k":["frumulífeðlisfræði","eðli taugaboða og starfsemi taugakerfis","eðli hormóna og starfsemi innkirtlakerfis","hjarta- og æðakerfi og mismunandi hlutverkum blóðs","varnarkerfum mannslíkamans","úrgangslosun og efnastjórn","öndunarkerfi og stjórnun þess","uppbyggingu og virkni meltingarkerfis","stoðkerfum og eðli hreyfingar","mismunandi skynfærum","æxlunarkerfi og fósturþroska","samhæfingu og stjórnun líffærakerfa"],"sk":["beita grunnhugtökum lífeðlisfræðinnar á skilmerkilegan hátt og í rökrænu samhengi","lesa lífeðlisfræðilegar upplýsingar úr máli og myndum","meta áhrif lífshátta á heilbrigða þroskun og starfsemi líkamans","beita einföldum lífeðlisfræðilegum rannsóknaraðferðum","beita einföldum líffræðilegum aðferðum  í verklegum æfingum og vinna skýrslur úr þeim","afla sér áreiðanlegra heimilda frá ýmsum mismunandi miðlum"],"co":[["leggja mat á einfaldar lífeðlisfræðilegar upplýsingar daglegs lífs á gagnrýninn hátt"],["tjá sig um lífeðlisfræðileg málefni daglegs lífs á skýran og ábyrgan hátt"],["taka ábyrgð á eigin lífi m.t.t. lífeðlisfræðilegra þátta"],["taka þátt í einföldum lífeðlisfræðilegum athugunum, tengja niðurstöðurnar við fræðin og draga ályktanir af þeim"],["afla sér frekari þekkingar á sviði lífeðlisfræði"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9397","a":"LÍFF3EF05","t":"Erfðafræði","s":"líffræði","o":"erfðafræði","d":"Í áfanganum er fjallað um sögu erfðafræðinnar, stöðu hennar og mikilvægi í nútíma samfélagi. Farið er í helstu grunnhugtök og viðfangsefni erfðafræðinnar. Erfðafræðikenningar Mendels eru skoðaðar og tengdar við þekkingu okkar í dag. Mismunandi litninga- og genabreytingar eru kynntar. Próteinmyndun er rakin frá DNA og uppbygging erfðaefnisins skoðuð ítarlega. Virkni gena, erfðatækni og siðferði erfðarannsókna eru einnig umfjöllunarefni. Lögð er áhersla á að nemendur skilji hvernig erfðaefnið er uppbyggt, hvernig það flytur upplýsingar frá einni kynslóð til annarrar og hvernig einföld erfðalögmál virka. Áhrif erfðaefnis á fjölbreytileika lífvera og þróun er einnig áhersluatriði auk þess að nemendur þekki nokkra algengustu erfðasjúkdóma mannsins. Fjallað er um mikilvægi grundvallarþekkingar á erfðafræði í daglegu lífi, hraða þróun erfðatækni og möguleika framtíðarinnar.","c":5,"l":3,"v":11,"st":"Samþykkt af skóla","m":1352991303,"p":"LÍFF2EL05","k":["sögu og þróun erfðafræðinnar","kenningum Mendels og grunnhugtökum erfðafræðinnar","ferli frumuskiptinga, bæði  mítósu og meisósu","byggingu erfðaefnis (DNA, RNA, gen, litningar)","afritun, umritun og þýðingu erfðaefnis","breytingum sem verða á erfðaefni","mismunandi erfðamynstrum og tjáningu gena","kynákvörðun lífvera og erfðum tengdum kynferði","ýmsum meingenum og erfðasjúkdómum","erfðum örvera","tengslum erfða, fjölbreytileika lífvera og þróunar","grundvallaratriðum í erfðatækni","siðferðislegum álitamálum erfðafræði"],"sk":["beita grunnhugtökum erfðafræðinnar á skilmerkilegan hátt og í rökrænu samhengi","rekja einfaldar erfðir","finna út líkur á erfðum tengdra og ótengdra eiginleika","tengja saman basaröð í DNA, basaröð í RNA og amínósýruröð próteina","lesa erfðafræðilegar upplýsingar úr máli og myndum frá mismunandi miðlum","tjá sig um erfðafræðileg málefni á skýran og ábyrgan hátt"],"co":[["leggja mat á upplýsingar sem tengjast erfðafræðilegum viðfangsefnum á gagnrýninn hátt"],["taka þátt í umræðum um erfðafræðileg málefni daglegs lífs á ábyrgan og sjálfstæðan hátt"],["taka rökstudda afstöðu í álitamálum er varða erfðatækni og önnur erfðafræðileg málefni"],["afla sér frekari þekkingar á erfðafræðilegum viðfangsefnum"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c9398","a":"EFNA3JA05","t":"Jafnvægi","s":"efnafræði","o":"jafnvægi, ólífræn efnafræði","d":"Viðfangsefni áfangans er jafnvægishugtakið. Jafnvægi í efnahvörfum er skoðað frá ýmsum hliðum en áhersla lögð á jafnvægi í þremur megingerðum efnahvarfa: sýru-basa hvörfum, oxunar-afoxunarhvörfum og fellingarhvörfum. Nemendur vinna sjálfstætt að framkvæmd og úrvinnslu verklegra æfinga er tengjast viðfangsefnum áfangans.","c":5,"l":3,"v":14,"st":"Samþykkt af skóla","m":1352902655,"p":"EFNA2LM05","k":["jafnvægi í efnahvörfum","efnafræði sýra og basa og jafnvægi hjá daufum sýrum og bösum","efnafræði lausna, jafnalausnum, títrunum og leysnimargfeldi","sjálfgengni efnahvarfa, fríorku og tengslum hennar við jafnvægisfastann","rafefnafræði"],"sk":["nota jafnvægisfasta og jafnvægisstyrkja til útreikninga","beita útreikningum er tengjast sýrum og bösum","reikna út orkubreytingar í efnahvörfum og tengja þær við jafnvægisástand","setja upp, framkvæma og vinna úr verklegum æfingum á sjálfstæðan hátt"],"co":[["sjá tengslin milli náttúrufræðigreina og geta yfirfært þekkingu og leikni á milli þeirra"],["sýna sjálfstæði í vinnubrögðum og bera ábyrgð á eigin námsframvindu"],["leggja rökstutt mat á áreiðanleika rannsóknarniðurstaðna, sinna eigin og annarra"],["taka þátt í rökræðum, mynda sér skoðanir og taka ákvarðanir er lúta að málefnum sem tengjast efnafræði"],["tengja efnafræðina við daglegt líf og umhverfi og sjá hagnýtingargildi hennar við lausn flókinna verkefna"],["takast á við frekara nám í efnafræði"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c939a","a":"EFNA3LR05","t":"Lífræn efnafræði","s":"efnafræði","o":"lífræn efnafræði","d":"Í áfanganum er farið í grunnatriði lífrænnar efnafræði. Eiginleikar, bygging og flokkun lífrænna efna eru skoðaðir sem og IUPAC-nafngiftakerfið. Einnig er farið yfir tengi lífrænna sameinda, hendni þeirra og helstu efnahvörf lífrænna efna. Þrír meginflokkar lífefna eru skoðaðir sérstaklega; sykrur, fituefni og prótein. Áhersla er lögð á notagildi fræðanna, tengingu þeirra við daglegt umhverfi nemenda og undirbúning þeirra undir frekara nám.","c":5,"l":3,"v":15,"st":"Samþykkt af skóla","m":1352903698,"p":"EFNA2LM05\r\nEFNA2GE05 er æskilegur undanfari en ekki nauðsynlegur","k":["lögun og tengjum lífrænna sameinda","svigrúmablöndun kolefnis, sp, sp2 og sp3 - svigrúmum","helstu reglum IUPAC-nafnakerfisins","helstu flokkum lífrænna efna, einkennum þeirra og byggingu","helstu efnahvörfum lífrænna efna","hendni lífrænna sameinda","helstu byggingareinkennum og skilgreiningum sykra, lípíða, peptíða, próteina og kjarnsýra"],"sk":["finna og lýsa sp, sp2 og sp3 svigrúmablöndun kolefnis í mismunandi efnasamböndum","nota flokkun og nafngiftakerfi lífrænna efna","teikna mismunandi rúmísómerur og byggingarísómerur","segja til um hendni sameinda","skrifa og túlka efnahvörf lífrænna efna","afla sér efnafræðilegra upplýsinga frá mismunandi miðlum","beita grunnhugtökum lífrænnar efnafræði á skilmerkilegan hátt og í rökrænu samhengi","beita einföldum efnafræðilegum aðferðum í verklegum æfingum og skrifa skýrslur"],"co":[["leggja mat á áreiðanleika niðurstaðna verklegra æfinga sinna"],["tengja efnafræðina við daglegt líf og umhverfi og sjá notagildi hennar"],["sjá tengsl mismunandi náttúrufræðigreina og yfirfæra þekkingu milli þeirra"],["taka þátt í umræðum um efnafræðileg málefni daglegs lífs á ábyrgan og sjálfstæðan hátt"],["afla sér frekari þekkingar á viðfangsefnum lífrænnar efnafræði"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c939b","a":"JARÐ2JÍ05","t":"Jarðfræði íslands","s":"jarðfræði","o":"jarðfræði íslands","d":"Í þessum áfanga kynnast nemendur mótun innri og ytri afla á landið. Fjallað verður fræðilega um þau ferli sem móta jörðina og fræðin tengd við þau ummerki sem nemendur sjá í umhverfinu. Þeir læra að þekkja ummerkin og vinna verkefni tengd þeim. Einnig kynnast nemendur ýmsum aðferðum jarðkönnunar og mælitækjum tengdum þeim. Þá er fjallað um hagnýtingu jarðefna, jarðvarma og vatnsafls. Helstu efnisþættir áfangans eru:\r\n\r\n•\tinnræn og útræn öfl\r\n\r\n•\tinnri gerð jarðar og landrek\r\n\r\n•\tmyndun og þróun Íslands og samhengi við umhverfið\r\n\r\n•\teldvirkni og jarðskjálftar, tengdar jarðmyndanir\r\n\r\n•\tveðrun og rof og tengdar jarðmyndanir\r\n\r\n•\tsteindir og bergtegundir, eiginleikar, myndun og flokkun\r\n\r\n•\tkort og kortagerð\r\n\r\n•\tjarðefni\r\n\r\n•\tjarðvarmi og vatnsorka","c":5,"l":2,"v":8,"st":"Samþykkt af skóla","m":1352975422,"p":"engar","k":["innri gerð jarðar og þeim leiðum sem notaðar eru við könnun hennar","mismunandi eldvirkni og þeim þáttum sem hafa áhrif á hana","landreki, drifkrafti þess og afleiðingum, s.s. eldvirkni og jarðskjálftum","myndun steinda og bergs og ásýnd og eiginleikum helstu steinda og bergtegunda","helstu roföflum, ferlum þeirra og ummerkjum","myndun og þróun Íslands"],"sk":["beita hugtökum og kenningum á skilmerkilegan hátt og í rökrænu samhengi","beita staðsetningarkerfi jarðarinnar á kortum og/eða með GPS-tækni","greina ummerki jarðfræðilegra ferla og skilgreina út frá mótunarferli þeirra","lesa af jarðfræðikortum, greina uppbyggingu jarðlagastafla og túlka jarðlög út frá þeim","staðsetja jarðfræðifyrirbæri á landinu og útskýra samhengi þeirra við jarðfræðiöflin","greina bergtegundir og steindir og útskýra myndunarferli þeirra"],"co":[["sýna sjálfstæð og öguð vinnubrögð í upplýsingaöflun, mati, úrvinnslu og framsetningu"],["lesa í umhverfi sitt, draga ályktanir, flokka, aðgreina og tengja fyrirbæri við jarðfræðilegt samhengi"],["átta sig á uppbyggingu jarðlagastafla og rekja myndunarsögu út frá afstöðu jarðlaga"],["fjalla um málefni jarðfræðinnar á rökrænan og upplýstan hátt"],["gera sér grein fyrir notagildi og mikilvægi jarðfræðinnar í daglegu lífi"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c939c","a":"NÁTT1LE05","t":"Kynning á líf- og efnafræði","s":"náttúrufræði","o":"efnafræði, líffræði","d":"Meginviðfangsefni áfangans er að kynna nemendum líffræði og efnafræði frá mismunandi sjónarhornum og tengja þessar vísindagreinar daglegu lífi þeirra. Í áfanganum er almenn aðferðafræði náttúru- og raunvísinda einnig kynnt fyrir nemendum. Efnafræðin og líffræðin eru fléttaðar saman og uppbygging lífheimsins skoðuð allt frá atómi upp í flókna lífveru (t.d. manninn). Í efnafræðinni er s.s. uppbygging atóms skoðuð, sem og frumefni, efnasambönd, eiginleikar efna, efnatákn, heiti efna og efnahvörf með áherslu á efni líkamans. Í líffræði verður bygging og starfsemi frumna, vefja, líffæra og helstu líffærakerfa skoðuð með áherslu á líkama mannsins. Nemendur læra um grunnstarfsemi lífvera, flokkun þeirra, æxlun og erfðafræði. Einnig verða grundvallaratriði vistfræði kynnt með áherslu á umhverfi nemenda og sjálfbærni. Lögð er áhersla á að nemendur öðlist skilning á tengslum líffræðinnar við daglegt líf.","c":5,"l":1,"v":3,"st":"Samþykkt af skóla","m":1352991850,"p":"engar","k":["grundvallarhugtökum, sérkennum og aðferðafræði líf- og efnafræði","grunnuppbyggingu atóms, frumefna og efnasambanda","grunnuppbyggingu lotukerfisins, efnatáknum og heitum efna","einföldum efnahvörfum og eiginleikum efna með áherslu á efni líkamans","byggingu og starfsemi fruma, líffæra og líffærakerfa með áherslu á eigin líkama","helstu einkennum og grunnstarfsemi lífvera","flokkun lífvera í ríki og fylkingar","helstu kenningum um erfðir og þróun","grundvallaratriðum vistfræði og tengslum hennar við sjálfbærni"],"sk":["beita grunnhugtökum fræðigreinanna á skilmerkilegan hátt og í rökrænu samhengi","tjá sig um líf- og efnafræðileg málefni samfélagsins á skýran og ábyrgan hátt","lesa einfaldar líf- og efnafræðilegar upplýsingar úr máli og myndum","skoða og greina lífverur í náttúrunni"],"co":[["leggja gróft mat á upplýsingar sem tengjast líf- og efnafræðilegum viðfangsefnum í samfélaginu á gagnrýninn hátt"],["taka ábyrga afstöðu um eigin velferð og áhrif sín á umhverfið með tilliti til einfaldra líf- og efnafræðilegra þátta"],["afla sér frekari þekkingar á líf- og efnafræðilegum viðfangsefnum daglegs lífs"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c939d","a":"STJÖ2AL05","t":"Alheimurinn","s":"stjörnufræði","o":"alheimurinn","d":"Viðfangsefni þessa áfanga er stjörnuhimininn og þau fyrirbæri sem þar finnast. Fjallað er ítarlega um eiginleika rafsegulbylgja og aðferðir stjörnufræðinga við rannsóknir með þeim, mismunandi gerðir sjónauka, reikistjörnur og önnur fyrirbrigði sólkerfisins, eðli sólarinnar, líf sólstjarna frá fæðingu til dauða, vetrarbrauta, fjarfyrirbrigða, heimsmynd nútímans og leit að lífi á öðrum hnöttum. Fjallað er um geimrannsóknir og geimferðir. Nemendur læra að lesa á stjörnukort og nýta sér upplýsingatækni við stjörnuathuganir og stjörnuskoðun. Einnig er fjallað um sögu stjörnufræðinnar.","c":5,"l":2,"v":1,"st":"Samþykkt af skóla","m":1352992991,"p":"STÆR2AF05 / HSTÆ2FT05","k":["helstu einkennum og eiginleikum reikistjarna sólkerfisins","ýmsum stjarnfræðilegum einingum og samböndum","eðli og víxlverkun rafsegulgeisla og efnis","mismunandi gerðum sjónauka","dæmigerðu lífshlaupi misstórra sólstjarna","eðli og gerð mismunandi vetrarbrauta","heimsmynd nútímans","geimferðum og geimrannsóknum"],"sk":["reikna sólarhæð og sólargang út frá stöðu sólar á sólbaug og breiddargráðu athuganda","reikna út eiginleika stjarna, s.s. birtu, fjarlægðir, yfirborðshitastig, ljósafl út frá gefnum forsendum","reikna út helstu eiginleika sjónauka út frá gefnum forsendum","beita lögmálum Keplers og Newtons á sól, reikistjörnurnar og tungl þeirra","lesa upplýsingar s.s. stærð, yfirborðshita, ljósafl, ljósaflsflokkun ofl. úr H-R línuriti","reikna fjarlægðir fyrirbæra með mismunandi aðferðum, s.s. sólmiðjuhliðrun, sefítum, Hubblefastanum ofl."],"co":[["sýna sjálfstæð og öguð vinnubrögð í upplýsingaöflun, mati, úrvinnslu og framsetningu"],["mynda sér heildstæða sýn á heimsmynd nútímans"],["fjalla á faglegan hátt um möguleika til geimferða og geimrannsókna"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c939e","a":"STÆR1AR05","t":"Algebra og rúmfræði","s":"stærðfræði","o":"algebra, rúmfræði","d":"Meginefni áfangans er rúmfræði, bókstafareikningur, jöfnur, beinar línur og prósentur.\r\n\r\nEfnisþættir sem teknir verða fyrir í áfanganum eru:\r\n\r\nRúmfræði:  Kynning á frumhugtökum rúmfræðinnar, hornasumma þríhyrnings, hlutföll í þríhyrningum og regla Pýþagórasar. Flatarmál og rúmmál. Horn við hring. Hornaföll í rétthyrndum þríhyrningum. Mælieiningar. Valin atriði þar sem þjálfuð er sönnun reglu. \r\n\r\nTalnareikningur: Meðferð heilla talna og brota. Hlutföll, prósentur og vextir.\r\n\r\nBókstafareikningur:  Liðun, þáttun, margliður, uppsettar og óuppsettar jöfnur af fyrsta stigi. Hnitakerfið, jafna og graf beinnar línu og jöfnuhneppi. ","c":5,"l":1,"v":13,"st":"Samþykkt af skóla","m":1352998050,"p":"engar.\r\n\r\nNemandi skal hafa lokið námsefni grunnskóla og hafa haldgóða undirstöðuþekkingu í stærðfræði","k":["rúmfræði, talnareikningi og bókstafareikningi s.s. að framan greinir"],"sk":["vinna með undirstöðuþætti talna- og bókstafareiknings, s.s. röð aðgerða, liðun og þáttun","leysa fyrsta stigs jöfnur með einni og tveimur óþekktum stærðum og að einangra eina stærð úr jöfnu með mörgum óþekktum stærðum","teikna graf beinnar línu í hnitakerfi, finna hallatölu og skurðpunkta við ása hnitakerfisins og skurðpunkta tveggja lína","finna jöfnur lína sem eru samsíða gefinni línu eða hornréttar á hana","vinna með hlutföll og kvarða","leysa öll algeng dæmi um prósentureikning, þ.m.t. útreikninga á virðisaukaskatti, samsettar prósentur, reikning vaxta og vaxtavaxta","leysa rúmfræðileg vandamál, s.s. að finna horn og hliðar í þríhyrningum, reikna flatarmál og rúmmál, reikna stærðir í einslaga þríhyrningum, finna ferilhorn og miðhorn og að vinna með mælieiningar","sanna mjög einfaldar rúmfræðireglur"],"co":[["ræða um stærðfræðileg viðfangsefni við aðra og setja úrlausnir sínar fram skriflega á skiljanlegan og snyrtilegan hátt"],["þýða margs konar verkefni á stærðfræðimál og setja þau upp sem jöfnu eða annað stærðfræðilegt viðfangsefni. Meta hvort svör eru raunhæf"],["vinna til baka út frá þekktum stærðum og reglum, t.d. að reikna radíus kúlu ef rúmmál hennar er gefið"],["skilja merkingu helstu stærðfræðitákna og hugtaka í námsefninu"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c939f","a":"STÆR2AF05","t":"Algebra, föll og mengi","s":"stærðfræði","o":"algebra, föll, gröf","d":"Meginefni áfangans er algebra, föll og mengi.\r\n\r\nEfnisþættir sem teknir verða fyrir í áfanganum eru:\r\n\r\nBókstafareikningur:  Veldi og rætur. Jöfnur af öðru stigi. Könnun annars stigs ferla (fleygboga) í hnitakerfi. Meðferð algebrubrota.  Margliðudeiling. Ójöfnur af fyrsta og öðru stigi. Kynning á vísisföllum og logrum.\r\n\r\nFöll: Fallhugtakið innleitt og nokkur algeng föll kynnt, t.d. tölugildisfallið.\r\n\r\nMengi:  Grunnhugtök mengjafræði, s.s. stök, hlutmengi, sammengi og Vennmyndir.\r\n","c":5,"l":2,"v":19,"st":"Samþykkt af skóla","m":1352999203,"p":"STÆR1AR05","k":["algebru, föllum og mengjum, s.s. að framan greinir"],"sk":["nota veldi og rætur, helstu veldareglur og vinna með brotna veldisvísa","finna núllstöðvar, samhverfuás og útgildi fleygboga, teikna þá í hnitakefi og finna skurðpunkta þeirra við beinar línur","leysa annars stigs jöfnur með ferningsrótaraðferð, þáttun og með lausnarformúlu, leysa rótarjöfnur og að nota breytuskipti til að leysa dulbúnar annars stigsjöfnur","leysa ójöfnur af fyrsta og öðru stigi, m.a. með hjálp formerkjatöflu","nota logra til að leysa einfaldar vísisjöfnur","deila með margliðudeilingu og að nota hana til að þátta flóknar margliður","lengja, stytta, deila, margfalda og leggja saman algebrubrot","vinna með fallhugtakið, s.s. að ákvarða hvort vörpun er fall, finna formengi og varpmengi og teikna gröf falla","nota einfaldan mengjareikning og Vennmyndir"],"co":[["skrá lausnir sínar skipulega og geta rætt þær og útskýrt fyrir öðrum"],["skilja merkingu og tengsl hugtaka í námsefninu og vinna með þau"],["beita gagnrýninni hugsun og skipulögðum aðferðum við að leysa verkefni út frá þekkingu á lausnum svipaðra verkefna"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93a0","a":"STÆR2HV05","t":"Hornaföll, vigrar og keilusnið","s":"stærðfræði","o":"hornaföll, vigrar","d":"Meginefni áfangans er hornaföll, vigrar og keilusnið. Sérstök áhersla er lögð á sannanir og skýra og rétta stærðfræðilega framsetningu.\r\n\r\nEfnisþættir sem teknir verða fyrir í áfanganum eru:\r\n\r\nHornaföll:   Hornaföll í rétthyrndum þríhyrningi, hornafallareglur, almenn skilgreining hornafalla, umritanir með hornaföllum, hornafallajöfnur og ójöfnur, gröf hornafalla, bogamál.\r\n\r\nVigrar:   Vigrar í sléttum fleti, samlagning, lengd, samsíða og hornréttir vigrar, hnit, innfeldi, horn milli vigra, miðpunktur striks.\r\n \r\nKeilusnið:   Hringir, sporbaugar, fleygbogar og breiðbogar.","c":5,"l":2,"v":20,"st":"Samþykkt af skóla","m":1353000340,"p":"STÆR2AF05","k":["hornaföllum, vigrum og keilusniðum, s.s. að framan greinir"],"sk":["finna lengdir og horn í rétthyrndum og órétthyrndum þríhyrningum og flatarmál þeirra","einfalda og umrita stæður sem innihalda hornaföll og leysa hornafallajöfnur og ójöfnur","finna lotu, útslag og hliðrun hornafalla og teikna gröf þeirra eða lesa úr gröfum","breyta gráðum í bogamál og öfugt","beita helstu reiknireglum vigurreiknings, t.d. að finna hnit vigra, lengd þeirra, innfeldi tveggja vigra og horn milli vigra","finna miðju og radíus hrings út frá jöfnu hans, eða öfugt, m.a. með því að fylla í ferninginn og vinna á samsvarandi hátt með jöfnur sporbauga og breiðboga","sanna einfaldar reglur"],"co":[["skilja merkingu og tengsl hugtaka í námsefninu og vinna með þau"],["geta valið þær aðferðir sem við eiga hverju sinni til að leysa verkefni og beita þeim rétt"],["skrá lausnir sínar skipulega og útskýra þær skilmerkilega fyrir öðrum"],["geta fylgt og skilið röksemdafærslu í mæltu máli og í texta"],["leysa margvísleg viðfangsefni í öðrum námsgreinum og daglegu lífi"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93a1","a":"STÆR3DE05","t":"Föll, markgildi, deildun og heildun","s":"stærðfræði","o":"deildun","d":"Meginefni áfangans eru föll, markgildi, deildareikningur og kynning á heildun.\r\n\r\nEfnisþættir sem teknir verða fyrir í áfanganum eru:\r\n\r\nFöll:   Veldisföll, vísisföll, lograföll, andhverf föll, samskeytt föll, eintæk, átæk og gagntæk föll.\r\n\r\nMarkgildi og deildun:   Markgildishugtakið. Skilgreining á afleiðu falls. Deildun veldisfalla, vísisfalla, lografalla og hornafalla. Reiknireglur fyrir deildun margfeldis, ræðra falla og samskeyttra falla. Samfeldni og deildanleiki falla. Aðfellur. Hagnýting deildunar við könnun falla, s.s. að finna staðbundin hágildi og lággildi, einhallabil, beygjuskil og jöfnu snertils. Gröf falla. Notkun deildareiknings við hagnýt viðfangsefni, t.d. útreikning á hraða og hröðun. Söguleg þróun deildareiknings.\r\n\r\nHeildun:  Kynning á heildun, stofnföll einfaldra veldis-, vísis-, logra- og hornafalla. Ákveðið og óákveðið heildi. Flatarmál svæða sem afmarkast af gröfum falla reiknað með heildun. Samband vegalendar, hraða og hröðunar.\r\n","c":5,"l":3,"v":24,"st":"Samþykkt af skóla","m":1353001027,"p":"STÆR2HV05","k":["föllum, markgildum og deildun, s.s. að framan greinir og hafa fengið nasasjón af heildun"],"sk":["vinna með vísis- og lograföll með mismunandi grunntölum","finna andhverfur falla og að skeyta sama föllum","nota markgildi og skilgreiningu á afleiðu falls","deilda veldisföll, vísisföll, lograföll og hornaföll og að nota reiknireglur fyrir deildun margfeldis, ræðra falla og samskeyttra falla","nota deildareikning við könnun falla, einkum að finna staðbundin útgildi, einhallabil, beygjuskil,  jöfnu snertils, aðfellur og að teikna gröf falla og að kanna samfeldni og deildanleika falla","finna stofnföll einfaldra falla s.s. veldisfalla, vísisfalla, lnx, cosx og sinx, reikna ákveðið og óákveðið heildi og reikna flatarmál svæða sem afmarkast af einföldum föllum","leysa hagnýt dæmi þar sem beita þarf deildun eða einfaldri heildun, t.d. útreikningum á vegalengd, hraða eða hröðun"],"co":[["skilja merkingu og tengsl hugtaka í námsefninu og vinna með þau"],["velja þær aðferðir sem við eiga hverju sinni til að leysa verkefni og beita þeim rétt"],["skrá lausnir sínar skipulega og útskýra þær skilmerkilega fyrir öðrum"],["fylgja og skilja röksemdafærslu í mæltu máli og í texta"],["leysa margvísleg viðfangsefni í öðrum námsgreinum og daglegu lífi"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93a2","a":"STÆR3HD05","t":"Heildun og deildajöfnur","s":"stærðfræði","o":"deildajöfnun, heildun, raðir, runur","d":"Meginefni áfangans eru heildun, heildunaraðferðir, flatarmáls- og rúmmálsreikningar með heildi, deildajöfnur af fyrsta stigi, runur og raðir.\r\n\r\nEfnisþættir sem teknir verða fyrir í áfanganum eru:\r\n\r\nHeildun:  Stofnföll,  ákveðið og óákveðið heildi. Reiknireglur fyrir heildi. Flatarmál svæða sem afmarkast af gröfum falla reiknað með heildun. Hagnýting heilda, t.d. við lausn verkefna sem tengjast fjölda, magni, vegalendum og hraða. Heildunaraðferðir, s.s. innsetning, hlutheildun og liðun í stofnbrot. Rúmmál snúðs þegar snúið er um x –ás eða y – ás. Tengsl deildunar og heildunar.\r\n\r\nDeildajöfnur:  Fyrsta stigs deildajöfnur af ýmsum gerðum, s.s. óhliðraðar (y´+ ay = 0),   hliðraðar (y‘ + ay = f(x)),  aðskiljanlegar ( g(y)• y‘ = f(x) ) og leysanlegar með heildunarþætti (y‘ + g(x)•y = f(x)). Notkun deildajafna við lausn hagnýtra dæma af ólíkum toga.\r\n\r\nRunur og raðir:  Endanlegar og óendanlegar runur og raðir. Jafnmuna- og jafnhlutfallarunur og raðir.  Samleitnar, óendanlegar jafnhlutfallaraðir.  Hagnýting runa og raða í verkefnum tengdum fjármálum og náttúruvísindum. Sannanir með stærðfræðilegri þrepun.","c":5,"l":3,"v":25,"st":"Samþykkt af skóla","m":1353001710,"p":"STÆR3DE05","k":["heildun, fyrsta stigs deildajöfnu, runum og röðum, s.s. að framan greinir"],"sk":["finna stofnföll og beita heildunaraðferðum til að heilda flóknari föll","reikna ákveðin heildi og finna flatarmál og rúmmál með heildareikningi","greina á milli ólíkra gerða fyrsta stigs deildajafna og leysa þær með viðeigandi aðferðum","vinna með jafnmuna- og jafnhlutfallarunur og raðir","nota þrepunarlögmálið til þess að sanna að fullyrðing gildi um allar náttúrulegar tölur","leysa hagnýt dæmi þar sem nota má heildun, deildajöfnur eða runur og raðir"],"co":[["skilja merkingu og tengsl hugtaka í námsefninu og vinna með þau"],["velja þær aðferðir sem við eiga hverju sinni til að leysa verkefni og beita þeim rétt"],["skrá lausnir sínar skipulega og útskýra þær skilmerkilega fyrir öðrum"],["fylgja og skilja röksemdafærslu í mæltu máli og í texta"],["leysa margvísleg viðfangsefni í öðrum námsgreinum og daglegu lífi"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93a3","a":"STÆR3ÞR05","t":"Þrívíð rúmfræði","s":"stærðfræði","o":"þrívíð rúmfræði","d":"Meginefni áfangans er þrívíð rúmfræði, með og án hnitakerfis, og keilusnið.\r\n\r\nEfnisþættir sem teknir verða fyrir í áfanganum eru:\r\n\r\nFlatarmyndafræði:  Unnið fyrst og fremst með línur og þríhyrninga í fletinum. Vigurjafna og stikaform línu. Þungamiðja þríhyrnings.\r\n\r\nÞrívíð rúmfræði:  Frumsendukerfi Evklíðs, helstu frumsendur rúmfræðinnar. Margflötungar, vigrar í þrívídd og hnit þeirra, jöfnur og stikaform sléttu, línu og ferla, lausnir á jöfnum, útreikningar á hornum og fjarlægðum, rúmmálsreikingar og vigurfeldi.\r\n\r\nKeilusnið:  Jöfnur og gröf fleygboga, hringja, sporbauga og breiðboga.\r\n\r\nFylki, ákveður og jöfnuhneppi:  Kynning á fylkjum og ákveðum. Aðferð Gauss-Jordan við lausn þrívíðra jöfnuhneppa. Notkun reiknivéla við fylkjareikning og lausn jöfnuhneppa.","c":5,"l":3,"v":26,"st":"Samþykkt af skóla","m":1353002333,"p":"STÆR3DE05","k":["tvívíðri og þrívíðri rúmfræði, þrívíðum vigurreikingi og keilusniðum, s.s. að framan greinir og                hafa fengið nasasjón af fylkjum, ákveðum og jöfnuhneppum"],"sk":["vinna með línur og fleiri form í fletinum og síðan í þrívíðu rúmi og nota jöfnu- og stikaform","skilja frumsendukerfi Evklíðs og vinna með frumsendur rúmfræðinnar, sanna helstu reglur","nota þrívíðan vigurreikning og reikna t.d. fjarlægðir eða horn milli punkta, lína eða slétta í rúminu","nota vigurfeldi við flatar- og rúmmálsreikninga í þrívíðu rúmi","vinna með keilusnið","leysa þrívíð jöfnuhneppi"],"co":[["skilja merkingu og tengsl hugtaka í námsefninu og vinna með þau"],["geta valið þær aðferðir sem við eiga hverju sinni til að leysa verkefni og beita þeim rétt"],["skrá lausnir sínar skipulega og útskýra þær skilmerkilega fyrir öðrum"],["fylgja og skilja röksemdafærslu í mæltu máli og í texta"],["leysa margvísleg viðfangsefni í öðrum námsgreinum og daglegu lífi"],["vinna sjálfstætt eða með jafningjum að lausn margvíslegra flókinna, stærðfræðilegra viðfangsefna"]],"sc":[{"n":"Menntaskólinn á Egilsstöðum","a":"me"}]},{"i":"51265b3d62933a77194c93a6","a":"SAGA2ÞJ05","t":"Þjóðfræði","s":"saga","o":"alþýðumenning, hversdagslíf, þjóðfræði","d":"Fjallað er í grundvallaratriðum um þrískiptingu þjóðfræðinnar í þjóðháttafræði, þjóðlífsfræði og þjóðsagnafræði. Nemendur læra um daglegt líf í íslenska bændasamfélaginu, ýmsa þætti í verkmenningu þess samfélags meðal karla, kvenna og barna til sjávar og sveita. Farið er í menningarlíf bændasamfélagsins og fjallað m.a. um helstu siði, venjur, trú og hjátrú.\r\n \r\nNemendur læra um helstu flokka þjóðsagna og uppruna íslenskra ævintýra, hlutverk þjóðsagna fyrir samfélagið og fái innsýn í helstu atriði við greiningu þjóðsagna. Áhersla er lögð á þjóðsögur úr nærumhverfinu þar sem reynt er að draga fram sérkenni austfirskra sagna.  Hugtakið þjóðsagnahefð er tekið til umfjöllunar og tengsl þjóðsagna við samfélagið skoðuð. Lesnar eru nokkrar nútíma flökkusögur og rætt um hlutverk þeirra.\r\n\r\nMeginmarkmið áfangans er að nemendur geri sér grein fyrir alþýðumenningu íslenska bændasamfélagsins og  geti lagt gagnrýnið mat á þýðingu hennar fyrir nútímann.","c":5,"l":2,"v":9,"st":"Samþykkt af skóla","m":1353073875,"p":"FÉLV1ÞF05","k":["helstu atriðum verkmenningar meðal karla og kvenna í íslenska bændasamfélaginu til sjávar og sveita","helstu siðum og venjum íslensks alþý
